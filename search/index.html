<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>검색 | DisolveWorks</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 17% 0,rgba(70,95,180,.14),transparent 30%),#080b12;color:#f2f5fb;font-family:'Segoe UI','Malgun Gothic',sans-serif}
.wrap{max-width:1040px;margin:auto;padding:45px 24px 70px}.back{color:#8fa8ff;text-decoration:none;font-size:13px}.head{margin:32px 0 20px}h1{font-size:38px;margin:0 0 8px}.sub{font-size:12px;color:#7d899f}
.searchbar{display:flex;gap:10px;margin:24px 0}.searchbar input{flex:1;background:#101622;border:1px solid #2c3850;border-radius:13px;color:#fff;padding:15px 16px;font-size:15px;outline:none}.searchbar input:focus{border-color:#6685ea}.searchbar button{border:0;border-radius:13px;background:#7590ff;color:white;font-weight:800;padding:0 21px;cursor:pointer}
.results{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.card{display:block;text-decoration:none;color:white;background:#111827;border:1px solid #263244;border-radius:15px;padding:19px;min-height:135px}.card:hover{border-color:#5c7ce5}.badge{display:inline-block;font-size:10px;font-weight:900;color:#bdc9ff;background:#1d2945;border:1px solid #334971;border-radius:999px;padding:4px 7px}.title{font-size:20px;font-weight:850;margin-top:14px}.meta{font-size:11px;color:#748198;margin-top:7px}.pin{color:#f2bf63;margin-left:7px}.empty{color:#657188;padding:30px 0}
</style>
</head>
<body>
<main class="wrap">
<a class="back" href="../">← DisolveWorks</a>
<div class="head"><h1>전체 검색</h1><div class="sub">씬 번호 · 제목 · 파일명 · 부로 검색할 수 있습니다.</div></div>
<div class="searchbar"><input id="q" placeholder="예: 46씬, CRM, 사내메일, 4부"><button onclick="run()">검색</button></div>
<div id="status" class="sub"></div><div id="results" class="results"></div>
</main>
<script>
const staticItems=[
 {projectName:"피라밋",part:"1부",partNum:1,scene:"46씬",title:"진술서",filename:"진술서.html",url:"../pyramid/part1/statement.html",pinned:false},
 {projectName:"피라밋",part:"2부",partNum:2,scene:"33씬",title:"준우 게임기",filename:"police-game.html",url:"../apps/police-game.html",pinned:false},
 {projectName:"피라밋",part:"2부",partNum:2,scene:"40씬",title:"비트원 거래소 화면",filename:"bitone.html",url:"../pyramid/part2/bitone.html",pinned:false},
 {projectName:"피라밋",part:"4부",partNum:4,scene:"23씬",title:"고객상담 CRM 시스템",filename:"고객상담_CRM_시스템.html",url:"../pyramid/part4/crm.html",pinned:false}
];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')run()});
async function run(){
 const q=document.getElementById('q').value.trim().toLowerCase();
 if(!q){document.getElementById('results').innerHTML='';document.getElementById('status').textContent='검색어를 입력하세요.';return;}
 document.getElementById('status').textContent='검색 중...';
 let uploaded=[];
 try{const r=await fetch('/.netlify/functions/catalog?project=pyramid&q='+encodeURIComponent(q));uploaded=(await r.json()).items||[];}catch{}
 const stat=staticItems.filter(x=>[x.projectName,x.part,x.scene,x.title,x.filename].join(' ').toLowerCase().includes(q));
 const all=[...stat,...uploaded];
 document.getElementById('status').textContent=`${all.length}개 결과`;
 document.getElementById('results').innerHTML=all.length?all.map(x=>`<a class="card" href="${x.url}" target="_blank"><span class="badge">${esc(x.part)} · ${esc(x.scene)}</span>${x.pinned?'<span class="pin">★</span>':''}<div class="title">${esc(x.title)}</div><div class="meta">${esc(x.projectName||'피라밋')} · ${esc(x.filename||'')}</div></a>`).join(''):'<div class="empty">검색 결과가 없습니다.</div>';
}
const params=new URLSearchParams(location.search);if(params.get('q')){document.getElementById('q').value=params.get('q');run();}
</script>
</body></html>
