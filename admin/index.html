<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DisolveWorks Admin</title>
<style>
:root{--bg:#080a10;--panel:#10141e;--panel2:#151b28;--line:#273147;--text:#f6f7fb;--muted:#8b96ab;--accent:#8fa8ff;--ok:#65d6a3;--bad:#ff7b7b;--warn:#f0be65}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 18% 0,rgba(72,96,180,.17),transparent 32%),var(--bg);color:var(--text);font-family:Inter,"Segoe UI","Malgun Gothic",sans-serif}
.wrap{max-width:1180px;margin:auto;padding:34px 24px 70px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:35px}
.brand{font-weight:900;letter-spacing:.14em}.brand span{color:var(--accent)}a{color:#9fb5ff;text-decoration:none}
.panel{background:rgba(16,20,30,.94);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px}
.login{max-width:460px;margin:110px auto}h1{font-size:28px;margin:0 0 7px}.sub{color:var(--muted);font-size:12px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.full{grid-column:1/-1}
label{font-size:11px;color:#909bb0;display:block;margin:0 0 7px}input,select{width:100%;border:1px solid #303b51;background:#0b0f17;color:#f5f7fb;border-radius:10px;padding:11px 12px;outline:none}
input:focus,select:focus{border-color:#718cff}.filebox{border:1px dashed #3a465e;padding:14px;border-radius:12px;background:#0b0f17}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;background:#7590ff;color:white}.btn.secondary{background:#20283a;color:#dce3f5}.btn.danger{background:#44242a;color:#ffb3b3}.btn.warn{background:#443a21;color:#f5d892}.btn.ok{background:#214437;color:#9fe7c8}.btn.small{font-size:11px;padding:7px 9px}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:15px}.status{font-size:12px;color:var(--muted)}.oktxt{color:var(--ok)}.badtxt{color:var(--bad)}
.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.toolbar .search{max-width:430px}.tabs{display:flex;gap:8px;margin:18px 0 8px}
.tab{padding:8px 12px;border-radius:999px;border:1px solid #2d3850;background:#121826;color:#97a4ba;cursor:pointer;font-size:11px}.tab.active{background:#253354;color:#dce5ff;border-color:#4a63a4}
.item{display:grid;grid-template-columns:82px minmax(220px,1fr) auto;gap:14px;align-items:center;padding:15px 0;border-bottom:1px solid #202738}.item:last-child{border-bottom:0}
.scene{font-weight:900;font-size:14px}.name{font-weight:800;font-size:15px}.meta{font-size:11px;color:#7e899f;margin-top:5px}.flags{font-size:10px;margin-top:5px}.pin{color:#f0be65}.hidden{color:#9a87d7}.trash{color:#d77a7a}.item-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.check{display:flex;align-items:center;gap:8px;color:#b6c0d3;font-size:12px}.check input{width:auto}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.68);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.show{display:flex}.modal-card{width:min(560px,100%);background:#10151f;border:1px solid #2b3750;border-radius:18px;padding:22px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.x{background:none;border:0;color:#9aa7bc;font-size:22px;cursor:pointer}
@media(max-width:760px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.item{grid-template-columns:70px 1fr}.item-actions{grid-column:1/-1;justify-content:flex-start}.top{align-items:flex-start}.wrap{padding:25px 15px}}
</style>
</head>
<body>
<div id="loginView" class="wrap">
  <div class="panel login">
    <div class="brand">DISOLVE<span>WORKS</span></div>
    <h1 style="margin-top:26px">관리자 로그인</h1>
    <div class="sub">관리자 비밀번호로 로그인하세요.</div>
    <input id="password" type="password" placeholder="관리자 비밀번호">
    <div class="actions"><button class="btn" onclick="login()">로그인</button><span id="loginStatus" class="status"></span></div>
  </div>
</div>

<div id="adminView" class="wrap" style="display:none">
  <div class="top"><div><div class="brand">DISOLVE<span>WORKS</span></div><div class="sub" style="margin:6px 0 0">CONTENT ADMIN</div></div>
  <div><a href="../">사이트 보기</a> · <a href="#" onclick="logout();return false;">로그아웃</a></div></div>

  <section class="panel">
    <h1>새 파일 업로드</h1>
    <div class="sub">사이트에는 <b>씬 번호 + 화면 제목</b>으로 표시됩니다.</div>
    <form id="uploadForm">
      <div class="grid">
        <div><label>프로젝트</label><select id="project" name="project"><option value="pyramid" data-name="피라밋">피라밋</option></select></div>
        <div><label>부</label><select id="part" name="part"></select></div>
        <div><label>씬</label><input id="scene" name="scene" placeholder="예: 46" required></div>
        <div><label>화면 제목</label><input id="title" name="title" placeholder="예: 진술서 / 사내메일"></div>
        <div class="full"><label>파일</label><div class="filebox"><input type="file" id="file" name="file" required accept=".html,.htm,.png,.jpg,.jpeg,.webp,.gif,.pdf,.pptx,.xlsx,.docx,.txt,.zip"></div></div>
        <div><label class="check"><input type="checkbox" id="visible" checked> 일반 사이트에 공개</label></div>
        <div><label class="check"><input type="checkbox" id="pinned"> 상단 고정</label></div>
      </div>
      <div class="actions"><button class="btn" type="submit">업로드</button><span id="uploadStatus" class="status">파일당 최대 4MB</span></div>
    </form>
  </section>

  <section class="panel">
    <div class="toolbar">
      <div><h1 style="font-size:22px">콘텐츠 관리</h1><div class="sub" style="margin:3px 0 0">검색 · 수정 · 교체 · 숨김 · 고정 · 휴지통</div></div>
      <input id="adminSearch" class="search" placeholder="씬, 제목, 파일명, 부 검색">
    </div>
    <div class="tabs"><button class="tab active" data-tab="active" onclick="setTab('active')">활성 파일</button><button class="tab" data-tab="trash" onclick="setTab('trash')">휴지통</button></div>
    <div id="items"><div class="status">불러오는 중...</div></div>
  </section>
</div>

<div id="editModal" class="modal">
  <div class="modal-card">
    <div class="modal-head"><h1 style="font-size:21px">정보 수정</h1><button class="x" onclick="closeModal('editModal')">×</button></div>
    <input type="hidden" id="editKey">
    <div class="grid">
      <div><label>부</label><select id="editPart"></select></div>
      <div><label>씬</label><input id="editScene"></div>
      <div class="full"><label>화면 제목</label><input id="editTitle"></div>
      <div><label class="check"><input type="checkbox" id="editVisible"> 일반 사이트에 공개</label></div>
      <div><label class="check"><input type="checkbox" id="editPinned"> 상단 고정</label></div>
    </div>
    <div class="actions"><button class="btn" onclick="saveEdit()">저장</button><button class="btn secondary" onclick="closeModal('editModal')">취소</button></div>
  </div>
</div>

<div id="replaceModal" class="modal">
  <div class="modal-card">
    <div class="modal-head"><h1 style="font-size:21px">파일 교체</h1><button class="x" onclick="closeModal('replaceModal')">×</button></div>
    <div class="sub" id="replaceName"></div>
    <input type="hidden" id="replaceKey">
    <div class="filebox"><input type="file" id="replaceFile"></div>
    <div class="actions"><button class="btn" onclick="replaceFile()">교체하기</button><button class="btn secondary" onclick="closeModal('replaceModal')">취소</button><span id="replaceStatus" class="status"></span></div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
let allItems=[], currentTab='active';
for(let i=1;i<=12;i++){for(const id of ['part','editPart']){const o=document.createElement('option');o.value=i;o.textContent=i+'부';document.getElementById(id).appendChild(o);}}

async function login(){const r=await fetch('/.netlify/functions/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#password').value})});const j=await r.json().catch(()=>({}));if(!r.ok){$('#loginStatus').textContent=j.error||'로그인 실패';$('#loginStatus').className='status badtxt';return;}showAdmin();}
async function logout(){await fetch('/.netlify/functions/admin-logout',{method:'POST'});location.reload();}
async function checkSession(){const r=await fetch('/.netlify/functions/admin-list');if(r.ok){$('#loginView').style.display='none';$('#adminView').style.display='block';const j=await r.json();allItems=j.items||[];renderItems();}}
async function showAdmin(){$('#loginView').style.display='none';$('#adminView').style.display='block';await loadItems();}
$('#password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});

$('#uploadForm').addEventListener('submit',async e=>{
  e.preventDefault(); const f=$('#file').files[0]; if(!f)return;
  const fd=new FormData(), opt=$('#project').selectedOptions[0];
  fd.append('project',$('#project').value);fd.append('projectName',opt.dataset.name||opt.textContent);
  fd.append('part',$('#part').value);fd.append('scene',$('#scene').value);fd.append('title',$('#title').value);
  fd.append('visible',$('#visible').checked?'true':'false');fd.append('pinned',$('#pinned').checked?'true':'false');fd.append('file',f);
  $('#uploadStatus').textContent='업로드 중...';
  const r=await fetch('/.netlify/functions/admin-upload',{method:'POST',body:fd});const j=await r.json().catch(()=>({}));
  if(!r.ok){$('#uploadStatus').textContent=j.error||'업로드 실패';$('#uploadStatus').className='status badtxt';return;}
  $('#uploadStatus').textContent=`업로드 완료 ✓ ${$('#part').value}부 · ${$('#scene').value.replace(/씬$/,'')}씬 · ${$('#title').value||f.name.replace(/\.[^.]+$/,'')}`;
  $('#uploadStatus').className='status oktxt';$('#file').value='';$('#title').value='';await loadItems();
});

async function loadItems(){const r=await fetch('/.netlify/functions/admin-list',{cache:'no-store'});if(r.status===401){location.reload();return;}const j=await r.json().catch(()=>({}));if(!r.ok){alert((j&&j.error)?j.error:('목록을 불러오지 못했습니다 ('+r.status+')'));return;}allItems=j.items||[];renderItems();}
function setTab(t){currentTab=t;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));renderItems();}
$('#adminSearch').addEventListener('input',renderItems);

function renderItems(){
  const q=$('#adminSearch').value.trim().toLowerCase();
  let items=allItems.filter(x=>currentTab==='trash'?!!x.deleted:!x.deleted);
  if(q)items=items.filter(x=>[x.part,x.scene,x.title,x.filename].join(' ').toLowerCase().includes(q));
  const box=$('#items');
  if(!items.length){box.innerHTML='<div class="status" style="padding:20px 0">표시할 파일이 없습니다.</div>';return;}
  box.innerHTML=items.map(x=>`<div class="item">
    <div class="scene">${esc(x.scene||'')}</div>
    <div><div class="name">${esc(x.title||x.filename||'')}</div><div class="meta">${esc(x.part||'')} · ${esc(x.filename||'')} · ${fmtSize(Number(x.size||0))}</div>
    <div class="flags">${x.pinned?'<span class="pin">★ 상단 고정</span> ':''}${x.visible===false?'<span class="hidden">● 숨김</span> ':''}${x.deleted?'<span class="trash">● 휴지통</span>':''}</div></div>
    <div class="item-actions">
      ${x.deleted
       ? `<button class="btn ok small" onclick='trashAction(${JSON.stringify(x.key)},"restore")'>복구</button><button class="btn danger small" onclick='trashAction(${JSON.stringify(x.key)},"purge")'>완전삭제</button>`
       : `<a class="btn secondary small" target="_blank" href="${x.url}">열기</a><button class="btn secondary small" onclick='openEdit(${JSON.stringify(x.key)})'>수정</button><button class="btn secondary small" onclick='openReplace(${JSON.stringify(x.key)})'>파일교체</button><button class="btn warn small" onclick='quickPin(${JSON.stringify(x.key)},${!x.pinned})'>${x.pinned?'고정해제':'고정'}</button><button class="btn danger small" onclick='trashAction(${JSON.stringify(x.key)},"trash")'>휴지통</button>`}
    </div>
  </div>`).join('');
}
function itemByKey(k){return allItems.find(x=>x.key===k);}
function openEdit(k){const x=itemByKey(k);if(!x)return;$('#editKey').value=k;$('#editPart').value=x.partNum||parseInt(x.part);$('#editScene').value=(x.sceneRaw||x.scene||'').replace(/씬$/,'');$('#editTitle').value=x.title||'';$('#editVisible').checked=x.visible!==false;$('#editPinned').checked=!!x.pinned;$('#editModal').classList.add('show');}
async function saveEdit(){const body={key:$('#editKey').value,partNum:Number($('#editPart').value),sceneRaw:$('#editScene').value,title:$('#editTitle').value,visible:$('#editVisible').checked,pinned:$('#editPinned').checked};const j=await apiPost('/.netlify/functions/admin-update',body);if(!j)return;closeModal('editModal');await loadItems();}
async function quickPin(key,pinned){const j=await apiPost('/.netlify/functions/admin-update',{key,pinned});if(j)loadItems();}
function openReplace(k){const x=itemByKey(k);$('#replaceKey').value=k;$('#replaceName').textContent=`${x.scene} · ${x.title||x.filename}`;$('#replaceFile').value='';$('#replaceStatus').textContent='';$('#replaceModal').classList.add('show');}
async function replaceFile(){const f=$('#replaceFile').files[0];if(!f)return alert('교체할 파일을 선택해 주세요.');const fd=new FormData();fd.append('key',$('#replaceKey').value);fd.append('file',f);$('#replaceStatus').textContent='교체 중...';const r=await fetch('/.netlify/functions/admin-replace',{method:'POST',body:fd});const j=await r.json().catch(()=>({}));if(!r.ok){$('#replaceStatus').textContent=j.error||('교체 실패 ('+r.status+')');return;}closeModal('replaceModal');await loadItems();}
async function apiPost(path,body){
  try{
    const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const j=await r.json().catch(()=>({}));
    if(r.status===401){alert('로그인이 풀렸습니다. 다시 로그인해 주세요.');location.reload();return null;}
    if(!r.ok){alert((j&&j.error)?j.error:('요청 실패 ('+r.status+')'));return null;}
    return j;
  }catch(e){alert('네트워크 오류: '+e.message);return null;}
}
async function trashAction(key,action){
  if(action==='purge'&&!confirm('완전히 삭제하면 복구할 수 없습니다. 계속할까요?'))return;
  if(action==='trash'&&!confirm('휴지통으로 이동할까요?'))return;
  const j=await apiPost('/.netlify/functions/admin-trash',{key,action});
  if(!j)return;
  await loadItems();
  const still=allItems.find(x=>x.key===key);
  if(action==='trash'&&still&&!still.deleted){alert('서버에는 반영됐지만 목록이 아직 예전 상태입니다. 잠시 후 새로고침해 주세요.');}
}
function closeModal(id){document.getElementById(id).classList.remove('show');}
function fmtSize(n){if(n<1024)return n+' B';if(n<1024*1024)return(n/1024).toFixed(1)+' KB';return(n/1024/1024).toFixed(1)+' MB';}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
checkSession();
</script>
</body></html>
