<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DisolveWorks Admin</title>
<style>
:root{--bg:#080a10;--panel:#10141e;--panel2:#151b28;--line:#273147;--text:#f6f7fb;--muted:#8b96ab;--accent:#8fa8ff;--ok:#65d6a3;--bad:#ff7b7b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,rgba(76,98,180,.17),transparent 32%),var(--bg);color:var(--text);font-family:Inter,"Segoe UI","Malgun Gothic",sans-serif}
.wrap{max-width:1120px;margin:auto;padding:34px 24px 70px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:44px}.brand{font-weight:900;letter-spacing:.14em}.brand span{color:var(--accent)}
a{color:#9fb5ff;text-decoration:none}.panel{background:rgba(16,20,30,.94);border:1px solid var(--line);border-radius:20px;padding:24px;margin-bottom:18px}.login{max-width:460px;margin:110px auto}
h1{font-size:30px;margin:0 0 8px}.sub{color:var(--muted);font-size:13px;margin-bottom:24px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
label{font-size:11px;color:#909bb0;display:block;margin:0 0 7px;letter-spacing:.04em}.full{grid-column:1/-1}
input,select{width:100%;border:1px solid #303b51;background:#0b0f17;color:#f5f7fb;border-radius:11px;padding:12px 13px;outline:none}
input:focus,select:focus{border-color:#718cff}.filebox{border:1px dashed #3a465e;padding:16px;border-radius:13px;background:#0b0f17}
.btn{border:0;border-radius:11px;padding:12px 17px;font-weight:800;cursor:pointer;background:#7590ff;color:white}.btn.secondary{background:#20283a;color:#dce3f5}.btn.danger{background:#44242a;color:#ffb3b3}
.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:18px}.status{font-size:12px;color:var(--muted)}.ok{color:var(--ok)}.bad{color:var(--bad)}
.item{display:grid;grid-template-columns:110px 90px 1fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #202738}.item:last-child{border-bottom:0}
.scene{font-weight:900}.pill{font-size:10px;color:#b8c5df;background:#1c2434;padding:5px 8px;border-radius:999px;text-align:center}.name{font-weight:700}.meta{font-size:11px;color:#7e899f;margin-top:4px}
.small{font-size:11px;padding:8px 10px;border-radius:9px}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.check{display:flex;align-items:center;gap:8px;color:#b6c0d3;font-size:12px}.check input{width:auto}
@media(max-width:720px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.item{grid-template-columns:70px 1fr}.item .part{display:none}.item .item-actions{grid-column:1/-1}.top{align-items:flex-start}.wrap{padding:25px 15px}}
</style>
</head>
<body>
<div id="loginView" class="wrap">
  <div class="panel login">
    <div class="brand">DISOLVE<span>WORKS</span></div>
    <h1 style="margin-top:28px">관리자 로그인</h1>
    <div class="sub">Netlify 환경변수에 설정한 관리자 비밀번호를 입력하세요.</div>
    <input id="password" type="password" placeholder="관리자 비밀번호" autocomplete="current-password">
    <div class="actions"><button class="btn" onclick="login()">로그인</button><span id="loginStatus" class="status"></span></div>
  </div>
</div>

<div id="adminView" class="wrap" style="display:none">
  <div class="top"><div><div class="brand">DISOLVE<span>WORKS</span></div><div class="sub" style="margin:6px 0 0">CONTENT ADMIN</div></div>
  <div><a href="../">사이트 보기</a> &nbsp;·&nbsp; <a href="#" onclick="logout();return false;">로그아웃</a></div></div>

  <section class="panel">
    <h1>파일 업로드</h1>
    <div class="sub">프로젝트와 씬을 선택하면 업로드 자료가 해당 부의 목록에 자동으로 표시됩니다.</div>
    <form id="uploadForm">
      <div class="grid">
        <div><label>프로젝트</label><select name="project" id="project"><option value="pyramid" data-name="피라밋">피라밋</option></select></div>
        <div><label>부</label><select name="part" id="part"></select></div>
        <div><label>씬</label><input name="scene" id="scene" placeholder="예: 46" required></div>
        <div><label>화면 이름</label><input name="title" id="title" placeholder="예: 진술서 / 고객상담 CRM"></div>
        <div class="full"><label>파일</label><div class="filebox"><input type="file" name="file" id="file" required accept=".html,.htm,.png,.jpg,.jpeg,.webp,.gif,.pdf,.pptx,.xlsx,.docx,.txt,.zip"></div></div>
        <div class="full"><label class="check"><input type="checkbox" id="visible" checked> 일반 프로젝트 페이지에서 보이게 하기</label></div>
      </div>
      <div class="actions"><button class="btn" type="submit">업로드</button><span id="uploadStatus" class="status">파일당 최대 4MB</span></div>
    </form>
  </section>

  <section class="panel">
    <div class="toolbar"><div><h1 style="font-size:22px">등록된 파일</h1><div class="sub" style="margin:4px 0 0">웹에서 올린 자료만 표시됩니다.</div></div><button class="btn secondary small" onclick="loadItems()">새로고침</button></div>
    <div id="items"><div class="status">불러오는 중...</div></div>
  </section>
</div>

<script>
const $ = s => document.querySelector(s);
for(let i=1;i<=12;i++){ const o=document.createElement('option'); o.value=i; o.textContent=i+'부'; $('#part').appendChild(o); }

async function login(){
  $('#loginStatus').textContent='확인 중...';
  const r=await fetch('/.netlify/functions/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#password').value})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){ $('#loginStatus').textContent=j.error||'로그인 실패'; $('#loginStatus').className='status bad'; return; }
  showAdmin();
}
async function logout(){ await fetch('/.netlify/functions/admin-logout',{method:'POST'}); location.reload(); }
async function showAdmin(){
  $('#loginView').style.display='none'; $('#adminView').style.display='block'; await loadItems();
}
async function checkSession(){
  const r=await fetch('/.netlify/functions/admin-list');
  if(r.ok){ $('#loginView').style.display='none'; $('#adminView').style.display='block'; renderItems((await r.json()).items||[]); }
}
$('#password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});

$('#uploadForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const f=$('#file').files[0];
  if(!f) return;
  if(f.size>4*1024*1024){ $('#uploadStatus').textContent='4MB를 초과했습니다.'; $('#uploadStatus').className='status bad'; return; }
  const fd=new FormData();
  const option=$('#project').selectedOptions[0];
  fd.append('project',$('#project').value); fd.append('projectName',option.dataset.name||option.textContent);
  fd.append('part',$('#part').value); fd.append('scene',$('#scene').value); fd.append('title',$('#title').value);
  fd.append('visible',$('#visible').checked?'true':'false'); fd.append('file',f);
  $('#uploadStatus').textContent='업로드 중...'; $('#uploadStatus').className='status';
  const r=await fetch('/.netlify/functions/admin-upload',{method:'POST',body:fd});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){ $('#uploadStatus').textContent=j.error||'업로드 실패'; $('#uploadStatus').className='status bad'; return; }
  $('#uploadStatus').textContent='업로드 완료 ✓'; $('#uploadStatus').className='status ok';
  $('#file').value=''; $('#title').value=''; await loadItems();
});
async function loadItems(){
  const r=await fetch('/.netlify/functions/admin-list');
  if(r.status===401){ location.reload(); return; }
  const j=await r.json().catch(()=>({items:[]}));
  renderItems(j.items||[]);
}
function fmtSize(n){ if(n<1024)return n+' B'; if(n<1024*1024)return (n/1024).toFixed(1)+' KB'; return (n/1024/1024).toFixed(1)+' MB'; }
function renderItems(items){
  const box=$('#items');
  if(!items.length){ box.innerHTML='<div class="status">아직 웹에서 업로드한 파일이 없습니다.</div>'; return; }
  box.innerHTML=items.map(x=>`<div class="item">
    <div class="scene">${esc(x.scene||'')}</div>
    <div class="part"><span class="pill">${esc(x.part||'')}</span></div>
    <div><div class="name">${esc(x.title||x.filename||'')}</div><div class="meta">${esc(x.filename||'')} · ${fmtSize(Number(x.size||0))} · ${x.visible===false?'숨김':'공개'}</div></div>
    <div class="item-actions"><a class="btn secondary small" target="_blank" href="${x.url}">열기</a> <button class="btn danger small" onclick='removeItem(${JSON.stringify(x.key)})'>삭제</button></div>
  </div>`).join('');
}
async function removeItem(key){
  if(!confirm('이 파일을 삭제할까요?')) return;
  const r=await fetch('/.netlify/functions/admin-delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key})});
  if(r.ok) loadItems(); else alert('삭제하지 못했습니다.');
}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
checkSession();
</script>
</body></html>
