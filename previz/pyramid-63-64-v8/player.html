const v=document.getElementById('video'),$=id=>document.getElementById(id),fields=['size','height','direction','move','note'];

function save(){if(!selected){$('status').textContent='먼저 현재 컷 메모 또는 컷 목록을 눌러주세요.';return}const n={...selected};for(const f of fields)n[f]=$(f).value;notes[selected.location+'|'+selected.key]=n;try{localStorage.setItem(store,JSON.stringify(notes));$('status').textContent='브라우저에 저장됨 · 전달하려면 파일 저장'}catch(e){$('status').textContent='파일 저장 버튼으로 보관해주세요.'}}
for(const f of fields)$(f).addEventListener('input',save);
const roadBasis={"cheongju": "청주 상가·호수변 로드뷰 참고 / 회전교차로는 연출안", "wonju": "원주 건강로 로드뷰 참고 / 회전교차로 진입부 횡단보도"};function city(){return loc==='청주 오송'?'cheongju':'wonju'}function load(){$('basis').textContent=roadBasis[city()];let last='';$('chapters').innerHTML='';let at=0;for(const s of list()){let g=s.key.split('-')[0];if(g!==last){let h=document.createElement('h2');h.textContent=names[g];$('chapters').appendChild(h);last=g}let b=document.createElement('button');b.className='shot';b.dataset.start=at;b.dataset.end=at+s.dur;const seek=at;b.innerHTML='<img loading="lazy" src="thumbs/'+city()+'/'+s.key+'.jpg" alt=""><span><b>'+s.key+'</b> '+Number(s.dur.toFixed(2))+'초<small>'+s.desc+'</small></span>';b.onclick=()=>{v.currentTime=seek;v.pause();select(s)};$('chapters').appendChild(b);at+=s.dur}v.src=encodeURI(loc+'_'+mode+'_v8.mp4');v.load();$('download').href=v.src;$('download').download=loc+'_'+mode+'_v8.mp4';$('cj').classList.toggle('on',loc==='청주 오송');$('wj').classList.toggle('on',loc==='원주 혁신');$('full').classList.toggle('on',mode==='전체연결본');$('chase').classList.toggle('on',mode==='추격');select(list()[0])}
$('cj').onclick=()=>{loc='청주 오송';load()};$('wj').onclick=()=>{loc='원주 혁신';load()};$('full').onclick=()=>{mode='전체연결본';load()};$('chase').onclick=()=>{mode='추격';load()};$('mirror').onclick=()=>{if(mode!=='전체연결본'){mode='전체연결본';load()}const s=shots.find(x=>x.key==='64B-3');v.currentTime=s.start;v.pause();select(s)};$('accident').onclick=()=>{if(mode!=='전체연결본'){mode='전체연결본';load()}const s=shots.find(x=>x.key==='64D-1');v.currentTime=s.start;v.pause();select(s)};$('review').onclick=()=>{v.pause();select(current());$('note').focus()};
