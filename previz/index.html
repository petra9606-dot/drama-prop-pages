<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PREVIZ | 피라밋</title>
<style>
:root{--bg:#091017;--panel:#101c26;--line:#284150;--text:#eef8fb;--muted:#7f9ba8;--accent:#71c6d8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,rgba(71,166,190,.17),transparent 31%),var(--bg);color:var(--text);font-family:"Segoe UI","Malgun Gothic",sans-serif}.wrap{max-width:1160px;margin:auto;padding:42px 28px 70px}.back{color:#8dc9d6;text-decoration:none;font-size:13px}.head{margin:32px 0 28px;display:flex;align-items:end;justify-content:space-between;gap:18px}.eyebrow{font-size:11px;letter-spacing:.2em;color:#5e8795}.head h1{font-size:42px;margin:8px 0 5px}.head p{margin:0;color:var(--muted);font-size:13px}.filters{display:flex;gap:8px;margin:0 0 22px}.filters button{border:1px solid var(--line);background:#0e1821;color:#8eabb8;padding:9px 14px;border-radius:999px;cursor:pointer}.filters button.on{background:var(--accent);border-color:var(--accent);color:#061116;font-weight:800}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px}.card{display:block;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:linear-gradient(145deg,rgba(255,255,255,.025),transparent),var(--panel);transition:.18s}.card:hover{transform:translateY(-3px);border-color:#65b7c9}.cover{aspect-ratio:16/9;background:#05090d;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.info{padding:20px}.line{display:flex;justify-content:space-between;gap:12px;color:#78a3b2;font-size:11px;letter-spacing:.08em}.info h2{font-size:22px;margin:10px 0 7px}.desc{color:#8ba1ab;font-size:13px}.versions{display:flex;gap:7px;margin-top:17px}.version{font-size:11px;border:1px solid #31515e;border-radius:999px;padding:5px 9px;color:#94cbd5}.latest{background:#173943;color:#c4f5ff;border-color:#4b9bae}.empty{display:none;color:#79909a;padding:30px 0}@media(max-width:600px){.wrap{padding:27px 16px 50px}.head{align-items:flex-start;flex-direction:column}.head h1{font-size:34px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body><main class="wrap">
<a class="back" href="/pyramid/">← 피라밋</a>
<header class="head"><div><div class="eyebrow">PYRAMID · PREVISUALIZATION</div><h1>PREVIZ</h1><p>부와 씬별 프리비즈를 모아보고, 최신본과 이전 버전을 관리합니다.</p></div><p>최신 버전이 기본으로 열립니다.</p></header>
<nav class="filters" aria-label="부 필터"><button class="on" data-part="all">전체</button><button data-part="1">1부</button><button data-part="2">2부</button><button data-part="3">3부</button></nav>
<section class="grid" id="grid"></section><div class="empty" id="empty">이 부에는 아직 등록된 프리비즈가 없습니다.</div>
</main>
<script>
fetch('./previz.json',{cache:'no-cache'}).then(r=>r.json()).then(({items})=>{const grid=document.getElementById('grid'),empty=document.getElementById('empty');function render(part='all'){const rows=items.filter(x=>part==='all'||String(x.part)===part);grid.innerHTML=rows.map(x=>`<a class="card" href="${x.latest.url}"><div class="cover"><img src="${x.cover}" alt="${x.title} 프리비즈"></div><div class="info"><div class="line"><span>${x.part}부 · ${x.scene}씬</span><span>업데이트 ${x.updated}</span></div><h2>${x.title}</h2><div class="desc">${x.description}</div><div class="versions">${x.versions.map(v=>`<span class="version ${v.version===x.latest.version?'latest':''}">${v.version}${v.version===x.latest.version?' · 최신':''}</span>`).join('')}</div></div></a>`).join('');empty.style.display=rows.length?'none':'block'}render();document.querySelectorAll('[data-part]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-part]').forEach(x=>x.classList.toggle('on',x===b));render(b.dataset.part)})}).catch(()=>{document.getElementById('empty').style.display='block';document.getElementById('empty').textContent='목록을 불러오지 못했습니다.'});
</script></body></html>
