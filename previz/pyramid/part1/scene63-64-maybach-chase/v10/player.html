const roadBasis={"cheongju": "청주 상가·호수변 로드뷰 참고 / 회전교차로는 연출안", "wonju": "원주 혁신도시 사진 참고 · 정체 구간 접촉 → 시가지 추격(좌회전·직부감) → 회전교차로 출구 횡단보도"};function city(){return loc==='청주 오송'?'cheongju':'wonju'}function load(){$('basis').textContent=roadBasis[city()];let last='';$('chapters').innerHTML='';let at=0;for(const s of list()){let g=s.key.split('-')[0];if(g!==last){let h=document.createElement('h2');h.textContent=names[g];$('chapters').appendChild(h);last=g}let b=document.createElement('button');b.className='shot';b.dataset.start=at;b.dataset.end=at+s.dur;const seek=at;b.innerHTML='<img loading="lazy" src="thumbs/'+city()+'/'+s.key+'.jpg" alt=""><span><b>'+s.key+'</b> '+Number(s.dur.toFixed(2))+'초<small>'+s.desc+'</small></span>';b.onclick=()=>{v.currentTime=seek;v.pause();select(s)};$('chapters').appendChild(b);at+=s.dur}v.src=encodeURI(loc+'_'+mode+'_v10.mp4');v.load();$('download').href=v.src;$('download').download=loc+'_'+mode+'_v10.mp4';$('cj').classList.toggle('on',loc==='청주 오송');$('wj').classList.toggle('on',loc==='원주 혁신');$('full').classList.toggle('on',mode==='전체연결본');$('chase').classList.toggle('on',mode==='추격');select(list()[0])}
$('cj').onclick=()=>{loc='청주 오송';load()};$('wj').onclick=()=>{loc='원주 혁신';load()};$('full').onclick=()=>{mode='전체연결본';load()};$('chase').onclick=()=>{mode='추격';load()};$('mirror').onclick=()=>{if(mode!=='전체연결본'){mode='전체연결본';load()}const s=shots.find(x=>x.key==='64B-3');v.currentTime=s.start;v.pause();select(s)};$('accident').onclick=()=>{if(mode!=='전체연결본'){mode='전체연결본';load()}const s=shots.find(x=>x.key==='64D-1');v.currentTime=s.start;v.pause();select(s)};$('review').onclick=()=>{v.pause();select(current());$('note').focus()};
v.ontimeupdate=()=>document.querySelectorAll('.shot').forEach(b=>b.classList.toggle('active',v.currentTime>=Number(b.dataset.start)&&v.currentTime<Number(b.dataset.end)));
$('export').onclick=()=>{const out={project:'피라밋 63·64씬',version:'v10',type:'camera_revision_requests',notes:Object.values(notes)};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));a.download='피라밋_컷별_앵글수정메모.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);$('status').textContent='수정 메모 파일을 저장했습니다.'};
$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{try{const data=JSON.parse(await $('file').files[0].text());if(!Array.isArray(data.notes))throw Error();for(const n of data.notes){if(!shots.some(s=>s.key===n.key)||!['청주 오송','원주 혁신'].includes(n.location))continue;const clean={location:n.location,key:n.key};for(const f of fields)clean[f]=typeof n[f]==='string'?n[f]:'';notes[n.location+'|'+n.key]=clean}localStorage.setItem(store,JSON.stringify(notes));select(current());$('status').textContent='메모를 불러왔습니다.'}catch(e){$('status').textContent='컷별 앵글수정메모 JSON 파일을 선택해주세요.'}};
load();
</script></body></html>
