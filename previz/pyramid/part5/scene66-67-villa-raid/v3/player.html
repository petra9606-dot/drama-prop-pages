<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>5부 66·67씬 별장 습격 · PREVIZ v3</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#101216;color:#eee;font:14px/1.6 "Malgun Gothic",sans-serif}.player-layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;width:100%;height:100vh;overflow:hidden}main{display:flex;flex-direction:column;width:100%;min-width:0;min-height:0}header{flex:0 0 auto;padding:12px 20px;border-bottom:1px solid #30343a;position:relative}h1{font-size:19px;margin:0}p{margin:3px 0;color:#abb3be;font-size:12px}.home{position:absolute;right:18px;top:15px}.stage{flex:1 1 auto;width:100%;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden}.stage video{display:block;width:100%;height:100%;object-fit:contain;background:#000}nav{flex:0 0 auto;padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap}button,a{padding:7px 10px;background:#242931;color:#eee;border:1px solid #404752;border-radius:5px;cursor:pointer;text-decoration:none;font:inherit}button.on{background:#c8a46a;color:#111;border-color:#c8a46a}aside{display:flex;flex-direction:column;width:360px;min-width:0;min-height:0;border-left:1px solid #30343a;background:#141820}#chapters{overflow:auto;flex:1}h2{font-size:13px;margin:0;padding:9px 13px;background:#20242b}.shot{display:block;width:100%;text-align:left;background:none;border:0;border-radius:0;border-bottom:1px solid #282e36;padding:8px 13px;font-size:12px}.shot.active{border-left:3px solid #c8a46a;background:#282b31}.shot b{color:#d3b581}small{display:block;color:#aeb6c1}.download{font-size:12px;margin-left:auto}#editor{padding:12px;border-bottom:1px solid #42464e;background:#191d24}#editor h2{padding:0;background:none;margin-bottom:4px}#selected{color:#d3b581;font-weight:bold}.grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:7px}label{font-size:11px;color:#b5bdc7}select,textarea{width:100%;color:#eee;background:#101318;border:1px solid #444c58;border-radius:3px;padding:5px;font:12px "Malgun Gothic";resize:vertical}textarea{margin-top:7px;height:58px}#editor button{font-size:11px;margin-top:5px}#status{font-size:11px;min-height:16px;color:#b5cba4}.hint{font-size:11px;color:#a6afb9}#review{border-color:#c8a46a}@media(max-width:720px){.player-layout{display:flex;flex-direction:column;height:auto;min-height:100vh;overflow:visible}main{height:68vh;min-height:480px}aside{width:100%;height:80vh;border-left:0;border-top:1px solid #30343a}.home{position:static;display:inline-block;margin-top:6px}}
.shot{display:grid;grid-template-columns:84px 1fr;gap:8px;align-items:center}.shot img{width:84px;height:47px;object-fit:cover}.shot small{font-size:10px}</style>
<body><div class="player-layout"><main><header><h1>5부 66·67씬 별장 습격 · PREVIZ v3</h1><p>국도 차 안 → 정문 통과 → 보초 건물 앞 격투 → 거실 · 지하실 / 전체 1:40</p><p id="basis"></p><a class="home" href="/previz/">PREVIZ 목록 ↗</a></header>
<div class="stage"><video id="video" controls muted playsinline preload="metadata"></video></div>
<nav><button id="cj" class="on">가평 별장</button><button id="wj" hidden>원주 혁신</button><button id="full" class="on">앞 상황부터 전체</button><button id="chase" hidden>추격만</button><button id="mirror">정문 돌파</button><button id="accident">거실</button><button id="review">현재 컷 메모</button><a id="download" class="download" download>MP4 저장</a></nav></main>
<aside><section id="editor"><h2>컷별 앵글 수정 메모</h2><div id="selected">컷을 선택하세요</div><div id="base" class="hint"></div>
<div class="grid"><label>화면 크기<select id="size"><option value="">유지 / 미정</option><option>와이드</option><option>미디엄</option><option>타이트</option><option>극타이트</option></select></label>
<label>카메라 높이<select id="height"><option value="">유지 / 미정</option><option>지면 가까이</option><option>무릎 높이</option><option>허리 높이</option><option>눈높이</option><option>높은 앵글</option><option>넓은 부감</option></select></label>
<label>방향<select id="direction"><option value="">유지 / 미정</option><option>정면</option><option>앞 45도</option><option>측면</option><option>뒤 45도</option><option>후면</option><option>운전자 시점</option></select></label>
<label>움직임<select id="move"><option value="">유지 / 미정</option><option>고정</option><option>팬</option><option>병주</option><option>다가감</option><option>뒤로 빠짐</option><option>상승 → 드론</option></select></label></div>
<textarea id="note" aria-label="자유 수정 메모" placeholder="예: 얼굴을 더 타이트하게. 카메라는 조금 낮게. 배경은 빠르게 스쳐가게."></textarea>
<button id="export">수정 메모 파일 저장</button><button id="import">메모 불러오기</button><input id="file" type="file" accept="application/json,.json" hidden><div id="status" role="status"></div><div class="hint">메모는 이 브라우저에 저장됩니다. 파일로 저장해 전달하면 다음 렌더에 반영할 수 있습니다. 영상의 앵글은 새 렌더 후 바뀝니다.</div></section>
<div id="chapters"></div></aside></div>
<script>
const plan={"total": 100.375, "chase_seconds": 0, "streetview": {"villa": "https://map.kakao.com/?q=경기%20가평군%20청평면%20삼회리%20586-2"}, "shots": [{"key": "66-1", "desc": "한적한 국도 · 밤 — 헤드라이트가 다가온다 (와이드)", "dur": 3.0, "start": 0.0}, {"key": "66-2", "desc": "차 안 투숏 (앞유리 너머) — 운전하는 이장훈, 옆 백동재 \"경비조는 열 명...\"", "dur": 4.0, "start": 3.0}, {"key": "66-3", "desc": "이장훈 측면 · \"세 명은 내가 처리하지. 넌...\"", "dur": 2.5, "start": 7.0}, {"key": "66-4", "desc": "백동재 · \"... 세 명 정도는 나도....\"", "dur": 2.0, "start": 9.5}, {"key": "66-5", "desc": "앞유리 너머 — 저만치 별장 불빛", "dur": 2.2083, "start": 11.5}, {"key": "66-6", "desc": "이장훈 — 급가속", "dur": 1.2917, "start": 13.7083}, {"key": "66-7", "desc": "다리를 건너 진입로로 돌진 (로우)", "dur": 2.0, "start": 15.0}, {"key": "66-8", "desc": "정문 — 키득거리며 농담하는 수하 둘, 뒤로 다가오는 헤드라이트", "dur": 2.5833, "start": 17.0}, {"key": "66-9", "desc": "속도를 줄이지 않는 단호한 얼굴", "dur": 1.0833, "start": 19.5833}, {"key": "66-10", "desc": "수하들 얼굴 — 헤드라이트가 비춰진다, 눈을 가리며 돌아본다", "dur": 1.0, "start": 20.6666}, {"key": "66-11", "desc": "열린 정문 — 수하 둘 사이로 그대로 통과, 라바콘이 튄다 (와이드)", "dur": 1.7917, "start": 21.6666}, {"key": "66-12", "desc": "끼이익 — 보초 건물 앞 급정거, 문이 열리며 수하 넷이 차 바로 앞으로 쏟아져 나온다", "dur": 2.5833, "start": 23.4583}, {"key": "66-13", "desc": "차에서 내리는 이장훈과 백동재", "dur": 1.7917, "start": 26.0416}, {"key": "66-14", "desc": "인서트 — 철컥, 삼단봉을 펼친다", "dur": 1.0, "start": 27.8333}, {"key": "66-15", "desc": "대치 — 삼단봉을 든 수하 넷이 두 사람을 둘러싸고 맴돈다 (하이 와이드, 천천히 밀고 들어감)", "dur": 2.2083, "start": 28.8333}, {"key": "66-16", "desc": "이장훈 클로즈업 — 가드를 올린다", "dur": 0.7917, "start": 31.0416}, {"key": "66-17", "desc": "수하 어깨 너머 — 내려치는 삼단봉을 더킹으로 피하고 원투 훅", "dur": 1.7083, "start": 31.8333}, {"key": "66-18", "desc": "백동재 — 팔로 막고 받아친다 (핸드헬드)", "dur": 1.4167, "start": 33.5416}, {"key": "66-19", "desc": "이장훈 주위 핸드헬드 — 팔꿈치, 이어서 어퍼컷으로 첫 수하를 눕힌다", "dur": 2.2083, "start": 34.9583}, {"key": "66-20", "desc": "백동재 업어치기 (바닥 로우)", "dur": 1.0, "start": 37.1666}, {"key": "66-21", "desc": "백동재가 삼단봉에 맞고 휘청", "dur": 1.2083, "start": 38.1666}, {"key": "66-22", "desc": "뒤에서 이장훈을 붙잡는 수하 — 몸부림, 뒤 팔꿈치로 빠져나온다", "dur": 1.5, "start": 39.3749}, {"key": "66-23", "desc": "백동재 앞차기 → 콤보로 수하를 눕힌다", "dur": 1.9167, "start": 40.8749}, {"key": "66-24", "desc": "정문 쪽 수하 둘이 삼단봉을 휘두르며 달려온다 (이장훈 어깨 너머)", "dur": 1.2917, "start": 42.7916}, {"key": "66-25", "desc": "등을 맞고 휘청한 이장훈 — 멱살 잡아 차 보닛에 메다꽂는다", "dur": 2.4167, "start": 44.0833}, {"key": "66-26", "desc": "백동재 대 수하 — 팔꿈치, 맞고 버티다 업어치기 (핸드헬드)", "dur": 3.2083, "start": 46.5}, {"key": "66-27", "desc": "원테이크 — 달려든 순찰 수하와 이장훈의 난타, 맞고도 앞차기로 끝낸다", "dur": 3.7917, "start": 49.7083}, {"key": "66-28", "desc": "마지막 수하를 앞차기로 쓰러뜨리는 백동재 (로우)", "dur": 2.4167, "start": 53.5}, {"key": "66-29", "desc": "바닥 곳곳에 신음하는 수하 여덟, 숨을 고르는 두 사람 → 크레인 업, 별장 거실 불빛으로", "dur": 3.7917, "start": 55.9167}, {"key": "67-1", "desc": "별장 거실 · 밖에서 들려오는 격전 소리 — 귤 까먹는 최병갑, 초조한 김중한", "dur": 4.0, "start": 59.7084}, {"key": "67-2", "desc": "최병갑 \"태국 왕실 경비대, 청와대 경호실...\"", "dur": 4.5, "start": 63.7084}, {"key": "67-3", "desc": "초조한 김중한", "dur": 1.5, "start": 68.2084}, {"key": "67-4", "desc": "끼이익… 현관문이 열리고, 헉헉대며 들어서는 이장훈", "dur": 2.5833, "start": 69.7084}, {"key": "67-5", "desc": "멈칫 놀라는 최병갑", "dur": 1.2083, "start": 72.2917}, {"key": "67-6", "desc": "최병갑에게 다가오는 이장훈 (최병갑 어깨 너머)", "dur": 3.2083, "start": 73.5}, {"key": "67-7", "desc": "인서트 — 소파 옆 비상 버튼을 몰래 누르는 손", "dur": 1.5833, "start": 76.7083}, {"key": "67-8", "desc": "\"내가 말했잖아. 받은 건 돌려준다고.\" (투숏 측면)", "dur": 3.0, "start": 78.2916}, {"key": "67-9", "desc": "인서트 — 별장 지하실, 요란한 경보 · 지키던 수하 둘(검은 정장)이 돌아보는 순간 백동재(회색 재킷)가 들이닥쳐 한두 대씩에 눕힌다 · 의자에 묶인 김도희(흰 블라우스)", "dur": 3.4167, "start": 81.2916}, {"key": "67-10", "desc": "거친 숨의 백동재가 김도희에게 다가간다 · 일어나는 김도희", "dur": 2.4167, "start": 84.7083}, {"key": "67-11", "desc": "\"오늘은... 제가... 먼저 안아도 되겠습니까?\" — 포옹", "dur": 3.2083, "start": 87.125}, {"key": "67-12", "desc": "주머니에서 메스를 꺼내는 이장훈 (인서트)", "dur": 1.4167, "start": 90.3333}, {"key": "67-13", "desc": "미간이 파르르 떨리는 최병갑", "dur": 1.2083, "start": 91.75}, {"key": "67-14", "desc": "\"원하는 게 뭔가?\" \"최병갑. 당신만 줄 수 있어.\"", "dur": 3.4167, "start": 92.9583}, {"key": "67-15", "desc": "푸욱!!!! — 유리창에 피가 촥 (밖에서 타이트, 직접 찌르는 장면은 보이지 않음)", "dur": 1.7917, "start": 96.375}, {"key": "67-16", "desc": "이장훈 \"내가 직접 가져가지.\" (뒤틀린 얼굴)", "dur": 2.2083, "start": 98.1667}]},cameras={};shots=plan.shots;
const v=document.getElementById('video'),$=id=>document.getElementById(id),fields=['size','height','direction','move','note'];
let loc='별장',mode='전체연결본',selected=null,notes={};
const store='pyramid-camera-notes-p5-66-67-v3';try{notes=JSON.parse(localStorage.getItem(store)||'{}')}catch(e){}
const names={'66':'66 · 도로 → 정문 → 격투','67':'67 · 거실 · 지하실'};
function list(){return mode==='추격'?shots.filter(s=>s.key.startsWith('64C-')):shots}
function current(){let at=0;for(const s of list()){if(v.currentTime<at+s.dur+.001)return s;at+=s.dur}return list().at(-1)}
function select(s){selected={location:loc,key:s.key};$('selected').textContent=loc+' · '+s.key;const c=cameras[s.key];$('base').textContent=c?`현재 ${c.mm}mm · 카메라 높이 약 ${c.offset[2]}m (시작 기준)`+(c.filming?' · '+c.filming:''):s.desc;const n=notes[loc+'|'+s.key]||{};for(const f of fields)$(f).value=n[f]||'';$('status').textContent=''}
function save(){if(!selected){$('status').textContent='먼저 현재 컷 메모 또는 컷 목록을 눌러주세요.';return}const n={...selected};for(const f of fields)n[f]=$(f).value;notes[selected.location+'|'+selected.key]=n;try{localStorage.setItem(store,JSON.stringify(notes));$('status').textContent='브라우저에 저장됨 · 전달하려면 파일 저장'}catch(e){$('status').textContent='파일 저장 버튼으로 보관해주세요.'}}
for(const f of fields)$(f).addEventListener('input',save);
const roadBasis={"villa":"가평 삼회리 별장 사진 기준 · 밤 · 영상 아래 띠에 컷 설명·대사"};function city(){return 'villa'}function load(){$('basis').textContent=roadBasis[city()];let last='';$('chapters').innerHTML='';let at=0;for(const s of list()){let g=s.key.split('-')[0];if(g!==last){let h=document.createElement('h2');h.textContent=names[g];$('chapters').appendChild(h);last=g}let b=document.createElement('button');b.className='shot';b.dataset.start=at;b.dataset.end=at+s.dur;const seek=at;b.innerHTML='<img loading="lazy" src="thumbs/'+city()+'/'+s.key+'.jpg" alt=""><span><b>'+s.key+'</b> '+Number(s.dur.toFixed(2))+'초<small>'+s.desc+'</small></span>';b.onclick=()=>{v.currentTime=seek;v.pause();select(s)};$('chapters').appendChild(b);at+=s.dur}v.src=encodeURI(loc+'_'+mode+'_v3.mp4');v.load();$('download').href=v.src;$('download').download=loc+'_'+mode+'_v3.mp4';$('cj').classList.toggle('on',true);$('wj').classList.toggle('on',loc==='원주 혁신');$('full').classList.toggle('on',mode==='전체연결본');$('chase').classList.toggle('on',mode==='추격');select(list()[0])}
$('cj').onclick=()=>{loc='청주 오송';load()};$('wj').onclick=()=>{loc='원주 혁신';load()};$('full').onclick=()=>{mode='전체연결본';load()};$('chase').onclick=()=>{mode='추격';load()};$('mirror').onclick=()=>{if(mode!=='전체연결본'){mode='전체연결본';load()}const s=shots.find(x=>x.key==='66-11');v.currentTime=s.start;v.pause();select(s)};$('accident').onclick=()=>{if(mode!=='전체연결본'){mode='전체연결본';load()}const s=shots.find(x=>x.key==='67-1');v.currentTime=s.start;v.pause();select(s)};$('review').onclick=()=>{v.pause();select(current());$('note').focus()};
v.ontimeupdate=()=>document.querySelectorAll('.shot').forEach(b=>b.classList.toggle('active',v.currentTime>=Number(b.dataset.start)&&v.currentTime<Number(b.dataset.end)));
$('export').onclick=()=>{const out={project:'피라밋 5부 66·67씬',version:'p5-66-67-v3',type:'camera_revision_requests',notes:Object.values(notes)};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));a.download='피라밋_컷별_앵글수정메모.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);$('status').textContent='수정 메모 파일을 저장했습니다.'};
$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{try{const data=JSON.parse(await $('file').files[0].text());if(!Array.isArray(data.notes))throw Error();for(const n of data.notes){if(!shots.some(s=>s.key===n.key)||!n.location==='별장')continue;const clean={location:n.location,key:n.key};for(const f of fields)clean[f]=typeof n[f]==='string'?n[f]:'';notes[n.location+'|'+n.key]=clean}localStorage.setItem(store,JSON.stringify(notes));select(current());$('status').textContent='메모를 불러왔습니다.'}catch(e){$('status').textContent='컷별 앵글수정메모 JSON 파일을 선택해주세요.'}};
load();
</script></body></html>
