<style>
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 16% 0,rgba(80,105,190,.13),transparent 28%),#0b0f19;color:#eef2ff;
  font-family:'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif}
a{color:#8fa8ff}
.wrap{max-width:1180px;margin:0 auto;padding:44px 26px 70px}
.back{display:inline-block;margin-bottom:22px;color:#8fa8ff;text-decoration:none;font-size:13px}
h1{margin:0;font-size:34px;letter-spacing:-.03em}
.sub{color:#78869f;font-size:12px;letter-spacing:.12em;margin-top:8px}
.lead{color:#9aa7c0;font-size:14px;line-height:1.8;margin:18px 0 26px;max-width:760px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px}
.tabs button{font:inherit;font-size:13px;font-weight:800;cursor:pointer;border-radius:999px;padding:10px 16px;
  background:#111827;border:1px solid #263244;color:#c2ccE4;transition:.15s}
.tabs button:hover{border-color:#5878de}
.tabs button.on{background:#7590ff;border-color:#7590ff;color:#fff}
.panel{display:grid;grid-template-columns:minmax(0,430px) minmax(0,1fr);gap:34px;align-items:start}
.viewer{background:#111827;border:1px solid #263244;border-radius:22px;padding:20px}
.frame{border-radius:26px;overflow:hidden;background:#000;box-shadow:0 22px 50px rgba(0,0,0,.5);position:relative;display:flex;justify-content:center}
.frame img{display:block;height:min(66vh,780px);width:auto;max-width:100%;cursor:pointer}
.nav{display:flex;align-items:center;gap:10px;margin-top:16px}
.nav button{font:inherit;cursor:pointer;width:40px;height:40px;border-radius:12px;background:#1c2743;border:1px solid #30436e;color:#cdd8ff;font-size:17px;font-weight:800}
.nav button:disabled{opacity:.35;cursor:default}
.nav .idx{margin-left:auto;font-size:12px;color:#7d8aa4;font-variant-numeric:tabular-nums}
.cap{margin-top:14px;font-size:13px;color:#a9b5cc;line-height:1.8;min-height:66px}
.cap b{color:#fff;display:block;font-size:15px;margin-bottom:6px}
.side h2{margin:0 0 6px;font-size:26px;letter-spacing:-.02em}
.side .meta{color:#78869f;font-size:12px;letter-spacing:.08em;margin-bottom:16px}
.side .desc{color:#9aa7c0;font-size:14px;line-height:1.85}
.acts{display:flex;gap:9px;flex-wrap:wrap;margin:22px 0 8px}
.acts a{text-decoration:none;font-size:13px;font-weight:800;border-radius:12px;padding:13px 18px}
.acts a.solid{background:#7590ff;color:#fff}
.acts a.ghost{background:#1c2743;color:#b7c5ff;border:1px solid #30436e}
.note{color:#69748c;font-size:11px;line-height:1.8;margin-top:8px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:9px;margin-top:24px}
.thumbs button{padding:0;border:2px solid #263244;border-radius:11px;overflow:hidden;background:#0d121b;cursor:pointer;line-height:0}
.thumbs button img{width:100%;height:auto;display:block;opacity:.6}
.thumbs button.on{border-color:#7590ff}
.thumbs button.on img{opacity:1}
.list{margin-top:26px;border-top:1px solid #1b2334;padding-top:20px}
.list h3{margin:0 0 10px;font-size:13px;color:#8895b0;letter-spacing:.06em}
.list ol{margin:0;padding-left:18px;color:#93a0b9;font-size:13px;line-height:2}
.list ol li::marker{color:#5c6a86;font-variant-numeric:tabular-nums}
.list ol li.on{color:#fff;font-weight:700}
@media(max-width:880px){
  .panel{grid-template-columns:1fr;gap:24px}
  .wrap{padding:28px 16px 56px}
  h1{font-size:27px}
  .viewer{padding:12px;border-radius:18px}
  .frame img{height:auto;width:100%}
}
</style>

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
let app = APPS[0], index = 0;
const $ = id => document.getElementById(id);

$('tabs').innerHTML = APPS.map(a => '<button data-app="' + a.id + '">' + esc(a.name) + '</button>').join('');
$('tabs').querySelectorAll('button').forEach(b => b.addEventListener('click', () => select(b.dataset.app, 0)));

function shotSrc(i) { return 'shots/' + app.id + '/' + app.shots[i][0] + '.png' + (app.id === 'rider' ? '?v=16' : app.id === 'mail' ? '?v=8' : ''); }

function paint() {
  const s = app.shots[index];
  $('shot').src = shotSrc(index);
  $('shot').alt = app.name + ' ' + s[1];
  $('idx').textContent = (index + 1) + ' / ' + app.shots.length;
  $('cap').innerHTML = '<b>' + esc(s[1]) + '</b>' + esc(s[2]);
  $('prev').disabled = index === 0;
  $('next').disabled = index === app.shots.length - 1;
  $('thumbs').querySelectorAll('button').forEach((b, i) => b.classList.toggle('on', i === index));
  $('list').querySelectorAll('li').forEach((li, i) => li.classList.toggle('on', i === index));
  try { history.replaceState(null, '', '#' + app.id + '-' + (index + 1)); } catch (e) {}
}

function select(id, at) {
  app = APPS.find(a => a.id === id) || APPS[0];
  index = Math.max(0, Math.min(app.shots.length - 1, at || 0));
  $('tabs').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.app === app.id));
  $('title').textContent = app.name;
  $('meta').textContent = app.meta;
  $('desc').textContent = app.desc;
  $('note').textContent = app.note;
  $('acts').innerHTML =
    '<a class="solid" href="' + app.preview + '">웹에서 직접 조작</a>' +
    '<a class="ghost" href="' + app.apk + '" download>APK 내려받기</a>' +
    '<a class="ghost" href="' + app.qr + '" target="_blank">설치 QR</a>';
  $('thumbs').innerHTML = app.shots.map((s, i) =>
    '<button data-i="' + i + '" title="' + esc(s[1]) + '"><img loading="lazy" src="' + shotSrc(i) + '" alt="' + esc(s[1]) + '"></button>').join('');
  $('thumbs').querySelectorAll('button').forEach(b => b.addEventListener('click', () => { index = Number(b.dataset.i); paint(); }));
  $('list').innerHTML = app.shots.map(s => '<li>' + esc(s[1]) + '</li>').join('');
  $('list').querySelectorAll('li').forEach((li, i) => { li.style.cursor = 'pointer'; li.addEventListener('click', () => { index = i; paint(); }); });
  paint();
}

$('prev').addEventListener('click', () => { if (index > 0) { index--; paint(); } });
$('next').addEventListener('click', () => { if (index < app.shots.length - 1) { index++; paint(); } });
$('shot').addEventListener('click', () => { index = (index + 1) % app.shots.length; paint(); });
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' && index > 0) { index--; paint(); }
  if (e.key === 'ArrowRight' && index < app.shots.length - 1) { index++; paint(); }
});

const hash = (location.hash || '').replace('#', '').split('-');
select(hash[0] || 'rider', Number(hash[1] || 1) - 1);
</script>
</body>
</html>
