<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>달림콜 컴퓨터 미리보기</title><link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#e8eeec;font-family:system-ui,'Noto Sans KR',sans-serif;color:#16303b;display:grid;grid-template-columns:390px 330px;gap:24px;justify-content:center;padding:24px}.phone{height:844px;background:#f3f6f4;border-radius:35px;overflow:hidden;box-shadow:0 18px 55px #193b3440;border:8px solid #172229;position:relative}.head{height:66px;background:#16303b;color:white;display:flex;align-items:center;padding:0 18px;font-size:24px;font-weight:900}.accent{color:#03b9a0}.live{font-size:12px;color:#bcd0cd;margin-left:auto}#map{height:440px}.credit{position:absolute;top:74px;left:14px;z-index:4;background:#fffd;padding:3px 5px;border-radius:4px;font-size:8px}.sheet{position:absolute;left:8px;right:8px;bottom:8px;background:#fff;padding:20px;border-radius:24px;box-shadow:0 8px 28px #102b2850}.eyebrow{font-size:12px;color:#03a991;font-weight:900}.title{font-size:22px;font-weight:900;margin-top:8px}.muted{font-size:12px;color:#70817e;margin-top:6px}.money{font-size:48px;font-weight:900;margin:12px 0}.row{display:flex;justify-content:space-between;gap:10px}.btn{border:0;border-radius:13px;min-height:50px;font-weight:900;font-size:16px;cursor:pointer}.primary{background:#03b9a0;color:white;flex:1}.secondary{background:#e7eeec;color:#16303b;flex:1}.timer{text-align:center;font-size:62px;font-weight:900;font-variant-numeric:tabular-nums}.orange{color:#e57b17}.red{color:#d7433b}.badge{display:inline-block;background:#def7f1;color:#087b6d;padding:5px 8px;border-radius:10px;font-size:11px;font-weight:800}.special{border:2px solid #ef9b31;background:#fffaf1}.control{background:#10242c;color:white;border-radius:24px;padding:20px;height:max-content}.control h2{margin:0}.control small{color:#83aaa4}.status{background:#1b3540;border-radius:14px;padding:14px;margin:16px 0}.status b{display:block;color:#67e1cf;font-size:32px;margin-top:7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cbtn{padding:12px 7px;border:0;border-radius:9px;background:#284852;color:white;font-weight:800;cursor:pointer}.reset{background:#733936}.marker{display:flex;align-items:center;gap:5px;font-weight:800;font-size:11px}.pin{width:18px;height:18px;border-radius:50%;border:3px solid #fff}.label{background:#fff;padding:4px 6px;border-radius:6px}.you .pin{background:#1577ef}.store .pin{background:#03b9a0}.customer .pin{background:#e8674a}
</style></head><body><div class="phone"><div class="head">달림<span class="accent">콜</span><span class="live">● 운행 중</span></div><div id="map"></div><div class="credit">© OpenMapTiles · © OpenStreetMap contributors</div><div id="sheet" class="sheet"></div></div><aside class="control"><h2>CONTROL PANEL</h2><small>컴퓨터 기능 미리보기</small><div class="status">현재 위치 · 강남역<br>현재 씬 <span id="sceneName">SCENE 1</span><b id="clock">10:00</b></div><div class="grid" id="scenes"></div><h3>FILM TIMER</h3><div class="grid" id="timers"></div><button class="cbtn reset" style="width:100%;margin-top:16px" onclick="show(1)">SCENE RESET</button></aside><script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script><script>
const current=[127.02762,37.49795],store=[127.03647,37.50068],customer=[127.0285,37.5112];let seconds=600,timer=null;
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/liberty',center:current,zoom:14,attributionControl:false});
function mark(cls,label,p){const e=document.createElement('div');e.className='marker '+cls;e.innerHTML='<i class="pin"></i><span class="label">'+label+'</span>';new maplibregl.Marker({element:e,anchor:'left'}).setLngLat(p).addTo(map)}map.on('load',()=>{mark('you','현재 위치',current);mark('store','매장',store);mark('customer','고객',customer);fetch('https://router.project-osrm.org/route/v1/driving/'+[current,store,customer].map(x=>x.join(',')).join(';')+'?overview=full&geometries=geojson').then(r=>r.json()).then(j=>{map.addSource('r',{type:'geojson',data:j.routes[0].geometry});map.addLayer({id:'r',type:'line',source:'r',paint:{'line-color':'#03b9a0','line-width':5}})}).catch(()=>{})});
function start(n){seconds=n;clearInterval(timer);timer=setInterval(()=>{seconds=Math.max(0,seconds-1);renderClock()},1000);renderClock()}function renderClock(){const m=String(Math.floor(seconds/60)).padStart(2,'0'),s=String(seconds%60).padStart(2,'0');document.querySelectorAll('#clock,.timer').forEach(e=>{e.textContent=m+':'+s;e.className=e.classList.contains('timer')?'timer '+(seconds<120?'red':seconds<300?'orange':''):e.className})}
function show(n){document.getElementById('sceneName').textContent='SCENE '+n;const s=document.getElementById('sheet');if(n===1)s.innerHTML='<div class="eyebrow">배달 대기 중</div><div class="title">현재 주변 주문을 확인하고 있어요</div><div class="row" style="margin-top:18px"><div>오늘 배달<br><b>0건</b></div><div>예상 수입<br><b>₩0</b></div><span class="badge">운행 중</span></div>';if(n===2)s.innerHTML='<div class="eyebrow">새 배달 요청 · 1.8km</div><div class="title">배달 수수료</div><div class="money">3,000원</div><div>픽업　<b>만두정류장</b></div><div class="muted">배달지　제일빌라 302호</div><div class="row" style="margin-top:18px"><button class="btn secondary">거절</button><button class="btn primary" onclick="show(3)">수락</button></div>';if(n===3)s.innerHTML='<div class="eyebrow">콜 잡음 · 접수 대기</div><div class="title">만두정류장</div><div class="muted">제일빌라 302호</div><div class="row" style="margin-top:16px"><b>배달 수수료</b><b>₩3,000</b></div><button class="btn primary" style="width:100%;margin-top:17px" onclick="show(4)">접수 완료</button>';if(n===4)s.innerHTML='<div class="eyebrow">도착 프로모션</div><div class="title">10분 이내 도착 시</div><div class="muted">추가 보너스</div><div class="money">+2,000원</div><button class="btn primary" style="width:100%" onclick="show(5)">확인</button>';if(n===5||n===6){start(n===5?599:120);s.innerHTML='<div class="eyebrow">배달 중</div><div class="muted" style="text-align:center">남은 시간</div><div class="timer"></div><div class="row"><b>배달 수수료 ₩3,000</b><b class="accent">도착 보너스 +₩2,000</b></div>';renderClock()}if(n===7||n===8){s.className='sheet '+(n===8?'special':'');s.innerHTML='<div class="eyebrow">'+(n===8?'SPECIAL · 프로모션 배달콜':'새로운 배달콜')+'</div><div class="title">'+(n===8?'배달료 특!':'배달 요청이 도착했습니다')+'</div><div class="money">₩'+(n===8?'4,000':'2,800')+'</div><div>픽업　<b>'+(n===8?'OO치킨 강남점':'OO분식 역삼점')+'</b></div><div class="muted">서울 강남구 테헤란로 ...</div><button class="btn primary" style="width:100%;margin-top:15px">수락하기</button>'}else s.className='sheet';}
for(let i=1;i<=8;i++){const b=document.createElement('button');b.className='cbtn';b.textContent='SCENE '+i;b.onclick=()=>show(i);scenes.appendChild(b)}[599,300,240,180,120,60,30].forEach(n=>{const b=document.createElement('button');b.className='cbtn';b.textContent=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');b.onclick=()=>{show(5);start(n)};timers.appendChild(b)});show(1);
</script></body></html>
