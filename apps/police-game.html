<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>NEON PATROL</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer}
#staff{position:fixed;right:10px;bottom:10px;display:flex;align-items:center;gap:5px;z-index:10;opacity:.5;transition:opacity .15s}
#staff:hover,#staff:focus-within{opacity:1}
#staff button{font:700 12px/1 system-ui,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:#fff;background:rgba(8,12,28,.78);border:1px solid rgba(255,255,255,.32);border-radius:6px;padding:7px 9px;min-width:30px;cursor:pointer;touch-action:manipulation}
#staff button:active{transform:scale(.93);background:rgba(60,90,200,.85)}
#staff .key{opacity:.55;font-weight:500;margin-left:3px}
#staff.collapsed .act{display:none}
#staff.collapsed{opacity:.18}
@media (max-height:500px){#staff{gap:3px}#staff button{font-size:10px;padding:5px 6px;min-width:24px}#staff .key{display:none}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="staff" aria-label="staff controls">
  <button class="act" data-cmd="attack">공격<span class="key">A</span></button>
  <button class="act" data-cmd="arrest">체포<span class="key">S</span></button>
  <button class="act" data-cmd="reset">리셋<span class="key">R</span></button>
  <button class="act" data-cmd="full" title="전체화면 (F)">⛶</button>
  <button data-cmd="toggle" title="버튼 숨기기/보이기 (H)">•••</button>
</div>
<script>
(() => {
'use strict';

/* ================= 촬영 설정 (Staff config) =================
   A / [공격] : 콤보 타격     S / [체포] : 결정타 + 체포 팝업
   R / [리셋] : 초기 대치 상태로 즉시 리셋
   F : 전체화면   H : 스태프 버튼 숨기기   M : 배경음악 켜기/끄기
   화면 아무 곳이나 터치 = 공격 (배우 조작용)
============================================================== */
const CONFIG = {
  popupAfterLanding: 280,  // 악당이 바닥에 쓰러진 뒤 팝업이 뜰 때까지(ms)
  resetFade: 240,          // 리셋 화면 전환 시간(ms)
  bossMinHp: 0.12,         // 체포 전까지 악당 HP 최소 비율 (A만 눌러서 쓰러지지 않게)
  bgmOnStart: false,       // 배경음악 기본값
  volume: 0.6,
  stageTime: 180,          // 상단 타이머(초)
};

const W = 480, H = 270, UIW = 1920, UIH = 1080, GROUND = 228, REACH = 34;
const CAM = { x: 226, y: 158, zoom: 1.3 }; // 인서트 컷용 기본 카메라 (캐릭터 크게)
const BOSS_MAX_HP = 128000, OFFICER_MAX_HP = 9820;
const $ = s => document.querySelector(s);
const canvas = $('#game'), ctx = canvas.getContext('2d');
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const low = mk(W, H), lc = low.getContext('2d');
const emis = mk(W, H), ec = emis.getContext('2d');
const bloom = mk(W / 4, H / 4 | 0), bc = bloom.getContext('2d');
const bgCv = mk(W, H), bg = bgCv.getContext('2d');
const bossCv = mk(120, 120), bx = bossCv.getContext('2d');
const portrait = mk(20, 20), pc = portrait.getContext('2d');
const bossPortrait = mk(34, 34), bpc = bossPortrait.getContext('2d');

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const fmt = n => Math.round(n).toLocaleString('en-US');
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const easeOutElastic = t => t === 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (2 * Math.PI) / 3) + 1;
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);

/* ================= 화면 크기 (16:9 letterbox) ================= */
let dpr = 1, view = { x: 0, y: 0, w: 1, h: 1, s: 1 };
const staffEl = $('#staff');
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(innerWidth * dpr);
  canvas.height = Math.round(innerHeight * dpr);
  let w = canvas.width, h = w * 9 / 16;
  if (h > canvas.height) { h = canvas.height; w = h * 16 / 9; }
  view = { x: (canvas.width - w) / 2, y: (canvas.height - h) / 2, w, h, s: w / UIW };
  staffEl.style.right = (view.x / dpr + 8) + 'px';
  staffEl.style.bottom = (view.y / dpr + 8) + 'px';
}
addEventListener('resize', resize);
resize();

/* ================= 오디오 (Web Audio 8-bit) ================= */
let AC = null, master = null, comp = null, noiseBuf = null;
function audio() {
  if (!AC) {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    AC = new C();
    comp = AC.createDynamicsCompressor();
    master = AC.createGain(); master.gain.value = CONFIG.volume;
    master.connect(comp); comp.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(type, f1, f2, dur, vol, when = 0, out = master) {
  if (!AC) return;
  const t = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t);
  if (f2 !== f1) o.frequency.exponentialRampToValueAtTime(Math.max(1, f2), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(out); o.start(t); o.stop(t + dur + 0.03);
}
function noise(dur, vol, when = 0, type = 'bandpass', f = 1200, f2 = f, q = 0.8) {
  if (!AC) return;
  const t = AC.currentTime + when, s = AC.createBufferSource(), fl = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; fl.type = type; fl.Q.value = q;
  fl.frequency.setValueAtTime(f, t); if (f2 !== f) fl.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(fl); fl.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.03);
}
const SFX = {
  hit(step, crit) {
    const base = [260, 310, 200, 360][step] || 280;
    tone('square', base, 50, 0.13, 0.32);
    tone('triangle', 160, 38, 0.17, 0.55);
    noise(0.09, 0.55, 0, 'bandpass', 2200, 500, 0.7);
    if (crit) { tone('square', 988, 1976, 0.06, 0.14, 0.03); tone('square', 1319, 2637, 0.07, 0.12, 0.07); noise(0.22, 0.35, 0, 'lowpass', 700, 120); }
  },
  whoosh() { noise(0.15, 0.28, 0, 'bandpass', 500, 3200, 1.4); },
  finisher() {
    tone('sawtooth', 200, 30, 0.65, 0.45); tone('square', 110, 30, 0.75, 0.35);
    noise(0.6, 0.75, 0, 'lowpass', 3000, 150); tone('square', 660, 1320, 0.14, 0.14, 0.04); tone('square', 990, 1980, 0.14, 0.1, 0.1);
  },
  thud() { tone('sine', 130, 32, 0.4, 0.85); noise(0.28, 0.5, 0, 'lowpass', 900, 90); },
  cuff() { tone('square', 2300, 1700, 0.035, 0.16); noise(0.04, 0.25, 0, 'highpass', 5000); tone('square', 2700, 2000, 0.035, 0.16, 0.1); noise(0.05, 0.3, 0.1, 'highpass', 4500); },
  blip(i) { const f = 880 * Math.pow(1.335, i); tone('square', f, f, 0.1, 0.16); tone('square', f * 2, f * 2, 0.06, 0.05, 0.03); },
  stamp() { tone('triangle', 170, 45, 0.25, 0.7); noise(0.14, 0.55, 0, 'lowpass', 1500, 200); },
  fanfare() {
    const n = [[523, 0], [659, .09], [784, .18], [1047, .27], [784, .42], [1047, .51]];
    n.forEach(([f, t]) => { tone('square', f, f, 0.15, 0.13, t); });
    [523, 659, 784, 1047].forEach(f => tone('square', f, f, 1.0, 0.07, 0.68));
    tone('triangle', 131, 131, 0.3, 0.35, 0); tone('triangle', 196, 196, 0.3, 0.35, 0.42); tone('triangle', 262, 262, 1.1, 0.35, 0.68);
    noise(0.5, 0.12, 0.68, 'highpass', 6000);
  },
  count() { tone('square', 1500, 1500, 0.03, 0.05); },
};
function cutAudio() { // 리셋 시 재생 중인 효과음 즉시 정지
  if (!AC || !master) return;
  const old = master;
  old.gain.setTargetAtTime(0, AC.currentTime, 0.01);
  setTimeout(() => old.disconnect(), 150);
  master = AC.createGain(); master.gain.value = CONFIG.volume; master.connect(comp);
  if (bgmGain) { bgmGain.disconnect(); bgmGain.connect(master); }
}
/* BGM (M 키) */
let bgmOn = false, bgmTimer = null, bgmNext = 0, bgmStep = 0, bgmGain = null;
const BGM_BASS = [45, 45, 57, 45, 41, 41, 53, 41, 48, 48, 60, 48, 43, 43, 55, 43];
const BGM_ARP = [[69, 72, 76], [65, 69, 72], [72, 76, 79], [67, 71, 74]];
const midi = m => 440 * Math.pow(2, (m - 69) / 12);
function setBgm(on) {
  if (!audio()) return;
  bgmOn = on;
  if (!bgmGain) { bgmGain = AC.createGain(); bgmGain.gain.value = 0.35; bgmGain.connect(master); }
  clearInterval(bgmTimer);
  if (!on) return;
  bgmNext = AC.currentTime + 0.05;
  bgmTimer = setInterval(() => {
    while (bgmNext < AC.currentTime + 0.15) {
      const sixteenth = 60 / 132 / 4, bar = Math.floor(bgmStep / 16) % 4, s = bgmStep % 16;
      if (s % 2 === 0) tone('triangle', midi(BGM_BASS[(bgmStep / 2 | 0) % 16] + 0), midi(BGM_BASS[(bgmStep / 2 | 0) % 16]), sixteenth * 1.8, 0.22, bgmNext - AC.currentTime, bgmGain);
      const a = BGM_ARP[bar]; tone('square', midi(a[s % 3] + 12), midi(a[s % 3] + 12), sixteenth * 0.8, 0.045, bgmNext - AC.currentTime, bgmGain);
      if (s % 4 === 0) noise(0.05, 0.08, bgmNext - AC.currentTime, 'highpass', 7000);
      bgmNext += sixteenth; bgmStep++;
    }
  }, 25);
}

/* ================= 픽셀 도구 ================= */
function limb(c, col, x1, y1, x2, y2, th) {
  const dx = x2 - x1, dy = y2 - y1, n = Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy))));
  c.fillStyle = col; const o = th / 2;
  for (let i = 0; i <= n; i++) c.fillRect(Math.round(x1 + dx * i / n - o), Math.round(y1 + dy * i / n - o), th, th);
}
function painter(c, ox, oy, f) {
  return {
    r(col, x, y, w, h) { c.fillStyle = col; c.fillRect(Math.round(f > 0 ? ox + x : ox - x - w), Math.round(oy + y), w, h); },
    l(col, a, b, th) { limb(c, col, ox + f * a[0], oy + a[1], ox + f * b[0], oy + b[1], th); },
  };
}
const FONT = {
  A: '010101111101101', B: '110101110101110', C: '011100100100011', D: '110101101101110', E: '111100110100111',
  G: '011100101101011', H: '101101111101101', I: '111010010010111', K: '101110100110101', L: '100100100100111',
  M: '101111111101101', N: '101111111111101', O: '010101101101010', P: '110101110100100', R: '110101110101101',
  S: '011100010001110', T: '111010010010010', U: '101101101101111', W: '101101111111101', Y: '101101010010010',
  2: '110001010100111', 4: '101101111001001', 7: '111001010010010', ' ': '000000000000000',
};
function pixText(c, text, x, y, s, col, vertical = false) {
  c.fillStyle = col;
  [...text].forEach((ch, i) => {
    const g = FONT[ch] || FONT[' '];
    const ox = vertical ? x : x + i * 4 * s, oy = vertical ? y + i * 6 * s : y;
    for (let k = 0; k < 15; k++) if (g[k] === '1') c.fillRect(ox + (k % 3) * s, oy + (k / 3 | 0) * s, s, s);
  });
}
const pixTextW = (t, s) => (t.length * 4 - 1) * s;

/* ================= 배경 (밤의 네온 도시) ================= */
const windows = [], signs = [], lamps = [], puddles = [];
function buildBackground() {
  const rnd = mulberry32(20260917), c = bg;
  const sky = c.createLinearGradient(0, 0, 0, 196);
  sky.addColorStop(0, '#04031a'); sky.addColorStop(.5, '#120a33'); sky.addColorStop(.85, '#2e1250'); sky.addColorStop(1, '#4a1757');
  c.fillStyle = sky; c.fillRect(0, 0, W, H);
  for (let i = 0; i < 140; i++) { c.fillStyle = rnd() < .25 ? '#ffffff' : '#7d74c4'; c.fillRect(rnd() * W | 0, rnd() * 110 | 0, 1, 1); }
  // moon
  for (let y = -11; y <= 11; y++) for (let x = -11; x <= 11; x++) {
    const d = x * x + y * y; if (d <= 121) { c.fillStyle = d > 100 ? '#d8cfb4' : '#f3ecd4'; c.fillRect(412 + x, 34 + y, 1, 1); }
  }
  c.fillStyle = '#d6ccad'; c.fillRect(407, 30, 3, 3); c.fillRect(415, 37, 4, 3); c.fillRect(410, 39, 2, 2);
  // horizon haze
  const hz = c.createLinearGradient(0, 120, 0, 196); hz.addColorStop(0, 'rgba(255,60,170,0)'); hz.addColorStop(1, 'rgba(255,60,170,.22)');
  c.fillStyle = hz; c.fillRect(0, 120, W, 76);
  // far skyline
  const farLayer = (col, minH, maxH, winCol) => {
    let x = -6;
    while (x < W) {
      const w = 9 + rnd() * 22 | 0, h = minH + rnd() * (maxH - minH) | 0, top = 196 - h;
      c.fillStyle = col; c.fillRect(x, top, w, h);
      if (rnd() < .3) c.fillRect(x + (w / 2 | 0), top - 6 - (rnd() * 8 | 0), 1, 14);
      if (rnd() < .2) c.fillRect(x + 2, top - 3, w - 4, 3);
      c.fillStyle = winCol;
      for (let wy = top + 4; wy < 190; wy += 5) for (let wx = x + 2; wx < x + w - 2; wx += 4) if (rnd() < .18) c.fillRect(wx, wy, 1, 2);
      x += w + (rnd() * 3 | 0);
    }
  };
  farLayer('#150f33', 40, 100, '#3b2d6b');
  farLayer('#1b1440', 30, 76, '#51407f');
  // near buildings
  let x = -10, idx = 0;
  const near = [];
  while (x < W + 10) {
    const w = 36 + rnd() * 38 | 0, h = 86 + rnd() * 76 | 0, top = 190 - h;
    const col = ['#1d1838', '#231b42', '#1a1a37', '#241a3a'][idx % 4];
    near.push({ x, w, h, top, col });
    c.fillStyle = col; c.fillRect(x, top, w, 190 - top);
    c.fillStyle = '#3a2a66'; c.fillRect(x, top, 1, 190 - top);                 // rim light
    c.fillStyle = '#120f26'; c.fillRect(x + w - 2, top, 2, 190 - top);          // shade
    c.fillStyle = '#2d2552'; c.fillRect(x - 1, top, w + 2, 2);                  // ledge
    if (rnd() < .5) { c.fillStyle = '#16122c'; c.fillRect(x + 4, top - 7, 9, 7); c.fillRect(x + 5, top - 9, 7, 2); } // water tank
    if (rnd() < .5) { c.fillStyle = '#2a2448'; c.fillRect(x + w - 12, top - 4, 7, 4); }
    const wx0 = x + 4, cols = Math.floor((w - 8) / 7);
    for (let wy = top + 7; wy < 176; wy += 9) {
      for (let k = 0; k < cols; k++) {
        const wx = wx0 + k * 7;
        const lit = rnd() < .38;
        c.fillStyle = '#100d22'; c.fillRect(wx, wy, 4, 5);
        if (lit) windows.push({ x: wx, y: wy, col: rnd() < .7 ? '#ffcf6e' : (rnd() < .5 ? '#6fe3ff' : '#ff7ad1'), ph: rnd() * 100, blink: rnd() < .06 });
      }
    }
    // fire escape
    if (rnd() < .35) { c.fillStyle = '#0d0b1b'; for (let fy = top + 20; fy < 170; fy += 18) { c.fillRect(x + 3, fy, w / 2 | 0, 1); c.fillRect(x + 3, fy - 5, 1, 5); } }
    x += w + (2 + rnd() * 5 | 0); idx++;
  }
  // neon signs
  const defs = [
    { b: 1, text: 'HOTEL', col: '#ff3fa4', v: true },
    { b: 2, text: 'BAR', col: '#35f2ff' },
    { b: 3, text: '24H', col: '#ffe14d' },
    { b: 4, text: 'CLUB', col: '#b46bff', v: true },
    { b: 5, text: 'NOODLE', col: '#ff8a3d' },
    { b: 6, text: 'PAWN', col: '#5dff9b' },
    { b: 7, text: 'KARAOKE', col: '#ff4d6d', v: true },
  ];
  defs.forEach((d, i) => {
    const b = near[d.b % near.length]; if (!b) return;
    const s = 2;
    const tw = d.v ? 3 * s : pixTextW(d.text, s), th = d.v ? d.text.length * 6 * s - s : 5 * s;
    let sx = d.v ? b.x + b.w - 4 : b.x + (b.w - tw) / 2 | 0;
    let sy = b.top + (d.v ? 10 : 16 + (i % 2) * 10);
    if (sy + th > 150) sy = Math.max(b.top + 6, 150 - th);
    sx = clamp(sx, 4, W - tw - 4);
    const hits = (y) => signs.some(o => sx - 5 < o.x + o.w + 5 && sx + tw + 5 > o.x - 5 && y - 5 < o.y + o.h + 5 && y + th + 5 > o.y - 5);
    let tries = 0; while (hits(sy) && tries < 6) { sy += 12; tries++; }
    if (hits(sy) || sy + th > 186) return;
    signs.push({ x: sx, y: sy, w: tw, h: th, text: d.text, col: d.col, v: d.v, s, ph: rnd() * 10, flick: i === 3 || i === 5 });
    c.fillStyle = '#0a0816'; c.fillRect(sx - 3, sy - 3, tw + 6, th + 6);
    c.fillStyle = '#2b2346'; c.fillRect(sx - 3, sy - 3, tw + 6, 1); c.fillRect(sx - 3, sy + th + 2, tw + 6, 1);
    if (d.v) { c.fillStyle = '#2b2346'; c.fillRect(sx - 6, sy + 2, 3, 1); c.fillRect(sx - 6, sy + th - 3, 3, 1); }
    pixText(c, d.text, sx, sy, s, '#3a2440', d.v);
  });
  // wanted poster
  const px = 64, py = 158;
  c.fillStyle = '#d9c9a0'; c.fillRect(px, py, 27, 24); c.fillStyle = '#b8a47a'; c.fillRect(px, py + 23, 27, 1);
  pixText(c, 'WANTED', px + 2, py + 2, 1, '#8a1a1a');
  c.fillStyle = '#2a2320'; c.fillRect(px + 9, py + 9, 9, 7); c.fillRect(px + 7, py + 16, 13, 6); c.fillStyle = '#000'; c.fillRect(px + 9, py + 11, 9, 2);
  // sidewalk
  c.fillStyle = '#29223f'; c.fillRect(0, 190, W, 14);
  c.fillStyle = '#342c52'; c.fillRect(0, 190, W, 1);
  c.fillStyle = '#211b35'; for (let sx = 0; sx < W; sx += 22) c.fillRect(sx, 191, 1, 13);
  c.fillStyle = '#4b4270'; c.fillRect(0, 204, W, 2);
  c.fillStyle = '#17132a'; c.fillRect(0, 206, W, 1);
  // road
  const rd = c.createLinearGradient(0, 207, 0, H); rd.addColorStop(0, '#16132a'); rd.addColorStop(1, '#0c0a17');
  c.fillStyle = rd; c.fillRect(0, 207, W, H - 207);
  for (let i = 0; i < 400; i++) { c.fillStyle = rnd() < .5 ? '#1c1934' : '#0b0a15'; c.fillRect(rnd() * W | 0, 207 + rnd() * 63 | 0, 1, 1); }
  c.fillStyle = '#5c5838'; for (let lx = 6; lx < W; lx += 30) c.fillRect(lx, 247, 16, 2);
  c.fillStyle = '#3a3860'; c.fillRect(0, 264, W, 1);
  // puddles
  [[70, 256, 26], [236, 252, 34], [392, 258, 30], [150, 240, 16]].forEach(([px2, py2, pw]) => {
    puddles.push({ x: px2, y: py2, w: pw });
    c.fillStyle = '#0a0918'; c.beginPath(); c.ellipse(px2, py2, pw / 2, 3, 0, 0, Math.PI * 2); c.fill();
  });
  // street lamps
  [118, 300, 458].forEach(lx => {
    lamps.push({ x: lx + 10, y: 127 });
    c.fillStyle = '#0e0c1c'; c.fillRect(lx, 124, 2, 72); c.fillRect(lx - 1, 194, 4, 2); c.fillRect(lx, 124, 12, 2);
    c.fillStyle = '#2b2748'; c.fillRect(lx + 7, 125, 7, 2);
  });

function poseAt(keys, t) { let p = keys[0][1]; for (const k of keys) if (t >= k[0]) p = k[1]; return p; }

function startAttack() {
  const o = G.officer, b = G.boss;
  if (b.x - o.x > REACH + 3) {
    o.act = { type: 'dash', t: 0, from: o.x, to: b.x - REACH, dur: 150, then: 'attack' };
    SFX.whoosh(); G.joy = 1;
    return;
  }
  const step = G.comboStep; G.comboStep = (G.comboStep + 1) % ATTACKS.length;
  o.act = { type: 'attack', step, t: 0, hit: false, x0: o.x };
  G.attackBtn = 1;
}
function pressAttack() {
  audio();
  if (G.mode !== 'fight') return;
  const o = G.officer;
  if (!o.act) startAttack();
  else if (o.act.type === 'attack' && o.act.hit) startAttack();
  else o.queue = Math.min(o.queue + 1, 2);
}
function doHit(step) {
  const b = G.boss, o = G.officer, A = ATTACKS[step];
  const crit = step === 3 || Math.random() < 0.14;
  let dmg = Math.round(rand(1850, 2650) * (crit ? 1.85 : 1));
  b.hp = Math.max(BOSS_MAX_HP * CONFIG.bossMinHp, b.hp - dmg);
  b.flash = 0.09; b.hurtT = 0.28; b.hurtAlt ^= 1;
  b.x = Math.min(b.baseX + 14, b.x + (crit ? 5 : 3));
  G.combo++; G.comboT = 2.2; G.comboPop = 1; G.bestCombo = Math.max(G.bestCombo, G.combo);

/* ================= 업데이트 ================= */
function update(rdt) {
  G.time += rdt;
  fade = Math.max(0, fade - rdt / (CONFIG.resetFade / 1000));
  // camera / global fx (real time)
  G.shake = Math.max(0, G.shake - rdt * 38);
  G.shakeX = (Math.random() * 2 - 1) * G.shake; G.shakeY = (Math.random() * 2 - 1) * G.shake * 0.7;
  G.flash = Math.max(0, G.flash - rdt * 3.2);
  G.speedLines = Math.max(0, G.speedLines - rdt);
  G.zoomT = lerp(G.zoomT, 1, 1 - Math.exp(-rdt * 3));
  G.zoom = lerp(G.zoom, G.zoomT, 1 - Math.exp(-rdt * 14));
  G.attackBtn = Math.max(0, G.attackBtn - rdt * 5);
  G.joy = Math.max(0, G.joy - rdt * 3);
  G.comboPop = Math.max(0, G.comboPop - rdt * 5);
  G.ui = G.mode === 'fight' ? Math.min(1, G.ui + rdt * 4) : Math.max(0, G.ui - rdt * 4);
  if (G.popup) updatePopup(rdt);
  if (G.arrest) G.arrest.t += rdt;

  if (G.hitStop > 0) { G.hitStop -= rdt; return; }
  let dt = rdt;
  if (G.slow > 0) { G.slow -= rdt; dt *= 0.32; }

  if (G.mode === 'fight') G.stageTime = Math.max(0, G.stageTime - dt);
  if (G.comboT > 0) { G.comboT -= dt; if (G.comboT <= 0 && G.mode === 'fight') G.combo = 0; }
  G.scoreShown = lerp(G.scoreShown, G.score, 1 - Math.exp(-dt * 9));
  const o = G.officer, b = G.boss;
  b.hpTrail = b.hpTrail > b.hp ? Math.max(b.hp, b.hpTrail - BOSS_MAX_HP * 0.35 * dt * (b.hurtT > 0 ? 0.2 : 1)) : b.hp;

  /* officer */
  let target = 'idle';
  const a = o.act;
  if (a) {
    a.t += dt * 1000;
    if (a.type === 'dash') {
      const p = clamp(a.t / a.dur, 0, 1);
      o.x = lerp(a.from, a.to, easeOutCubic(p));
      target = 'dash';
      if (Math.random() < .5) spawnDust(o.x - 4, GROUND, 1, 3);
      o.trail.push({ x: o.x, life: .18 });
      if (p >= 1) { o.act = null; if (a.then === 'finisher') startFinisher(); else startAttack(); }
    } else if (a.type === 'attack') {
      const A = ATTACKS[a.step];
      target = poseAt(A.keys, a.t);
      if (A.lunge) o.x = a.x0 + A.lunge * easeOutCubic(clamp(a.t / A.hitAt, 0, 1));
      if (!a.hit && a.t >= A.hitAt) { a.hit = true; doHit(a.step); }
      if (a.t >= A.dur) {
        o.act = null;
        if (o.queue > 0 && G.mode === 'fight') { o.queue--; startAttack(); }
      }
    } else if (a.type === 'finisher') {
      target = a.t < 120 ? 'wind' : 'upper';
      o.x = a.x0 + 10 * easeOutCubic(clamp(a.t / 150, 0, 1));
      if (a.t > 120 && a.t < 400) o.trail.push({ x: o.x, life: .22, up: 1 });
      if (!a.hit && a.t >= 150) { a.hit = true; finisherHit(); }
      if (a.t >= 620) o.act = null;
    } else if (a.type === 'walk') {
      const p = clamp(a.t / a.dur, 0, 1);
      o.x = lerp(a.from, a.to, p);
      target = (a.t / 90 | 0) % 2 ? 'walkA' : 'walkB';
      if (p >= 1) { o.act = { type: 'cuff', t: 0, clicked: false }; }
    } else if (a.type === 'cuff') {
      target = 'cuff';
      if (!a.clicked && a.t > 150) {
        a.clicked = true; SFX.cuff(); b.pose = 'cuffed';
        const hp = bossWorldPoint(b.j.hF[0], b.j.hF[1]);
        spawnSparks(hp[0], hp[1], 6, false);
        addText('CUFFED!', hp[0], hp[1] - 16, { size: 64, style: 'cuff', life: 1.0, vy: -30, rot: -0.05 });
      }
      if (a.t > 620) o.act = { type: 'victory', t: 0 };
    } else if (a.type === 'victory') {
      target = 'victory';
    }
  } else if (G.mode === 'fight') {
    // keep distance
    const want = b.x - REACH;
    if (o.x < want - 10) { o.x += 55 * dt; o.walkT += dt; target = (o.walkT * 1000 / 110 | 0) % 2 ? 'walkA' : 'walkB'; }
  }
  if (o.x > b.x - 24 && b.fallT < 0) o.x = b.x - 24;
  o.pose = target;
  const snap = (target === 'jab' || target === 'cross' || target === 'kick' || target === 'upper') ? 60 : 16;
  blendJ(o.j, OFFICER_POSES[target], 1 - Math.exp(-dt * snap));
  if (target === 'idle') { o.j.dy = Math.sin(G.time * 5) * 0.6; }
  o.trail.forEach(t => t.life -= dt); o.trail = o.trail.filter(t => t.life > 0).slice(-8);

  /* boss */
  b.flash = Math.max(0, b.flash - dt);
  let bt = 'idle';
  if (b.fallT >= 0) {
    b.fallT += dt;
    const FALL = 0.52;
    const p = clamp(b.fallT / FALL, 0, 1);
    if (p < 1) { b.angle = (Math.PI / 2) * p * p; b.x += b.fallVX * dt; bt = 'fall'; }
    else {
      if (!b.landed) {
        b.landed = true; b.landT = 0; shake(9); SFX.thud();
        spawnDust(b.x + 30, GROUND, 18, 34); G.zoomT = 1.05;
        G.arrest.landedAt = G.arrest.t;
        const o2 = G.officer;
        o2.act = { type: 'walk', t: 0, from: o2.x, to: Math.max(o2.x, b.x - 8), dur: 260 };
      }
      b.landT += dt;
      const q = clamp(b.landT / 0.3, 0, 1);
      b.angle = Math.PI / 2 - Math.sin(q * Math.PI) * 0.12 * (1 - q);
      b.dizzy += dt;

    b.hurtT -= dt; bt = b.hurtAlt ? 'hurt' : 'hurt2';
  } else {
    b.x = Math.max(b.baseX, b.x - 10 * dt);
    b.tauntT -= dt;
    if (b.tauntT < 0) { bt = 'taunt'; if (b.tauntT < -0.7) b.tauntT = rand(2.8, 4.5); }
    else bt = (G.time % 1.4) < 0.7 ? 'idle' : 'idle2';
  }
  blendJ(b.j, BOSS_POSES[bt], 1 - Math.exp(-dt * (bt.startsWith('hurt') ? 40 : bt === 'fall' ? 18 : 8)));
  if (G.arrest && G.arrest.landedAt !== undefined && !G.popup && G.arrest.t - G.arrest.landedAt >= CONFIG.popupAfterLanding / 1000) openPopup();

  /* particles */
  for (const p of G.parts) {
    p.t += dt;
    if (p.vx !== undefined) { p.x += p.vx * dt; p.y += p.vy * dt; if (p.g) p.vy += p.g * dt; if (p.k === 'dust') { p.vx *= 0.94; p.vy *= 0.94; } }
  }
  G.parts = G.parts.filter(p => p.t < p.life);
  for (const t of G.texts) { t.t += dt; t.wy += t.vy * dt * (t.t < 0.12 ? 0.2 : 1); t.wx += t.vx * dt; }
  G.texts = G.texts.filter(t => t.t < t.life);
  rain.forEach(r => { r.y += r.v * rdt; r.x -= r.v * 0.25 * rdt; if (r.y > H) { if (r.y < H + 20) splashes.push({ x: r.x, y: rand(210, 268), t: 0 }); r.y = rand(-40, -2); r.x = rand(0, W + 40); } });
  splashes.forEach(s => s.t += rdt); for (let i = splashes.length - 1; i >= 0; i--) if (splashes[i].t > .2) splashes.splice(i, 1);
}
function bossWorldPoint(px, py) {
  const b = G.boss, lift = 15 * Math.sin(b.angle);
  const x = -px, y = py; // boss sprite is mirrored (faces left)
  const c = Math.cos(b.angle), s = Math.sin(b.angle);
  return [b.x + x * c - y * s, GROUND - lift + x * s + y * c];

/* ================= 체포 팝업 ================= */
function openPopup() {

function updatePopup(dt) {

}

/* ================= 비 ================= */
const rain = Array.from({ length: 90 }, () => ({ x: rand(0, W + 40), y: rand(-H, H), v: rand(260, 360) }));
const splashes = [];

/* ================= 렌더 (월드) ================= */
function renderWorld() {
  const t = G.time;
  lc.globalCompositeOperation = 'source-over';
  lc.drawImage(bgCv, 0, 0);
  ec.clearRect(0, 0, W, H);
  // windows
  for (const w of windows) {
    if (w.blink && Math.sin(t * 0.7 + w.ph) > 0.6) continue;
    lc.fillStyle = w.col; lc.fillRect(w.x, w.y, 4, 5);
    lc.fillStyle = 'rgba(0,0,0,.35)'; lc.fillRect(w.x, w.y + 3, 4, 2);
    ec.globalAlpha = 0.35; ec.fillStyle = w.col; ec.fillRect(w.x, w.y, 4, 5); ec.globalAlpha = 1;
  }
  // neon signs
  for (const s of signs) {
    let on = 1;
    if (s.flick) { const f = Math.sin(t * 13 + s.ph) + Math.sin(t * 2.3 + s.ph * 3); if (f > 1.55) on = 0.15; }
    const pulse = 0.85 + 0.15 * Math.sin(t * 3 + s.ph);
    lc.globalAlpha = on; pixText(lc, s.text, s.x, s.y, s.s, s.col, s.v); lc.globalAlpha = 1;
    ec.globalAlpha = on * pulse; pixText(ec, s.text, s.x, s.y, s.s, s.col, s.v);
    ec.fillStyle = s.col; ec.globalAlpha = on * 0.25 * pulse; ec.fillRect(s.x - 4, s.y - 4, s.w + 8, s.h + 8); ec.globalAlpha = 1;
    // road reflection
    const rx = s.x + s.w / 2, len = 18 + s.h * 0.4;
    for (let k = 0; k < len; k += 2) {
      const wob = Math.sin(t * 4 + k * 0.7 + s.ph) * 1.5;
      lc.globalAlpha = on * 0.16 * (1 - k / len); lc.fillStyle = s.col;
      lc.fillRect(Math.round(rx - s.w / 3 + wob), 209 + k, Math.max(2, s.w * 0.66 | 0), 1);
    }
    lc.globalAlpha = 1;
  }

  for (const p of puddles) {
    lc.fillStyle = 'rgba(120,90,220,.18)'; lc.fillRect(p.x - p.w / 2 + 3, p.y - 1, p.w - 6, 1);
    lc.fillStyle = 'rgba(255,80,180,.25)'; lc.fillRect(p.x - 4 + Math.sin(t * 2 + p.x) * 3, p.y, 6, 1);
  }
  // lamps
  for (const l of lamps) {
    lc.fillStyle = '#fff2c2'; lc.fillRect(l.x - 3, l.y, 6, 2);
    ec.fillStyle = '#ffe7a3'; ec.fillRect(l.x - 4, l.y - 1, 8, 4);
    lc.globalCompositeOperation = 'lighter';
    const g = lc.createLinearGradient(0, l.y, 0, 206);

    lc.fillStyle = g; lc.beginPath(); lc.moveTo(l.x - 3, l.y + 2); lc.lineTo(l.x + 3, l.y + 2); lc.lineTo(l.x + 22, 206); lc.lineTo(l.x - 22, 206); lc.closePath(); lc.fill();
    lc.fillStyle = 'rgba(255,220,140,.08)'; lc.beginPath(); lc.ellipse(l.x, 212, 26, 5, 0, 0, Math.PI * 2); lc.fill();
    lc.globalCompositeOperation = 'source-over';
  }
  // police light bar
  const ph = (t * 4) % 2 < 1, cx = 8 + 30, cy = 191;
  const red = ph ? '#ff2a3a' : '#5a1018', blue = ph ? '#0e2a70' : '#2f7bff';
  lc.fillStyle = red; lc.fillRect(cx, cy, 8, 3); lc.fillStyle = blue; lc.fillRect(cx + 10, cy, 8, 3);
  ec.fillStyle = ph ? '#ff2a3a' : '#2f7bff'; ec.fillRect(ph ? cx - 3 : cx + 7, cy - 3, 14, 9);
  lc.globalCompositeOperation = 'lighter';
  lc.fillStyle = ph ? 'rgba(255,40,60,.10)' : 'rgba(40,110,255,.12)';
  lc.beginPath(); lc.ellipse(ph ? 40 : 60, 222, 70, 16, 0, 0, Math.PI * 2); lc.fill();
  lc.fillRect(0, 150, 140, 60);
  lc.globalCompositeOperation = 'source-over';

  // rain (back)
  lc.fillStyle = 'rgba(150,180,255,.22)';
  for (let i = 0; i < rain.length; i += 2) { const r = rain[i]; lc.fillRect(Math.round(r.x), Math.round(r.y), 1, 4); }

  // characters
  const o = G.officer, b = G.boss;
  // shadows
  lc.fillStyle = 'rgba(0,0,0,.45)';
  lc.beginPath(); lc.ellipse(o.x + 1, GROUND + 1, 11, 2.5, 0, 0, Math.PI * 2); lc.fill();
  lc.beginPath(); lc.ellipse(b.x + Math.sin(b.angle) * 34, GROUND + 1, 20 + Math.sin(b.angle) * 22, 3, 0, 0, Math.PI * 2); lc.fill();

  }
  drawOfficer(lc, o.x, o.y, o.j, { bigFist: o.pose === 'jab' || o.pose === 'cross' || o.pose === 'upper', cuffs: o.pose === 'cuff' || o.pose === 'victory' });
  if (o.pose === 'upper' && o.act && o.act.type === 'finisher') {

        c.closePath(); c.fill();

      const a = i / 48 * Math.PI * 2 + (i * 1.7 % 1) * 0.1, r0 = 380 + (i * 97 % 260), w = 0.012 + (i * 13 % 7) * 0.002;
      c.beginPath(); c.moveTo(cx + Math.cos(a) * r0, UIH / 2 + Math.sin(a) * r0);
      c.lineTo(cx + Math.cos(a - w) * 1400, UIH / 2 + Math.sin(a - w) * 1400); c.lineTo(cx + Math.cos(a + w) * 1400, UIH / 2 + Math.sin(a + w) * 1400); c.closePath(); c.fill();
    }
    c.restore();
  }
}

function renderPopup(c) {
  const p = G.popup; if (!p) return;
  const t = p.t, cx = UIW / 2, cy = UIH / 2 + 20;
  c.fillStyle = `rgba(2,0,12,${clamp(t / 0.3, 0, 1) * 0.62})`; c.fillRect(0, 0, UIW, UIH);
  // rays
  c.save(); c.translate(cx, cy - 40); c.rotate(t * 0.35); c.globalAlpha = clamp(t / 0.4, 0, 1) * 0.35;
  for (let i = 0; i < 18; i++) {
    c.rotate(Math.PI * 2 / 18);
    const g = c.createLinearGradient(0, 0, 0, -900); g.addColorStop(0, i % 2 ? 'rgba(255,220,90,.9)' : 'rgba(80,230,255,.9)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = g; c.beginPath(); c.moveTo(0, 0); c.lineTo(-60, -900); c.lineTo(60, -900); c.closePath(); c.fill();
  }
  c.restore();
  // confetti (behind panel edges too)
  // panel
  const sc = t < 0.5 ? easeOutElastic(t / 0.5) : 1;
  const pw = 1060, ph = 620;
  c.save(); c.translate(cx, cy); c.scale(sc, sc);
  // neon frame
  c.shadowColor = '#ff2fd0'; c.shadowBlur = 40 + Math.sin(t * 6) * 12;
  rrect(c, -pw / 2, -ph / 2, pw, ph, 30);
  const pg = c.createLinearGradient(0, -ph / 2, 0, ph / 2); pg.addColorStop(0, 'rgba(26,8,60,.96)'); pg.addColorStop(1, 'rgba(6,4,24,.96)');
  c.fillStyle = pg; c.fill();
  c.lineWidth = 8; c.strokeStyle = '#ff3fd6'; c.stroke();
  c.shadowColor = '#35f2ff'; c.shadowBlur = 26;
  rrect(c, -pw / 2 + 16, -ph / 2 + 16, pw - 32, ph - 32, 20); c.lineWidth = 3; c.strokeStyle = '#35f2ff'; c.stroke();
  c.shadowBlur = 0;
  // grid pattern
  c.save(); rrect(c, -pw / 2 + 18, -ph / 2 + 18, pw - 36, ph - 36, 18); c.clip();
  c.strokeStyle = 'rgba(120,80,255,.12)'; c.lineWidth = 2;
  for (let x = -pw / 2; x < pw / 2; x += 40) { c.beginPath(); c.moveTo(x, -ph / 2); c.lineTo(x, ph / 2); c.stroke(); }
  for (let y = -ph / 2; y < ph / 2; y += 40) { c.beginPath(); c.moveTo(-pw / 2, y); c.lineTo(pw / 2, y); c.stroke(); }
  c.restore();
  // header ribbon
  const rg = c.createLinearGradient(-360, 0, 360, 0); rg.addColorStop(0, '#00b3ff'); rg.addColorStop(.5, '#6ff2ff'); rg.addColorStop(1, '#00b3ff');
  c.fillStyle = rg; c.beginPath(); c.moveTo(-380, -ph / 2 - 34); c.lineTo(380, -ph / 2 - 34); c.lineTo(350, -ph / 2 + 30); c.lineTo(-350, -ph / 2 + 30); c.closePath(); c.fill();
  c.fillStyle = '#006a9e'; c.beginPath(); c.moveTo(-380, -ph / 2 - 34); c.lineTo(-440, -ph / 2 - 10); c.lineTo(-350, -ph / 2 + 30); c.closePath(); c.fill();
  c.beginPath(); c.moveTo(380, -ph / 2 - 34); c.lineTo(440, -ph / 2 - 10); c.lineTo(350, -ph / 2 + 30); c.closePath(); c.fill();
  text(c, '[ MISSION COMPLETE ]', 0, -ph / 2 + 12, 40, '#04203a', { align: 'center', letter: 5 });
  // stars
  for (let i = 0; i < 3; i++) {
    const st = [0.55, 0.7, 0.85][i], k = clamp((t - st) / 0.25, 0, 1);
    const sx = (i - 1) * 120, sy = -ph / 2 + 100 - (i === 1 ? 18 : 0);
    const ssz = (i === 1 ? 54 : 44) * (k > 0 ? easeOutBack(k) : 0);
    star(c, sx, sy, 58 * (i === 1 ? 1.2 : 1), '#2a1a4a', '#120a26');
    if (k > 0) { c.save(); c.shadowColor = '#ffcc00'; c.shadowBlur = 30; star(c, sx, sy, ssz * 1.1, '#fff27a', '#ffae00'); c.restore(); }
  }
  // main title
  const tp = clamp((t - 0.15) / 0.3, 0, 1);
  c.save(); c.translate(0, -52); c.scale(0.6 + 0.4 * easeOutBack(tp), 0.6 + 0.4 * easeOutBack(tp)); c.globalAlpha = tp;
  c.font = `900 104px ${FONT_UI}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
  c.lineWidth = 26; c.strokeStyle = '#000'; c.strokeText('VILLAIN ARRESTED!', 0, 6);
  c.lineWidth = 12; c.strokeStyle = '#b3005e'; c.strokeText('VILLAIN ARRESTED!', 0, 0);
  const tg = c.createLinearGradient(0, -50, 0, 50); tg.addColorStop(0, '#ffffff'); tg.addColorStop(.45, '#fff27a'); tg.addColorStop(1, '#ff9d00');
  c.shadowColor = '#ffb300'; c.shadowBlur = 24 + Math.sin(t * 5) * 10;
  c.fillStyle = tg; c.fillText('VILLAIN ARRESTED!', 0, 0);
  c.restore();
  text(c, 'STAGE CLEAR', 0, 30, 42, '#9ff7ff', { align: 'center', letter: 12, glow: '#35f2ff', blur: 18 });
  // mugshot + stamp
  const mx = -pw / 2 + 70, my = 92;
  c.fillStyle = '#e9e2cf'; c.fillRect(mx, my, 150, 130);
  c.fillStyle = '#c9c0a8'; for (let i = 0; i < 5; i++) c.fillRect(mx, my + 20 + i * 22, 150, 2);
  c.imageSmoothingEnabled = false; c.drawImage(bossPortrait, mx + 16, my + 6, 118, 118);
  c.fillStyle = '#1a1a1a'; c.fillRect(mx + 20, my + 104, 110, 22); text(c, 'NO. 0745', mx + 75, my + 121, 16, '#fff', { align: 'center', letter: 2 });
  if (p.stamp) {
    const k = clamp((t - 1.0) / 0.15, 0, 1), s = lerp(2.6, 1, easeOutCubic(k));
    c.save(); c.translate(mx + 78, my + 64); c.rotate(-0.28); c.scale(s, s); c.globalAlpha = k * 0.92;
    rrect(c, -86, -26, 172, 52, 6); c.lineWidth = 6; c.strokeStyle = '#ff1f3d'; c.stroke();
    text(c, 'ARRESTED', 0, 12, 34, '#ff1f3d', { align: 'center', letter: 2 });
    c.restore();
  }
  // rewards
  const rw = [['EXP', `+${fmt(p.exp)}`, '#6fd6ff'], ['GOLD', `+${fmt(p.gold)}`, '#ffd24a'], ['RANK', t > 1.9 ? 'S' : '-', '#ff3fa4']];
  rw.forEach(([k, v, col], i) => {
    const x = -140 + i * 220, y = 88;
    rrect(c, x - 20, y, 200, 140, 16); c.fillStyle = 'rgba(255,255,255,.06)'; c.fill(); c.lineWidth = 2; c.strokeStyle = col; c.globalAlpha = .55; c.stroke(); c.globalAlpha = 1;
    if (i === 0) { c.fillStyle = col; c.beginPath(); c.arc(x + 80, y + 30, 17, 0, 7); c.fill(); text(c, 'XP', x + 80, y + 37, 16, '#032133', { align: 'center' }); }
    if (i === 1) coin(c, x + 80, y + 30, 17);
    if (i === 2) star(c, x + 80, y + 30, 18, '#ff8ad0', '#ff3fa4');
    text(c, k, x + 80, y + 76, 20, col, { align: 'center', letter: 4 });
    const big = i === 2 && t > 1.9 ? 1 + 0.4 * Math.max(0, 1 - (t - 1.9) * 4) : 1;
    text(c, v, x + 80, y + 122, (i === 2 ? 48 : 34) * big, i === 2 ? '#ff5ab8' : '#fff', { align: 'center', stroke: '#000', sw: 6, glow: i === 2 ? '#ff3fa4' : null, blur: 20 });
  });
  if (t > 2.2 && Math.sin(t * 5) > -0.2) text(c, 'TAP TO CONTINUE', 0, ph / 2 - 34, 24, '#c9d3ff', { align: 'center', letter: 6 });
  c.restore();
  // confetti
  for (const k of G.confetti) {
    c.save(); c.translate(k.x, k.y); c.rotate(k.r); c.fillStyle = k.col; c.fillRect(-k.w / 2, -k.h / 2 * Math.abs(Math.cos(k.r * 2)), k.w, k.h * Math.abs(Math.cos(k.r * 2)) + 1); c.restore();
  }
}
function star(c, x, y, r, colA, colB) {
  if (r <= 0) return;
  const g = c.createLinearGradient(x, y - r, x, y + r); g.addColorStop(0, colA); g.addColorStop(1, colB);
  c.fillStyle = g; c.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  c.closePath(); c.fill(); c.lineWidth = 4; c.strokeStyle = 'rgba(0,0,0,.6)'; c.stroke();
}

/* ================= 메인 루프 ================= */
function frame() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.beginPath(); ctx.rect(view.x, view.y, view.w, view.h); ctx.clip();
  // world
  const k = view.w / W;
  ctx.translate(view.x + view.w / 2 + G.shakeX * k, view.y + view.h / 2 + G.shakeY * k);
  ctx.scale(k * CAM.zoom * G.zoom, k * CAM.zoom * G.zoom);
  ctx.translate(-CAM.x, -CAM.y);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(low, -2, -2, W + 4, H + 4);
  ctx.imageSmoothingEnabled = true;
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.75; ctx.drawImage(bloom, -2, -2, W + 4, H + 4);
  ctx.globalAlpha = 0.45; ctx.drawImage(bloom, -10, -8, W + 20, H + 16);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  // UI
  ctx.setTransform(view.s, 0, 0, view.s, view.x, view.y);
  renderHUD(ctx);
  renderPopup(ctx);
  if (G.flash > 0) { ctx.globalAlpha = clamp(G.flash, 0, 1); ctx.fillStyle = G.flashCol; ctx.fillRect(0, 0, UIW, UIH); ctx.globalAlpha = 1; }
  if (fade > 0) { ctx.globalAlpha = fade; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, UIW, UIH); ctx.globalAlpha = 1; }
  ctx.restore();
}
let last = performance.now();
function loop(now) {
  const rdt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  update(rdt);
  renderWorld();
  frame();
  requestAnimationFrame(loop);
}
buildBackground();
buildPortraits();
if (CONFIG.bgmOnStart) addEventListener('pointerdown', () => setBgm(true), { once: true });
window.__game = { get state() { return G; }, pressAttack, pressArrest, doReset };
requestAnimationFrame(loop);
})();
</script>
