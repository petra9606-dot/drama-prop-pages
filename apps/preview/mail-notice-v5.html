const viewer=document.querySelector('.viewer'), opened=document.querySelector('.opened'), closer=document.querySelector('.close');
let lastButton;
document.querySelectorAll('[data-person]').forEach(button=>button.addEventListener('click',()=>{lastButton=button;opened.src=images[button.dataset.person];viewer.classList.add('open');viewer.setAttribute('aria-hidden','false');document.querySelector('.document').scrollTop=0;closer.focus();}));
function closeNotice(){viewer.classList.remove('open');viewer.setAttribute('aria-hidden','true');lastButton?.focus();}
closer.addEventListener('click',closeNotice);
document.addEventListener('keydown',event=>{if(event.key==='Escape')closeNotice();});
