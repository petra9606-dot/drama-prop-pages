/* ── 렌더 & 조작 ────────────────────────────── */
const app = document.getElementById('app');
const sbar = document.getElementById('sbar');

function stopTicker() { if (ticker) { clearInterval(ticker); ticker = null; } }

function paint() {
  let html, bar = 'sbar';
  if (st.phase === 'notify') { html = lockScreen(); bar = 'sbar dim'; }
  else if (st.phase === 'control') { html = controlScreen(); bar = 'sbar dim'; }
  else if (st.phase === 'settings') { html = settingsScreen(); bar = 'sbar light'; }
  else html = mainScreen();
  sbar.className = bar;
  app.innerHTML = html;
  wire();
}

function wire() {
  app.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => setPhase(b.dataset.go)));
  app.querySelectorAll('[data-timer]').forEach(b => b.addEventListener('click', () => { st.seconds = Number(b.dataset.timer); setPhase('timer'); }));
  app.querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.act === 'bonus') return setPhase('bonus');
    if (b.dataset.act === 'move') { st.moving = true; paint(); }
  }));
  const accept = app.querySelector('[data-slide="accept"]');
  const reject = app.querySelector('[data-slide="reject"]');
  if (accept) PV.slider(accept, { direction: 'right', onComplete: () => {
    if (reject) reject.dataset.locked = '1';
    st.phase === 'fee' ? setPhase('bonus') : setPhase('timer');
  } });
  if (reject) PV.slider(reject, { direction: 'left', onComplete: () => {
    if (accept) accept.dataset.locked = '1';
    setPhase(st.phase === 'fee' ? 'waiting' : 'timer');
  } });
  const logo = app.querySelector('.brand');
  if (logo) logo.addEventListener('click', () => setPhase('control'));
  const dots = app.querySelector('.dots');
  if (dots) dots.addEventListener('click', () => setPhase('settings'));
  const close = app.querySelector('.ctl .close');
  if (close) close.addEventListener('click', () => setPhase('timer'));
  const back = app.querySelector('.set .back');
  if (back) back.addEventListener('click', () => setPhase('timer'));
  const noti = app.querySelector('.noti');
  if (noti) noti.addEventListener('click', () => setPhase('call'));
}

function setPhase(next) {
  stopTicker();
  if (next === 'call') { st.phase = 'fee'; }
  else if (next === 'waiting') { st.phase = 'waiting'; }
  else st.phase = next;
  if (st.phase === 'timer' && !document.body.classList.contains('shot')) {
    ticker = setInterval(() => {
      st.seconds = Math.max(0, st.seconds - 1);
      if (st.phase !== 'timer') return stopTicker();
      paint();
    }, 1000);
  }
  paint();
}

    { id: 'bonus', label: '도착 보너스 팝업', cap: '접수 완료를 누르면 10분 이내 도착 보너스가 안내되고, 확인을 누르면 타이머가 시작됩니다.' },
    { id: 'timer', label: '타이머 진행 중', cap: '타이머는 스크롤하지 않아도 지도 바로 아래에 계속 보입니다. 3분 이하로 내려가면 주황, 1분 이하는 빨강으로 바뀝니다.' },
    { id: 'timerEnd', label: '종료 직전 00:10', cap: '숨겨진 버튼으로 종료 직전까지 한 번에 점프할 수 있습니다. 촬영에서 긴박한 컷을 바로 찍을 때 씁니다.' },
    { id: 'earnings', label: '예상 수입 정산', cap: '수수료와 보너스가 합쳐진 예상 수입 시트입니다.' },
    { id: 'offer', label: '표준 콜 알림', cap: '배달 중에 다음 콜이 들어오는 장면입니다.' },
    { id: 'special', label: '특별 콜 알림', cap: '고수익 특별 콜은 앰버 색으로 구분되고 슬라이더도 함께 바뀝니다.' },
    { id: 'notify', label: '예약 알림 (잠금화면)', cap: 'v10 신규. 예약해 둔 시간에 화면이 꺼져 있어도 잠금화면에 콜 알림이 뜹니다. 알림을 누르면 바로 콜 화면이 열립니다.' },
    { id: 'control', label: '촬영 CONTROL 패널', cap: '앱 로고를 0.8초 길게 누르면 열립니다. 장면·타이머·콜 알림·콜 예약을 여기서 한 번에 조작합니다.' },
    { id: 'settings', label: '촬영 설정', cap: 'v10에서 수수료·보너스·경유지 수·경로 반경까지 촬영 현장에서 직접 바꿀 수 있습니다.' }
  ],
  render: scene => {
    stopTicker();
    st.moving = false;
    if (scene.id === 'timerEnd') { st.seconds = 10; setPhase('timer'); }
    else if (scene.id === 'timer') { st.seconds = 540; setPhase('timer'); }
    else if (scene.id === 'earnings') { st.seconds = 480; setPhase('earnings'); }
    else if (scene.id === 'offer' || scene.id === 'special') { st.seconds = 420; setPhase(scene.id); }
    else if (scene.id === 'bonus') { st.seconds = 600; setPhase('bonus'); }
    else setPhase(scene.id);
  }
});
</script>
</body>
</html>
