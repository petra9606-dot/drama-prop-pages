<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>길봄 내비 · 화면 미리보기</title>
<link rel="stylesheet" href="phone.css">
<style>
.n{--blue:#244e78;background:#e9efe9;position:relative}
.n .map{position:absolute;inset:0}
.n .map svg{width:100%;height:100%;display:block}
.n .layer{position:relative;z-index:2;flex:1;display:flex;flex-direction:column}
.n .panel{margin:16px 14px 0;background:#fff;border-radius:23px;padding:18px;box-shadow:0 8px 24px rgba(20,40,60,.18)}
.n .brand{display:flex;align-items:center;gap:9px;margin-bottom:16px}
.n .brand b{font-size:22px;font-weight:900;color:var(--blue)}
.n .brand span{font-size:11px;color:#8f9daa}
.n .brand i{margin-left:auto;font-size:22px;color:var(--blue);font-style:normal}
.n .search{background:#f0f4f7;border-radius:14px;padding:0 12px;display:flex;align-items:center;gap:8px}
.n .search .ic{font-size:24px;color:var(--blue)}
.n .search input{flex:1;min-width:0;height:48px;border:0;background:transparent;font-size:16px;font-family:inherit;outline:none;color:#26394b}
.n .sec{color:#8f9ca7;font-size:12px;margin-top:15px}
.n .origin{font-size:15px;border-bottom:1px solid #edf0f2;height:38px;display:flex;align-items:center;color:#26394b}
.n .dest{font-size:15px;color:#26394b;padding:11px 0}
.n .dest.ph{color:#98a5b0}
.n .start{background:var(--blue);border:0;border-radius:12px;width:100%;padding:15px;color:#fff;font-weight:800;font-size:15px;margin-top:15px}
.n .notice{color:#a6adb2;font-size:10px;text-align:center;margin-top:12px}
.n .top{position:absolute;top:16px;left:14px;right:14px;background:var(--blue);border-radius:20px;padding:17px;display:flex;align-items:center;gap:18px;box-shadow:0 8px 22px rgba(20,40,60,.3)}
.n .top .ar{color:#fff;font-size:38px;line-height:1}
.n .top .dist{color:#fff;font-size:26px;font-weight:900;font-variant-numeric:tabular-nums}
.n .top .txt{color:#d9e8f6;margin-top:3px;font-size:14px}
.n .bot{position:absolute;bottom:16px;left:14px;right:14px;background:#fff;border-radius:21px;padding:18px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 8px 22px rgba(20,40,60,.22)}
.n .bot .eta{font-size:19px;font-weight:900;color:var(--blue)}
.n .bot .dd{color:#677683;margin-top:4px;font-size:13px}
.n .bot .end{background:#e8edf0;border:0;border-radius:12px;padding:13px 16px;color:#45606f;font-weight:700;font-size:14px}
.n .arrived{position:absolute;left:18px;right:18px;top:40%;background:var(--blue);border-radius:21px;padding:23px;text-align:center;box-shadow:0 14px 30px rgba(20,40,60,.35)}
.n .arrived b{color:#fff;font-size:22px;font-weight:900;display:block}
.n .arrived span{color:#dbeaf5;margin-top:7px;display:block;font-size:14px}
.n .setp{margin:16px 14px 0;background:#fff;border-radius:20px;padding:19px}
.n .setp .hd{display:flex;align-items:center;gap:14px}
.n .setp .bk{font-size:30px;color:var(--blue);line-height:1}
.n .setp h3{margin:0;color:var(--blue);font-size:19px;font-weight:800}
.n .setp .help{color:#87949f;line-height:1.6;margin-top:14px;font-size:13px}
.n .setp .lb{color:#6b7886;margin:18px 0 6px;font-size:13px}
.n .setp .fd{border:1px solid #d7dfe6;border-radius:10px;padding:13px 14px;min-height:46px;font-size:16px;color:#26394b}
</style>
</head>
<body>
<header class="pv-top">
  <a class="pv-back" href="../showcase/index.html">← 촬영용 앱 화면</a>
  <div class="pv-title">길봄 내비 <span>촬영용 길안내</span></div>
  <div class="pv-links">
    <a href="../showcase/index.html">화면 캡처 보기</a>
    <a class="solid" href="../gilbom-nav-v3-real-map.apk" download>APK 내려받기</a>
  </div>
</header>
<main class="pv-main">
  <div>
    <div class="pv-stage"><div class="phone"><div class="phone-shell"><div class="phone-screen">
      <div class="sbar light" id="sbar"><span>9:41</span><em>▮▮▮ ◗</em></div>
      <div class="app n" id="app"></div>
    </div></div></div></div>
    <p class="pv-cap"></p>
  </div>
  <aside class="pv-side">
    <h2>장면 고르기</h2>
    <div class="pv-scenes" id="scenes"></div>
    <p class="pv-note">목적지를 입력하고 <b>경로 안내 시작</b>을 누르면 실제로 안내가 진행되고 도착 화면까지 이어집니다. 거리·시간·재생 속도는 설정에서 촬영에 맞게 정합니다. 지도의 지명은 <b>모두 가상</b>입니다.</p>
  </aside>
</main>
<script src="phone.js"></script>
<script>
let dest = '새빛동 은하수길 24';
let mode = 'home', progress = 0, timer = null;
const STEPS = ['출발지에서 직진하세요', '앞에서 우회전하세요', '새빛교를 건너 계속 직진하세요', '목적지가 오른쪽에 있습니다'];
const CFG = { km: 3.8, min: 16 };
const app = document.getElementById('app');

function routePoint(p) {
  const pts = [[75, 595], [75, 475], [194, 475], [194, 310], [310, 310], [310, 145]];
  const len = pts.slice(1).map((q, i) => Math.hypot(q[0] - pts[i][0], q[1] - pts[i][1]));
  let d = Math.max(0, Math.min(1, p)) * len.reduce((a, b) => a + b, 0);
  for (let i = 0; i < len.length; i++) {
    if (d <= len[i]) { const t = d / len[i]; return { x: pts[i][0] + (pts[i + 1][0] - pts[i][0]) * t, y: pts[i][1] + (pts[i + 1][1] - pts[i][1]) * t }; }
    d -= len[i];
  }
  return { x: 310, y: 145 };
}
function mapSvg(showCar) {
  const route = 'M 75 595 L 75 475 L 194 475 L 194 310 L 310 310 L 310 145';
  const pt = routePoint(progress);
  return '<svg viewBox="0 0 390 680" preserveAspectRatio="xMidYMid slice">' +
    '<rect width="390" height="680" fill="#e9efe9"/>' +
    '<path d="M0 185 H390 M0 310 H390 M0 475 H390 M0 585 H390 M75 0 V680 M194 0 V680 M310 0 V680" stroke="#d0d9d6" stroke-width="23"/>' +
    '<path d="M0 185 H390 M0 310 H390 M0 475 H390 M0 585 H390 M75 0 V680 M194 0 V680 M310 0 V680" stroke="#fff" stroke-width="19"/>' +
    '<path d="M3 360 C 120 334, 245 390, 390 360" stroke="#b8d9e4" stroke-width="34" fill="none"/>' +
    '<g fill="#c8d6c9"><rect x="112" y="63" width="46" height="88" rx="4"/><rect x="220" y="356" width="66" height="67" rx="4"/><rect x="335" y="510" width="38" height="53" rx="4"/></g>' +
    '<g fill="#f2e6d2"><rect x="22" y="213" width="26" height="57" rx="3"/><rect x="226" y="42" width="60" height="80" rx="3"/><rect x="112" y="518" width="46" height="52" rx="3"/></g>' +
    '<g font-family="\'Malgun Gothic\',sans-serif"><text x="113" y="246" fill="#84918b" font-size="13">새빛공원</text>' +
    '<text x="211" y="263" fill="#84918b" font-size="12">별하동</text><text x="10" y="403" fill="#79a4b3" font-size="11">새빛천</text>' +
    '<text x="232" y="150" fill="#84918b" font-size="12">한별아파트</text><text x="30" y="560" fill="#84918b" font-size="12">솔밭시장</text></g>' +
    '<path d="' + route + '" stroke="#fff" stroke-width="18" fill="none" stroke-linejoin="round" stroke-linecap="round"/>' +
    '<path d="' + route + '" stroke="#327bc3" stroke-width="11" fill="none" stroke-linejoin="round" stroke-linecap="round"/>' +
    '<circle cx="75" cy="595" r="13" fill="#fff" stroke="#327bc3" stroke-width="5"/>' +
    '<circle cx="310" cy="145" r="21" fill="#d1483f"/><text x="302" y="153" font-size="19" fill="#fff" font-weight="bold">◆</text>' +
    '<rect x="175" y="85" width="180" height="35" rx="11" fill="#fff"/><text x="188" y="108" fill="#26394b" font-size="14" font-weight="bold" font-family="\'Malgun Gothic\',sans-serif">' + PV.esc(dest.slice(0, 11)) + '</text>' +
    (showCar ? '<circle cx="' + pt.x + '" cy="' + pt.y + '" r="23" fill="rgba(40,115,186,.2)"/><circle cx="' + pt.x + '" cy="' + pt.y + '" r="13" fill="#2873ba" stroke="#fff" stroke-width="4"/>' : '') +
    '</svg>';
}

function paint() {
  let layer = '';
  if (mode === 'home') {
    layer = '<div class="panel"><div class="brand"><b>길봄</b><span>길을 그리다</span><i class="tap" data-set="1">☰</i></div>' +
      '<div class="search"><div class="ic">⌕</div><input id="dest" value="' + PV.esc(dest) + '" placeholder="어디로 갈까요?"></div>' +
      '<div class="sec">출발지</div><div class="origin">현재 위치</div>' +
      '<div class="sec">목적지</div><div class="dest' + (dest ? '' : ' ph') + '">' + (PV.esc(dest) || '가상의 위치 이름을 입력하세요') + '</div>' +
      '<button class="start" data-start="1">경로 안내 시작　➜</button>' +
      '<div class="notice">실제 지도 데이터 위에서 촬영용 가상 위치를 안내합니다.</div></div>';
  } else if (mode === 'guide') {
    const step = Math.min(3, Math.floor(progress * 4));
    layer = '<div class="top"><div class="ar">' + (step === 3 ? '↗' : '↑') + '</div><div class="grow">' +
      '<div class="dist">' + Math.max(0, Math.round((1 - progress) * CFG.km * 1000)) + 'm</div>' +
      '<div class="txt">' + STEPS[step] + '</div></div></div>' +
      '<div class="bot"><div><div class="eta">' + Math.max(0, Math.ceil((1 - progress) * CFG.min)) + '분　·　' + Math.max(0, (1 - progress) * CFG.km).toFixed(1) + 'km</div>' +
      '<div class="dd">' + PV.esc(dest) + '</div></div><button class="end" data-end="1">종료</button></div>';
  } else if (mode === 'arrived') {
    layer = '<div class="arrived"><b>목적지에 도착했습니다</b><span>' + PV.esc(dest) + '</span></div>';
  } else {
    layer = '<div class="setp"><div class="hd"><div class="bk tap" data-home="1">‹</div><h3>촬영용 길안내 설정</h3></div>' +
      '<div class="help">목적지를 찾기 전에 경로 화면의 거리·예상 시간·자동 이동 속도를 정합니다.</div>' +
      '<div class="lb">표시할 전체 거리 (km)</div><div class="fd">3.8</div>' +
      '<div class="lb">표시할 전체 시간 (분)</div><div class="fd">16</div>' +
      '<div class="lb">자동 길안내 재생 시간 (초)</div><div class="fd">45</div>' +
      '<div class="lb">도착 안내 후 초기화면 복귀 (초)</div><div class="fd">4</div>' +
      '<button class="start" data-home="1">설정 저장</button></div>';
  }
  app.innerHTML = '<div class="map">' + mapSvg(mode === 'guide') + '</div><div class="layer">' + layer + '</div>';
  const input = app.querySelector('#dest');
  if (input) input.addEventListener('input', () => { dest = input.value; });
  const start = app.querySelector('[data-start]');
  if (start) start.addEventListener('click', () => { if (input) dest = input.value.trim() || dest; go(); });
  app.querySelectorAll('[data-home]').forEach(n => n.addEventListener('click', () => { mode = 'home'; paint(); }));
  const set = app.querySelector('[data-set]');
  if (set) set.addEventListener('click', () => { mode = 'settings'; paint(); });
  const end = app.querySelector('[data-end]');
  if (end) end.addEventListener('click', () => { stop(); mode = 'arrived'; paint(); });
}
function stop() { if (timer) { clearInterval(timer); timer = null; } }
function go() {
  stop(); mode = 'guide'; progress = 0; paint();
  if (document.body.classList.contains('shot')) return;
  timer = setInterval(() => {
    progress = Math.min(1, progress + 1 / 30);
    if (progress >= 1) { stop(); mode = 'arrived'; }
    paint();
  }, 500);
}

PV.boot({
  scenes: [
    { id: 'home', label: '목적지 검색', cap: '가상의 목적지를 직접 입력해 두고 촬영합니다. 출발지도 원하는 이름으로 바꿀 수 있습니다.' },
    { id: 'guide', label: '길안내 진행', cap: '남은 거리·시간이 실제로 줄어들고, 음성 안내가 단계마다 나옵니다. 재생 시간은 설정에서 정한 초 단위로 맞춰집니다.' },
    { id: 'arrived', label: '도착 안내', cap: '도착 안내 후 설정한 시간이 지나면 자동으로 첫 화면으로 돌아갑니다.' },
    { id: 'settings', label: '촬영용 설정', cap: '표시 거리·시간과 자동 재생 속도를 장면 길이에 맞춰 조절합니다.' }
  ],
  render: scene => {
    stop();
    if (scene.id === 'home') { mode = 'home'; progress = 0; }
    else if (scene.id === 'guide') { mode = 'guide'; progress = 0.45; }
    else if (scene.id === 'arrived') { mode = 'arrived'; progress = 1; }
    else { mode = 'settings'; }
    paint();
  }
});
</script>
</body>
</html>
