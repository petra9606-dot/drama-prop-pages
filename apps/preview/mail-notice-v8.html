<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>공문 정렬형 통지서 · 편지함 v8</title>
<style>*{box-sizing:border-box}body{margin:0;background:#18232d;color:#edf3f6;font-family:'Segoe UI','Malgun Gothic',sans-serif}.page-head{max-width:960px;margin:auto;padding:24px 20px}a{color:#92d6c7}.page-head h1{font-size:24px}.page-head p{color:#bdc9d2;line-height:1.8}.cards{display:flex;gap:24px;justify-content:center;align-items:flex-start;padding:0 16px 48px;flex-wrap:wrap}.card{width:min(390px,100%);border-radius:18px;background:#fff;color:#34414c;padding:24px}.card h2{font-size:22px;font-weight:400;line-height:1.5;margin:0 0 20px;word-break:keep-all;text-wrap:balance}.address{font-size:12px;color:#7d8791;overflow-wrap:anywhere}.body{white-space:pre-wrap;line-height:1.8;font-size:16px;word-break:keep-all;overflow-wrap:break-word}.attachment{border:1px solid #dce3e8;background:#f0f3f5;border-radius:12px;width:100%;padding:14px;cursor:pointer;margin-top:20px}.attachment svg{width:100%;height:230px}.attachment span{display:block;color:#455868;font-size:13px;text-align:left;padding:12px 0}.viewer{position:fixed;inset:0;background:#26313c;z-index:2;overflow-y:auto}.viewer[hidden]{display:none}.viewerbar{position:sticky;top:0;background:#26313c;display:flex;align-items:center;gap:14px;padding:18px;color:#fff;font-size:13px;z-index:3}.close{background:none;color:#fff;border:0;font-size:30px;cursor:pointer}.paper{width:min(410px,100%);margin:0 auto;padding:12px 10px 20px}</style><style id="formal-style"></style><!-- DW-SITE --><meta name="robots" content="noindex,nofollow,noarchive"><script>if("serviceWorker"in navigator)addEventListener("load",function(){navigator.serviceWorker.register("/sw.js").catch(function(){})});</script><!-- DW-GA --><script>(function(){try{if(localStorage.getItem('dw-noga'))return;}catch(e){}window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}window.gtag=gtag;gtag('js',new Date());gtag('config','G-ZMQZ7X9F3J');var s=document.createElement('script');s.async=true;s.src='https://www.googletagmanager.com/gtag/js?id= <body><header class="page-head"><a href="../mail-remote.html">← 메일 앱 다운로드</a><h1>헤븐코인 거래지원 심사 결과 안내</h1><p>공문 정렬형 · 수신: 파라오 · 발신: 비트원 거래지원심사위원회<br>메일과 첨부 미리보기는 이전처럼 짧게 보입니다. 첨부를 누르면 확정한 공문 정렬형으로 전체 원고가 열립니다. 화면 폭에 맞춰 자연스럽게 줄바꿈됩니다.</p><a href="mail.html?v=8#baek-attachment">실제 앱 형태의 웹 미리보기</a></header><main class="cards" id="cards"></main><div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="공문 정렬형 통지서 크게 보기"><div class="viewerbar"><button class="close" id="close" aria-label="첨부 닫기">×</button><span>헤븐코인_거래지원심사결과.svg</span></div><div class="paper" id="paper"></div></div>
<script src="scene-mail-data.js?v=8"></script><script>
const D=window.SceneMailData,esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.getElementById('formal-style').textContent=D.FORMAL_NOTICE_CSS;
const config=D.defaultSceneConfig(),cards=document.getElementById('cards'),viewer=document.getElementById('viewer');let opener;
for(const person of ['song','baek']){const item=D.receivedMail({...config,person,format:'image'}),card=document.createElement('article');card.className='card';card.innerHTML=`<h2>${esc(item.subject)}</h2><div class="address">${esc(item.from)} &lt;${esc(item.fromEmail)}&gt;<br>받는 사람: ${esc(item.to)} &lt;${esc(item.toEmail)}&gt;</div><p class="body">${esc(item.body)}</p><button class="attachment" aria-label="${D.PEOPLE[person].name} 통지서 크게 보기">${D.noticeSvg(item)}<span>▧ ${esc(item.attachmentName)}<br>눌러서 크게 보기</span></button>`;card.querySelector('button').onclick=event=>{opener=event.currentTarget;document.getElementById('paper').innerHTML=D.formalNoticeMarkup(item);viewer.hidden=false;viewer.scrollTop=0;document.getElementById('close').focus();};cards.append(card);}
function closeViewer(){viewer.hidden=true;opener?.focus();}document.getElementById('close').onclick=closeViewer;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeViewer();});
</script></body></html>
