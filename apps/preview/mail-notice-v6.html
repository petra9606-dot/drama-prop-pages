<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>해븐코인 통지서 · 편지함 v6</title>
<style>*{box-sizing:border-box}body{margin:0;background:#18232d;color:#edf3f6;font-family:'Segoe UI','Malgun Gothic',sans-serif}header{max-width:960px;margin:auto;padding:24px 20px}a{color:#92d6c7}h1{font-size:24px}header p{color:#bdc9d2;line-height:1.8}.cards{display:flex;gap:24px;justify-content:center;align-items:flex-start;padding:0 16px 48px;flex-wrap:wrap}.card{width:min(390px,100%);border-radius:18px;background:#fff;color:#34414c;padding:24px}.card h2{font-size:22px;line-height:1.5;margin:0 0 20px}.address{font-size:12px;color:#7d8791;overflow-wrap:anywhere}.body{white-space:pre-wrap;line-height:1.8;font-size:16px}.attachment{border:1px solid #dce3e8;background:#f0f3f5;border-radius:12px;width:100%;padding:14px;cursor:pointer;margin-top:20px}.attachment svg{width:100%;height:230px}.attachment span{display:block;color:#455868;font-size:13px;text-align:left;padding:12px 0}.viewer{position:fixed;inset:0;background:#26313c;z-index:2;overflow-y:auto}.viewer[hidden]{display:none}.viewerbar{position:sticky;top:0;background:#26313c;display:flex;align-items:center;gap:14px;padding:18px;color:#fff;font-size:13px}.close{background:none;color:#fff;border:0;font-size:30px;cursor:pointer}.paper{width:min(590px,100%);margin:0 auto;padding:8px}.paper svg{display:block;width:100%;height:auto}</style><!-- DW-SITE --><meta name="robots" content="noindex,nofollow,noarchive"><script>if("serviceWorker"in navigator)addEventListener("load",function(){navigator.serviceWorker.register("/sw.js").catch(function(){})});</script><!-- DW-GA --><script>(function(){try{if(localStorage.getItem('dw-noga'))return;}catch(e){}window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}window.gtag=gtag;gtag('js',new Date());gtag('config','G-ZMQZ7X9F3J');var s=document.createElement('script');s.async=true;s.src='https://www.googletagmanager.com/gtag/js?id=G-ZMQZ7X9F3J';(document.head||document.documentElement).appendChild(s);})();</script>

<body><header><a href="../mail-remote.html">← 메일 앱 다운로드</a><h1>해븐코인 거래지원 심사 결과 안내</h1><p>수신: 파라오 · 발신: 비트원 거래지원심사위원회<br>아래 첨부 이미지를 누르면 큰 글씨로 열립니다. 기존 줄간격 비율을 유지하며 긴 원고 전체를 세로로 스크롤할 수 있습니다.</p><a href="mail.html?v=6#song-detail">실제 앱 형태의 웹 미리보기</a></header><main class="cards" id="cards"></main><div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="첨부 통지서 크게 보기"><div class="viewerbar"><button class="close" id="close" aria-label="첨부 닫기">×</button><span>해븐코인_거래지원심사결과.svg</span></div><div class="paper" id="paper"></div></div>
<script src="scene-mail-data.js?v=6"></script><script>
const D=window.SceneMailData,esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const config=D.defaultSceneConfig(),cards=document.getElementById('cards'),viewer=document.getElementById('viewer');
for(const person of ['song','baek']){const item=D.receivedMail({...config,person,format:'image'}),card=document.createElement('article');card.className='card';card.innerHTML=`<h2>${esc(item.subject)}</h2><div class="address">${esc(item.from)} &lt;${esc(item.fromEmail)}&gt;<br>받는 사람: ${esc(item.to)} &lt;${esc(item.toEmail)}&gt;</div><p class="body">${esc(item.body)}</p><button class="attachment" aria-label="${D.PEOPLE[person].name} 통지서 크게 보기">${D.noticeSvg(item)}<span>▧ ${esc(item.attachmentName)}<br>눌러서 크게 보기</span></button>`;card.querySelector('button').onclick=()=>{document.getElementById('paper').innerHTML=D.noticeSvg(item,true);viewer.hidden=false;viewer.scrollTop=0;document.getElementById('close').focus();};cards.append(card);}
document.getElementById('close').onclick=()=>viewer.hidden=true;document.addEventListener('keydown',e=>{if(e.key==='Escape')viewer.hidden=true;});
</script></body></html>
