<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3부 | 피라밋</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 15% 0,rgba(72,96,180,.13),transparent 30%),#0b0f19;color:#eef2ff;font-family:'Segoe UI','Malgun Gothic',sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:48px 28px 70px}
.back{display:inline-block;margin-bottom:26px;color:#8fa8ff;text-decoration:none;font-size:13px}
.header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:28px}
h1{margin:0;font-size:38px;letter-spacing:-.03em}.sub{color:#7e8ba3;font-size:12px;margin-top:8px;letter-spacing:.08em}.count{font-size:12px;color:#71809a}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:15px}
.card{display:block;text-decoration:none;color:#fff;background:#111827;border:1px solid #263244;border-radius:16px;padding:20px;min-height:145px;transition:.16s;position:relative}
.card:hover{border-color:#5b7de7;transform:translateY(-2px);background:#151e30}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.scene{display:inline-block;font-size:11px;font-weight:900;color:#bac7ff;background:#1d2945;border:1px solid #314673;border-radius:999px;padding:5px 8px}
.source{font-size:9px;letter-spacing:.12em;color:#5e6c84}.title{font-size:21px;font-weight:850;letter-spacing:-.02em;margin-top:16px;line-height:1.28}.filename{font-size:11px;color:#71809a;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.open{position:absolute;right:18px;bottom:17px;font-size:16px;color:#809cff}
.empty{grid-column:1/-1;color:#64748b;padding:25px;border:1px dashed #334155;border-radius:14px;text-align:center}
@media(max-width:580px){.wrap{padding:30px 16px 50px}.header{align-items:flex-start;flex-direction:column}h1{font-size:32px}}

.filter{margin:0 0 20px}.filter input{width:100%;background:#0d121b;border:1px solid #28344b;border-radius:12px;color:#fff;padding:12px 13px;outline:none}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 26px}
.chip{border:1px solid #2a3650;background:#0f1522;color:#c9d4ee;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.chip i{font-style:normal;font-size:11px;color:#7d8aa5;font-weight:600}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c,#6b7fd6)}
.chip.on{background:#1b2540;border-color:#5b7de7;color:#fff}
.group{margin:0 0 34px}
.group .grid{grid-template-columns:repeat(auto-fill,minmax(235px,1fr))}
.ghead{display:flex;align-items:center;gap:12px;margin:0 0 14px;position:sticky;top:0;z-index:2;padding:10px 0;background:linear-gradient(#0b0f19 75%,rgba(11,15,25,0))}
.gscene{font-size:20px;font-weight:900;color:#fff;display:flex;align-items:center;gap:10px;letter-spacing:-.02em}
.gscene::before{content:"";width:6px;height:24px;border-radius:3px;background:var(--c)}
.gcount{font-size:12px;color:#7d8aa5}
.gline{flex:1;height:1px;background:linear-gradient(90deg,var(--c),transparent);opacity:.45}
.group .card{border-left:4px solid var(--c);min-height:118px;padding:18px 20px}
.group .card:hover{border-color:var(--c);border-left-width:4px}
.group .scene{color:var(--c);background:transparent;border-color:var(--c)}
.group .title{font-size:19px;margin-top:12px}
</style>

</head>
<body><main class="wrap">
<a class="back" href="../index.html">← 피라밋</a>
<div class="header"><div><h1>3부</h1><div class="sub">SCENE MATERIALS</div></div><div style="display:flex;align-items:center;gap:14px"><span id="dwuBtn"></span><div class="count" id="count">자료 불러오는 중...</div></div></div>
<div id="dwuStrip"></div><div class="filter"><input id="localSearch" placeholder="이 부에서 씬 / 제목 검색"></div><div class="chips" id="chips"></div><div id="grid"></div>
</main>
<script src="/static-items.js"></script>
<script src="/updates.js"></script>
<script>
const PART="3부";
DW_UPDATES.mountButton(document.getElementById("dwuBtn"));
DW_UPDATES.mountStrip(document.getElementById("dwuStrip"),{limit:3,filter:x=>x.part===PART});
document.addEventListener("click",e=>{const c=e.target.closest("#grid .card");if(!c)return;const x=(window.__cards||[])[+c.dataset.i];if(x){DW_UPDATES.markSeen(x);const b=c.querySelector(".dwu-badge");if(b)b.remove();}});
let staticItems=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const PALETTE=["#5b8cff","#f2a93b","#3fc68a","#e8618c","#a77bff","#37c4d6","#e2d04a","#ff7b52","#7fa3c9","#c58cff"];
const sceneNo=s=>{const m=String(s||'').match(/\d+/);return m?+m[0]:9999;};
let curScene="all";
function render(uploaded=[]){
  const all=[...staticItems.map(x=>({...x,pinned:false})),...uploaded.map(x=>({...x,scene:x.scene,title:x.title||x.filename,filename:x.filename,url:x.url,source:"웹 업로드",pinned:!!x.pinned}))]
    .sort((a,b)=>(sceneNo(a.scene)-sceneNo(b.scene))||(Number(!!b.pinned)-Number(!!a.pinned))||String(a.title).localeCompare(String(b.title),'ko',{numeric:true}));
  window.__cards=all;
  document.getElementById('count').textContent=all.length?`${all.length}개 자료`:'등록된 자료 없음';
  const box=document.getElementById('grid'), chips=document.getElementById('chips');
  if(!all.length){box.innerHTML='<div class="grid"><div class="empty">아직 등록된 씬 자료가 없습니다.</div></div>';chips.innerHTML='';return;}
  const groups=[];const idx={};
  all.forEach((x,i)=>{const k=sceneNo(x.scene)===9999?'기타':`${sceneNo(x.scene)}씬`;if(!(k in idx)){idx[k]=groups.length;groups.push({k,items:[]});}groups[idx[k]].items.push([x,i]);});
  groups.forEach((g,gi)=>g.c=g.k==='기타'?'#7fa3c9':PALETTE[gi%PALETTE.length]);
  if(curScene!=="all"&&!(curScene in idx))curScene="all";
  chips.innerHTML=`<button class="chip ${curScene==='all'?'on':''}" data-s="all">전체 <i>${all.length}</i></button>`+groups.map(g=>`<button class="chip ${curScene===g.k?'on':''}" data-s="${esc(g.k)}" style="--c:${g.c}"><span class="dot"></span>${esc(g.k)} <i>${g.items.length}</i></button>`).join('');
  box.innerHTML=groups.map(g=>`<section class="group" data-g="${esc(g.k)}" style="--c:${g.c}">
    <div class="ghead"><div class="gscene">${esc(g.k)}</div><span class="gcount">${g.items.length}개</span><div class="gline"></div></div>
    <div class="grid">${g.items.map(([x,i])=>`<a class="card" data-i="${i}" href="${x.url}" ${x.source==="웹 업로드"?'target="_blank"':''}>
      <div class="topline"><span class="scene">${esc(x.scene)}${x.pinned?" ★":""}</span><span class="source">${esc(x.source)}</span></div>
      <div class="title">${esc(x.title)}${DW_UPDATES.badgeHTML(x)}</div>${x.changeNote&&DW_UPDATES.badge(x)?`<div class="filename" style="color:#c9b27a">${esc(x.changeNote)}</div>`:''}
      <div class="filename">${esc(x.filename||'')}</div><div class="open">↗</div>
    </a>`).join('')}</div></section>`).join('');
  applyFilter();
}
function applyFilter(){
  const q=(document.getElementById('localSearch').value||'').toLowerCase();
  document.querySelectorAll('#grid .group').forEach(g=>{
    let n=0;const sceneOk=curScene==='all'||g.dataset.g===curScene;
    g.querySelectorAll('.card').forEach(c=>{const ok=sceneOk&&c.innerText.toLowerCase().includes(q);c.style.display=ok?'block':'none';if(ok)n++;});
    g.style.display=n?'':'none';
  });
  document.querySelectorAll('#chips .chip').forEach(c=>c.classList.toggle('on',c.dataset.s===curScene));
}
document.getElementById('chips').addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return;curScene=c.dataset.s;applyFilter();});
let uploadedItems=[];
render([]);
DW_STATIC.then(({scenes})=>{staticItems=scenes.filter(x=>x.part==='3부').map(x=>({...x,source:'기존'}));render(uploadedItems);});
fetch('/.netlify/functions/catalog?project=pyramid&part=3부').then(r=>r.json()).then(({items=[]})=>{uploadedItems=items;render(items);}).catch(()=>render(uploadedItems));
document.getElementById('localSearch').addEventListener('input',applyFilter);
</script></body></html>
