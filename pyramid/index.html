<body><main class="wrap"><a class="back" href="../index.html">← DisolveWorks</a><h1>피라밋</h1><div class="sub">PROJECT · 1부 ~ 12부</div><div class="grid"><a class="card" data-part="1부" href="part1/index.html"><div class="title">1부</div><div class="meta">46씬</div></a><a class="card" data-part="2부" href="part2/index.html"><div class="title">2부</div><div class="meta">등록된 씬 없음</div></a><a class="card" data-part="3부" href="part3/index.html"><div class="title">3부</div><div class="meta">등록된 씬 없음</div></a><a class="card" data-part="4부" href="part4/index.html"><div class="title">4부</div><div class="meta">23씬</div></a><a class="card" data-part="5부" href="part5/index.html"><div class="title">5부</div><div class="meta">등록된 씬 없음</div></a><a class="card" data-part="6부" href="part6/index.html"><div class="title">6부</div><div class="meta">등록된 씬 없음</div></a><a class="card" data-part="7부" href="part7/index.html"><div class="title">7부</div><div class="meta">등록된 씬 없음</div></a><a class="card" data-part="8부" href="part8/index.html"><div class="title">8부</div><div class="meta">등록된 씬 없음</div></a><a class="card" data-part="9부" href="part9/index.html"><div class="title">9부</div><div class="meta">등록된 씬 없음</div></a><a class="card" data-part="10부" href="part10/index.html"><div class="title">10부</div><div class="meta">등록된 씬 없음</div></a><a class="card" data-part="11부" href="part11/index.html"><div class="title">11부</div><div class="meta">등록된 씬 없음</div></a><a class="card" data-part="12부" href="part12/index.html"><div class="title">12부</div><div class="meta">등록된 씬 없음</div></a></div></main>
<script>
fetch('/.netlify/functions/catalog?project=pyramid').then(r=>r.json()).then(({items=[]})=>{
  const counts={}; items.forEach(x=>counts[x.part]=(counts[x.part]||0)+1);
  document.querySelectorAll('[data-part]').forEach(card=>{
    const n=counts[card.dataset.part]||0; if(!n)return;
    const meta=card.querySelector('.meta'); meta.textContent=(meta.textContent.includes('등록된 씬 없음')?'':meta.textContent+' · ')+`웹 업로드 ${n}개`;
  });
}).catch(()=>{});
</script></body></html>
