<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>zeom-node — live-stream.log</title>
<style>
    :root {
      --background: #070b10;
      --panel: #0a1118;
      --border: rgba(123, 158, 178, 0.17);

      --text-main: #b3c0ca;
      --text-sub: #71828f;
      --text-dim: #485965;

      --cyan: #3db7c7;
      --blue: #5d9fd5;
      --green: #5dcc87;
      --purple: #a18bd5;
      --yellow: #d7aa52;
      --red: #e26873;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--background);
    }

    body {
      font-family:
        "JetBrains Mono",
        "Consolas",
        "SFMono-Regular",
        "Courier New",
        monospace;
      color: var(--text-main);
    }

    .terminal {
      position: relative;
      display: grid;
      grid-template-rows: 34px 56px minmax(0, 1fr) 25px;
      width: 100%;
      height: 100%;
      overflow: hidden;

      background:
        radial-gradient(
          circle at 82% 4%,
          rgba(28, 114, 137, 0.12),
          transparent 34%
        ),
        linear-gradient(
          180deg,
          #0a1017 0%,
          #070b10 100%
        );
    }

    .terminal::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 20;
      pointer-events: none;
      opacity: 0.022;

      background: repeating-linear-gradient(
        to bottom,
        transparent 0,
        transparent 3px,
        rgba(255, 255, 255, 0.14) 4px
      );
    }

    /* 상단 창 영역 */

    .title-bar {
      position: relative;
      z-index: 2;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 15px;
      border-bottom: 1px solid var(--border);
      background: rgba(7, 12, 18, 0.9);
    }

    .title-left {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .window-buttons {
      display: flex;
      gap: 6px;
    }

    .window-button {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .window-button:nth-child(1) {
      background: #945b61;
    }

    .window-button:nth-child(2) {
      background: #a68b4d;
    }

    .window-button:nth-child(3) {
      background: #4e9e70;
    }

    .terminal-path {
      color: #738793;
      font-size: 9px;
      letter-spacing: 0.07em;
    }

    .online-status {
      display: flex;
      align-items: center;
      gap: 7px;

      color: #738591;
      font-size: 9px;
      letter-spacing: 0.08em;
    }

    .online-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px rgba(93, 204, 135, 0.6);
      animation: pulse 2.2s infinite;
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.4;
      }
    }

    /* 시스템 지표 */

    .summary-bar {
      position: relative;
      z-index: 2;

      display: grid;
      grid-template-columns:
        minmax(135px, 1.25fr)
        repeat(4, minmax(100px, 1fr));

      background: rgba(10, 17, 24, 0.84);
      border-bottom: 1px solid var(--border);
    }

    .summary-item {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;

      min-width: 0;
      padding: 0 14px;
      border-right: 1px solid rgba(123, 158, 178, 0.1);
    }

    .summary-item:last-child {
      border-right: 0;
    }

    .summary-label {
      color: #526572;
      font-size: 8px;
      letter-spacing: 0.1em;
      white-space: nowrap;
    }

    .summary-row {
      display: flex;
      align-items: baseline;
      gap: 7px;
    }

    .summary-value {
      color: #b9c6cf;
      font-size: 14px;
      font-weight: 600;
    }

    .summary-unit {
      color: #596a76;
      font-size: 8px;
    }

    .healthy {
      color: var(--green);
    }

    .mini-bar {
      width: 100%;
      max-width: 115px;
      height: 2px;
      overflow: hidden;
      background: #17222b;
    }

    .mini-fill {
      width: 50%;
      height: 100%;
      background: var(--cyan);
      transition: width 0.6s ease;
    }

    .mini-fill.blue {
      background: var(--blue);
    }

    /* 로그 화면 */

    .log-window {
      position: relative;
      z-index: 2;

      min-width: 0;
      min-height: 0;
      overflow: hidden;
      padding: 7px 12px 5px;

      background: rgba(5, 9, 14, 0.34);
    }

    .log-header,
    .log-line {
      display: grid;

      /*
        시간과 레벨을 제외한 나머지 공간을
        메시지가 전부 사용하도록 설정
      */
      grid-template-columns: 112px 66px minmax(0, 1fr);
      column-gap: 10px;
    }

    .log-header {
      height: 20px;
      padding: 0 5px;

      color: #445662;
      font-size: 8px;
      line-height: 20px;
      letter-spacing: 0.08em;

      border-bottom: 1px solid rgba(123, 158, 178, 0.09);
    }

    #logs {
      width: 100%;
      height: calc(100% - 20px);
      overflow: hidden;
    }

    .log-line {
      align-items: start;
      width: 100%;
      min-height: 17px;
      padding: 0 5px;

      font-size: clamp(9px, 0.69vw, 12px);
      line-height: 17px;

      opacity: 0;
      transform: translateY(2px);
      animation: appear 0.18s ease-out forwards;
    }

    @keyframes appear {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .time {
      width: 112px;
      color: #5b7180;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .label {
      width: 66px;
      font-weight: 600;
      white-space: nowrap;
    }

    /*
      오른쪽 메시지를 잘라내지 않고
      화면 끝까지 표시
    */

    .message {
      min-width: 0;
      overflow: visible;
      color: #aebac3;
      white-space: nowrap;
    }

    .info .label {
      color: #67aabd;
    }

    .api .label,
    .network .label {
      color: var(--cyan);
    }

    .database .label,
    .cache .label {
      color: var(--green);
    }

    .auth .label {
      color: var(--purple);
    }

    .build .label,
    .trace .label {
      color: var(--blue);
    }

    .success .label {
      color: #67d38f;
    }

    .success .message {
      color: #9dcdb0;
    }

    .warn .label {
      color: var(--yellow);
    }

    .warn .message {
      color: #c7b184;
    }

    .error .label {
      color: var(--red);
    }

    .error .message {
      color: #dd8991;
    }

    .key {
      color: #54becd;
    }

    .value {
      color: #80ce9c;
    }

    .number {
      color: #dfa66c;
    }

    .path {
      color: #72aee0;
    }

    .method {
      color: #a895df;
    }

    .muted {
      color: #657984;
    }

    /* 하단 상태 영역 */

    .footer {
      position: relative;
      z-index: 2;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 14px;
      border-top: 1px solid var(--border);
      background: rgba(7, 12, 18, 0.94);

      color: #566976;
      font-size: 8px;
      letter-spacing: 0.05em;
    }

    .footer-group {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .footer-highlight {
      color: #55a4b0;
    }

    @media (max-width: 800px) {
      .summary-bar {
        grid-template-columns: repeat(4, 1fr);
      }

      .summary-item:first-child {
        display: none;
      }

      .log-header,
      .log-line {
        grid-template-columns: 102px 60px minmax(0, 1fr);
        column-gap: 8px;
      }

      .time {
        width: 102px;
      }

      .label {
        width: 60px;
      }
    }
  
.log-header,.log-line{grid-template-columns:112px 92px minmax(0,1fr)}
.label{width:92px}
</style>

<body>
  <main class="terminal">
    <header class="title-bar">
      <div class="title-left">
        <div class="window-buttons"><span class="window-button"></span><span class="window-button"></span><span class="window-button"></span></div>
        <div class="terminal-path" id="path"></div>
      </div>
      <div class="online-status"><span class="online-dot" id="onDot"></span><span id="onText">CONNECTED</span></div>
    </header>

    <section class="summary-bar">
      <div class="summary-item">
        <div class="summary-label">NETWORK STATUS</div>
        <div class="summary-row"><span class="summary-value healthy" id="netStatus">-</span><span class="summary-unit" id="netUnit">-</span></div>
      </div>
      <div class="summary-item">
        <div class="summary-label">BLOCK HEIGHT</div>
        <div class="summary-row"><span class="summary-value" id="heightValue">-</span><span class="summary-unit" id="blockTime">-</span></div>
      </div>
      <div class="summary-item">
        <div class="summary-label">TPS</div>
        <div class="summary-row"><span class="summary-value" id="tpsValue">0</span><span class="summary-unit">TX/S</span></div>
        <div class="mini-bar"><div class="mini-fill" id="tpsBar" style="width:0%"></div></div>
      </div>
      <div class="summary-item">
        <div class="summary-label">PEERS</div>
        <div class="summary-row"><span class="summary-value" id="peerValue">0</span><span class="summary-unit" id="peerUnit">CONNECTED</span></div>
      </div>
      <div class="summary-item">
        <div class="summary-label">CPU LOAD</div>
        <div class="summary-row"><span class="summary-value" id="cpuValue">0</span><span class="summary-unit">%</span></div>
        <div class="mini-bar"><div class="mini-fill blue" id="cpuBar" style="width:0%"></div></div>
      </div>
    </section>

    <section class="log-window">
      <div class="log-header"><span>TIMESTAMP</span><span>MODULE</span><span>EVENT / CONTEXT / METADATA</span></div>
      <div id="logs"></div>
    </section>

    <footer class="footer">
      <div class="footer-group"><span class="footer-highlight" id="fNode">-</span><span id="fNet">-</span><span id="fVer">-</span></div>
      <div class="footer-group"><span>stream active</span><span>UTF-8</span><span>LF</span></div>
    </footer>
  </main>

<script>
// stage: 1 = 초반 작업, 2 = 중반 작업, 3 = 마무리 (Enter 로 완료)
const ZEOM_STAGE = (() => {
  const q = new URLSearchParams(location.search).get("stage");
  const h = (location.hash || "").replace("#", "");
  const v = parseInt(q || h || "1", 10);
  return [1, 2, 3].includes(v) ? v : 1;
})();
document.addEventListener("keydown", (e) => {
  const d = e.code && e.code.startsWith("Digit") ? e.code.slice(5) : e.key;
  if (e.altKey && ["1", "2", "3"].includes(d)) {
    e.preventDefault();
    e.stopImmediatePropagation();
    location.hash = "#" + d;
    location.reload();
  }
}, true);

// 완료 연출 (Enter "탁!" 이후)
function zeomCelebrate(opts) {
  if (document.getElementById("zeomDone")) return;
  const o = Object.assign({ delay: 0 }, opts || {});
  const css = `
#zeomFlash{position:fixed;inset:0;z-index:9998;pointer-events:none;background:radial-gradient(circle at 50% 50%,rgba(94,234,212,.55),rgba(16,185,129,.18) 40%,transparent 70%);opacity:0;animation:zfFlash 1.1s ease-out forwards}
@keyframes zfFlash{0%{opacity:0}12%{opacity:1}100%{opacity:0}}
#zeomDone{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;pointer-events:none;font-family:Inter,Pretendard,"Segoe UI",system-ui,sans-serif}
#zeomDone .zd-dim{position:absolute;inset:0;background:radial-gradient(circle at 50% 46%,rgba(4,10,14,.35),rgba(2,6,10,.78) 70%);opacity:0;animation:zdIn .7s .15s ease-out forwards}
#zeomDone canvas{position:absolute;inset:0;width:100%;height:100%}
#zeomDone .zd-card{position:relative;width:min(560px,86vw);padding:34px 38px 28px;border-radius:20px;text-align:center;color:#e8fff9;
  background:linear-gradient(160deg,rgba(18,38,40,.94),rgba(8,18,22,.96));border:1px solid rgba(94,234,212,.45);
  box-shadow:0 0 0 1px rgba(255,255,255,.04) inset,0 30px 90px rgba(0,0,0,.6),0 0 80px rgba(45,212,191,.28);
  opacity:0;transform:translateY(18px) scale(.94);animation:zdCard .75s .35s cubic-bezier(.2,.9,.25,1.15) forwards}
@keyframes zdIn{to{opacity:1}}
@keyframes zdCard{to{opacity:1;transform:none}}
#zeomDone .zd-ring{position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid rgba(94,234,212,.7);opacity:0;animation:zdRing 1.6s .2s ease-out forwards}
#zeomDone .zd-ring.r2{animation-delay:.5s}
@keyframes zdRing{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(7)}}
#zeomDone .zd-coin{width:104px;height:104px;margin:-86px auto 14px;perspective:600px}
#zeomDone .zd-coin i{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;font-style:normal;font-weight:900;font-size:52px;color:#04201c;letter-spacing:-2px;
  background:radial-gradient(circle at 32% 28%,#fff6c9,#f5c84b 38%,#c98a12 70%,#8a5a06);
  box-shadow:0 0 0 5px #0d1a1c,0 0 0 7px rgba(245,200,75,.85),0 0 40px rgba(245,200,75,.55),inset 0 -6px 14px rgba(0,0,0,.25);
  animation:zdSpin 1.4s .35s cubic-bezier(.3,.7,.3,1) both}
@keyframes zdSpin{0%{transform:rotateY(-540deg) scale(.3);opacity:0}70%{opacity:1}100%{transform:rotateY(0) scale(1)}}
#zeomDone .zd-tag{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;background:rgba(16,185,129,.16);border:1px solid rgba(52,211,153,.45);color:#6ee7b7;font-size:11px;font-weight:700;letter-spacing:.14em}
#zeomDone .zd-tag b{width:7px;height:7px;border-radius:50%;background:#34d399;box-shadow:0 0 10px #34d399;animation:zdPulse 1.2s infinite}
@keyframes zdPulse{50%{opacity:.35}}
#zeomDone h1{margin:14px 0 6px;font-size:34px;line-height:1.1;font-weight:800;letter-spacing:-.01em;color:#fff;text-shadow:0 0 24px rgba(94,234,212,.35)}
#zeomDone h1 span{color:#5eead4}
#zeomDone .zd-sub{color:#9fbfba;font-size:13px}
#zeomDone .zd-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:22px 0 16px}
#zeomDone .zd-grid div{padding:10px 6px;border-radius:10px;background:rgba(255,255,255,.035);border:1px solid rgba(94,234,212,.14)}
#zeomDone .zd-grid small{display:block;font-size:9px;letter-spacing:.12em;color:#6f8f8a;margin-bottom:5px}
#zeomDone .zd-grid strong{font:700 16px/1 "JetBrains Mono",Consolas,monospace;color:#e6fffa}
#zeomDone .zd-check{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;font-size:11.5px;color:#a7d8cf}
#zeomDone .zd-check span{opacity:0;animation:zdIn .35s forwards}
#zeomDone .zd-check span::before{content:"✓ ";color:#34d399;font-weight:800}
#zeomDone .zd-foot{margin-top:16px;font:11px Consolas,monospace;color:#5f7f7a}
`;
  setTimeout(() => {
    const st = document.createElement("style");
    st.textContent = css;
    document.head.appendChild(st);
    const fl = document.createElement("div");
    fl.id = "zeomFlash";
    document.body.appendChild(fl);
    setTimeout(() => fl.remove(), 1300);

    const root = document.createElement("div");
    root.id = "zeomDone";
    const checks = ["ZeomToken", "Staking", "Vesting", "Bridge", "Explorer", "Wallet SDK"];
    root.innerHTML = `
      <div class="zd-dim"></div>
      <canvas></canvas>
      <div class="zd-ring"></div><div class="zd-ring r2"></div>
      <div class="zd-card">
        <div class="zd-coin"><i>Z</i></div>
        <div class="zd-tag"><b></b>MAINNET LIVE</div>
        <h1><span>ZEOM</span> Mainnet Launched</h1>
        <div class="zd-sub">제옴코인 v1.0.0 · Genesis block sealed · chain 7310</div>
        <div class="zd-grid">
          <div><small>BLOCK</small><strong id="zdBlock">#0</strong></div>
          <div><small>VALIDATORS</small><strong>7/7</strong></div>
          <div><small>TESTS</small><strong>138/138</strong></div>
          <div><small>SUPPLY</small><strong>10B</strong></div>
        </div>
        <div class="zd-check">${checks.map((c, i) => `<span style="animation-delay:${1 + i * 0.16}s">${c}</span>`).join("")}</div>
        <div class="zd-foot">0x5E0d1c94A7b3F2E8D61a90C4b7E2f3a8D9c04e01</div>
      </div>`;
    document.body.appendChild(root);

    let b = 0;
    setInterval(() => { b++; const el = document.getElementById("zdBlock"); if (el) el.textContent = "#" + b.toLocaleString(); }, 2000);

    // 금빛 파티클
    const cv = root.querySelector("canvas");
    const ctx = cv.getContext("2d");
    const dpr = window.devicePixelRatio || 1;
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    ctx.scale(dpr, dpr);
    const cx = innerWidth / 2, cy = innerHeight / 2 - 40;
    const parts = Array.from({ length: 140 }, () => {
      const a = Math.random() * Math.PI * 2, s = 3 + Math.random() * 9;
      return { x: cx, y: cy, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, r: 1.2 + Math.random() * 2.6, life: 1, c: Math.random() < .55 ? "245,200,75" : "94,234,212" };
    });
    const t0 = performance.now();
    (function frame(t) {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      let alive = false;
      parts.forEach((p) => {
        if (p.life <= 0) return;
        alive = true;
        p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.vx *= 0.985; p.life -= 0.009;
        ctx.beginPath();
        ctx.fillStyle = `rgba(${p.c},${Math.max(0, p.life)})`;
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      });
      if (alive && t - t0 < 4000) requestAnimationFrame(frame);
      else ctx.clearRect(0, 0, innerWidth, innerHeight);
    })(t0);
  }, o.delay);
}
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { const d = document.getElementById("zeomDone"); if (d) d.remove(); }
}, true);


const S = ZEOM_STAGE;
const $ = (id) => document.getElementById(id);
const rnd = (a, b) => Math.random() * (b - a) + a;
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const hex = (n) => Array.from({ length: n }, () => "0123456789abcdef"[ri(0, 15)]).join("");
const K = (k, v, cls = "value") => `<span class="key">${k}</span>=<span class="${cls}">${v}</span>`;
const N = (v) => `<span class="number">${v}</span>`;
const M = (v) => `<span class="muted">${v}</span>`;

const CFG = {
  1: { path: "devnet / zeom-devnet-node-0 / live-stream.log", node: "zeom-devnet-node-0", net: "devnet · chain 731001", ver: "zeom-node 0.3.0-dev", height: 41862, vals: 1, peers: 0, tps: [0, 4], bt: "3.0s" },
  2: { path: "testnet / zeom-validator-0 / live-stream.log", node: "zeom-validator-0", net: "testnet · chain 731002", ver: "zeom-node 0.7.2-rc", height: 1184904, vals: 4, peers: 3, tps: [24, 68], bt: "2.0s" },
  3: { path: "mainnet / zeom-validator-0 / live-stream.log", node: "zeom-validator-0", net: "mainnet · chain 7310", ver: "zeom-node 1.0.0", height: 0, vals: 7, peers: 6, tps: [3, 26], bt: "2.0s" }
}[S];
let height = CFG.height;
let launched = S !== 3;
$("path").textContent = CFG.path;
$("fNode").textContent = CFG.node;
$("fNet").textContent = CFG.net;
$("fVer").textContent = CFG.ver;

function setStatus() {
  if (S === 1) { $("netStatus").textContent = "DEVNET"; $("netUnit").textContent = "1 / 1 VALIDATOR"; }
  if (S === 2) { $("netStatus").textContent = "HEALTHY"; $("netUnit").textContent = "4 / 4 VALIDATORS"; }
  if (S === 3 && !launched) { $("netStatus").textContent = "GENESIS"; $("netStatus").style.color = "var(--yellow)"; $("netUnit").textContent = "6 / 7 SIGNED"; }
  if (S === 3 && launched) { $("netStatus").textContent = "LIVE"; $("netStatus").style.color = ""; $("netUnit").textContent = "7 / 7 VALIDATORS"; }
  $("heightValue").textContent = S === 3 && !launched ? "—" : "#" + height.toLocaleString();
  $("blockTime").textContent = S === 3 && !launched ? "PENDING" : CFG.bt + " AVG";
}

/* ───────── 로그 템플릿 ───────── */
const vName = () => `zeom-validator-${ri(0, CFG.vals - 1)}`;
const normal = [
  () => { height++; setStatus(); return ["build", "CONSENSUS", `Block proposed  ${K("height", height)}  ${K("round", 0, "number")}  ${K("proposer", S === 1 ? "zeom-devnet-node-0" : vName())}  ${K("txs", ri(CFG.tps[0], CFG.tps[1] * 2), "number")}`]; },
  () => ["success", "COMMIT", `Block finalized  ${K("height", height)}  hash=${M("0x" + hex(10) + "…" + hex(4))}  votes=${N(S === 1 ? "1/1" : S === 2 ? ri(3, 4) + "/4" : "7/7")}  elapsed=${N(ri(140, 420) + "ms")}`],
  () => ["info", "EVM", `Block executed  ${K("height", height)}  gas_used=${N(ri(90000, 12800000).toLocaleString())}  gas_limit=${N("30,000,000")}  state_root=${M("0x" + hex(8) + "…")}`],
  () => ["network", "P2P", S === 1 ? `Peer discovery  ${K("peers", 0, "number")}  mode=${M("single-validator")}  bootnodes=${N(0)}` : `Gossip round complete  ${K("peers", CFG.peers, "number")}  inbound=${N(ri(1, 3))}  outbound=${N(ri(1, 3))}  latency_avg=${N(ri(6, 38) + "ms")}`],
  () => ["api", "RPC", `<span class="method">${pick(["eth_call", "eth_getBalance", "eth_blockNumber", "eth_sendRawTransaction", "zeom_getValidators", "eth_getLogs"])}</span>  status=${N(200)}  duration=${N(ri(1, 48) + "ms")}  client=${M("10.42." + ri(0, 3) + "." + ri(10, 240))}`],
  () => ["cache", "MEMPOOL", `Txpool updated  pending=${N(ri(0, S === 1 ? 12 : 90))}  queued=${N(ri(0, 9))}  rejected=${N(0)}  base_fee=${N(ri(1, 9) + " gwei")}`],
  () => ["auth", "STAKING", `Epoch checkpoint  ${K("epoch", Math.floor(height / 1600))}  active_set=${N(CFG.vals)}  bonded=${N(S === 1 ? "0" : S === 2 ? "428.2M" : "1.92B")} ZEOM  apr=${N(S === 1 ? "—" : "8.4%")}`],
  () => ["trace", "PAYLOAD", `{ <span class="key">"hash"</span>: <span class="value">"0x${hex(12)}"</span>, <span class="key">"from"</span>: <span class="value">"0x${hex(4)}…${hex(4)}"</span>, <span class="key">"method"</span>: <span class="value">"${pick(["transfer", "stake", "approve", "claimReward", "delegate"])}"</span>, <span class="key">"value"</span>: <span class="number">${ri(1, 50000)}</span>, <span class="key">"status"</span>: <span class="number">1</span> }`]
];
const warns = {
  1: [
    ["warn", "WARN", `Indexer lagging behind head  ${K("head", height)}  indexed=${N(height - 2210)}  ${K("reason", "decode error", "value")}`],
    ["warn", "WARN", `No peers available — running in single-validator mode`],
    ["warn", "WARN", `Gas estimate fallback used  ${K("method", "permit")}  reason=${M("revert data empty")}`]
  ],
  2: [
    ["warn", "WARN", `Short reorg detected  depth=${N(1)}  at=${N(height - 1)}  re-indexing`],
    ["warn", "WARN", `Slashing evidence check skipped  reason=${M("evidence pool not wired")}`],
    ["warn", "WARN", `Bridge relayer unreachable  target=${M("zeom-bridge-relayer-0:9100")}  retry_in=${N("30s")}`]
  ],
  3: [["warn", "WARN", `Peer latency above baseline  peer=${M(vName())}  rtt=${N(ri(80, 140) + "ms")}`]]
};
const errors = {
  1: [
    ["error", "ERROR", `zeom-indexer panicked: decode receipt at block ${height - 3}: unexpected log topic length 5`],
    ["error", "ERROR", `Container zeom-indexer restarted (14)  backoff=${N("5m0s")}`]
  ],
  2: [
    ["error", "ERROR", `test_SlashValidator_Double: assertion failed: 4.82e21 != 4.80e21`]
  ]
};
const genesisLogs = [
  () => ["info", "INIT", `Genesis loaded  chain_id=${N(7310)}  sha256=${M("3d7e91c4…a9c1")}  alloc=${N("2.5B")} ZEOM`],
  () => ["network", "P2P", `Seed peers connected  ${K("peers", "6/6", "number")}  latency_avg=${N(ri(8, 18) + "ms")}`],
  () => ["auth", "GENESIS", `Waiting for validator signatures  signed=${N("6/7")}  missing=${M("zeom-validator-6")}`],
  () => ["info", "KEYSTORE", `Validator key loaded  pubkey=${M("0x" + hex(6) + "…" + hex(4))}`],
  () => ["cache", "MEMPOOL", `Txpool idle  pending=${N(0)}  (chain not started)`]
];

/* ───────── 렌더링 ───────── */
const logEl = $("logs");
function time(off = 0) {
  const d = new Date(Date.now() + off);
  return d.toTimeString().slice(0, 8) + "." + String(d.getMilliseconds()).padStart(3, "0");
}
function maxLines() { return Math.max(10, Math.floor(logEl.clientHeight / 17)); }
function add([type, label, msg], opt = {}) {
  const line = document.createElement("div");
  line.className = `log-line ${type}`;
  if (opt.still) { line.style.opacity = "1"; line.style.transform = "none"; line.style.animation = "none"; }
  line.innerHTML = `<span class="time">${time(opt.off || 0)}</span><span class="label">[${label}]</span><span class="message">${msg}</span>`;
  logEl.appendChild(line);
  while (logEl.children.length > maxLines()) logEl.removeChild(logEl.firstElementChild);
}
function nextLog() {
  if (S === 3 && !launched) return pick(genesisLogs)();
  const r = Math.random();
  if (errors[S] && r < 0.025) return pick(errors[S]);
  if (r < (S === 1 ? 0.12 : S === 2 ? 0.08 : 0.02)) return pick(warns[S]);
  return pick(normal)();
}
function fill() {
  logEl.innerHTML = "";
  const n = maxLines();
  for (let i = 0; i < n; i++) add(nextLog(), { still: true, off: -(n - i) * 720 });
}
let holding = false;
function loop() {
  if (!holding) add(nextLog());
  setTimeout(loop, rnd(650, 1150));
}
function metrics() {
  const tps = launched ? ri(CFG.tps[0], CFG.tps[1]) : 0;
  const cpu = rnd(S === 1 ? 6 : 18, S === 1 ? 14 : 39);
  $("tpsValue").textContent = tps;
  $("tpsBar").style.width = Math.min(95, tps * 1.3) + "%";
  $("cpuValue").textContent = cpu.toFixed(1);
  $("cpuBar").style.width = cpu + "%";
  $("peerValue").textContent = CFG.peers;
  $("peerUnit").textContent = S === 1 ? "SOLO MODE" : "CONNECTED";
}

/* ───────── 완료 ───────── */
function launch() {
  if (S !== 3 || launched || holding) return;
  holding = true;
  zeomCelebrate({ delay: 3400 });
  const seq = [
    ["auth", "GENESIS", `Signature received  validator=${M("zeom-validator-6")}  signed=${N("7/7")}`],
    ["success", "GENESIS", `Genesis sealed  chain_id=${N(7310)}  hash=${M("0x3d7e91c4…a9c1")}  validators=${N(7)}`],
    ["success", "COMMIT", `Block finalized  ${K("height", 0)}  <span class="value">(genesis)</span>  votes=${N("7/7")}`],
    ["build", "CONSENSUS", `Block proposed  ${K("height", 1)}  ${K("round", 0, "number")}  ${K("proposer", "zeom-validator-3")}  ${K("txs", 6, "number")}`],
    ["success", "COMMIT", `Block finalized  ${K("height", 1)}  hash=${M("0xb04f72a1…17de")}  votes=${N("7/7")}  elapsed=${N("212ms")}`],
    ["success", "NODE", `Zeom mainnet is live  version=${N("1.0.0")}  validators=${N("7/7")}  rpc=${M("https://rpc.zeomchain.io")}`]
  ];
  seq.forEach((l, i) => setTimeout(() => {
    add(l);
    if (i === 2) { launched = true; height = 0; setStatus(); metrics(); }
    if (i === 4) { height = 1; setStatus(); }
    if (i === seq.length - 1) holding = false;
  }, 300 + i * 550));
}
document.addEventListener("keydown", (e) => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.key === "Enter") { e.preventDefault(); launch(); }
});

setStatus();
metrics();
fill();
window.addEventListener("resize", fill);
setInterval(metrics, 1800);
setTimeout(loop, 700);
</script>
</body>
</html>
