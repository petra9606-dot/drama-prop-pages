<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>소품 서류 | 피라밋</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 16% 0,rgba(80,105,190,.13),transparent 28%),#0b0f19;color:#eef2ff;font-family:'Segoe UI','Malgun Gothic',sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:48px 28px 70px}
.back{display:inline-block;margin-bottom:26px;color:#8fa8ff;text-decoration:none;font-size:13px}
.header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px}
h1{margin:0;font-size:38px;letter-spacing:-.03em}
.sub{color:#b8954f;font-size:12px;letter-spacing:.12em;margin-top:8px}
.count{font-size:12px;color:#74819a}
.bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.bar input{flex:1;min-width:200px;background:#0d121b;border:1px solid #28344b;border-radius:12px;color:#fff;padding:12px 13px;outline:none;font:inherit}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.tabs button{border:1px solid #2a3550;background:#111725;color:#a6b2c9;border-radius:999px;padding:8px 14px;font:700 13px/1 inherit;cursor:pointer}
.tabs button.on{background:#223055;border-color:#4a63a4;color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.fcard{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:#fff;background:linear-gradient(145deg,rgba(255,255,255,.025),rgba(255,255,255,0)),#111827;border:1px solid #263244;border-radius:16px;padding:18px;transition:.18s;cursor:pointer;min-height:120px}
.fcard:hover{border-color:#5878de;transform:translateY(-2px);background-color:#151e30}
.fhead{display:flex;align-items:center;gap:8px}
.badge{flex:0 0 auto;font-size:10px;font-weight:800;color:#b7c5ff;background:#1c2743;border:1px solid #30436e;border-radius:999px;padding:4px 8px}
.fname{font-size:16px;font-weight:700;line-height:1.35;letter-spacing:-.01em}
.fmeta{margin-top:auto;font-size:11px;color:#697790;display:flex;gap:10px;flex-wrap:wrap}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:#78869f;margin-bottom:16px}
.crumbs a{color:#8fa8ff;text-decoration:none;cursor:pointer}
.ftitle{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.ftitle h2{margin:0;font-size:26px;letter-spacing:-.02em}
.btn{border:0;border-radius:10px;background:#7590ff;color:#fff;font:800 13px/1 inherit;padding:11px 15px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.sec{background:#1c2743;color:#b7c5ff;border:1px solid #30436e}
.btn:disabled{opacity:.5;cursor:default}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:#111827;border:1px solid #232e42;border-radius:12px;padding:11px 12px}
.row:hover{border-color:#3b4f7c}
.ico{flex:0 0 40px;height:46px;border-radius:7px;display:grid;place-items:center;font:800 10px/1 inherit;color:#fff;position:relative}
.ico.hwp{background:#2a7de1}.ico.docx,.ico.doc{background:#2b5797}.ico.pdf{background:#d9453b}.ico.xlsx,.ico.xls{background:#1f7a46}.ico.img{background:#8a5cd6}.ico.etc{background:#4a5568}.ico.dir{background:#c9962c}
.rinfo{flex:1;min-width:0;cursor:pointer}
.rname{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmeta{font-size:11px;color:#6f7d96;margin-top:4px}
.ract{display:flex;gap:6px}
.ract .btn{padding:9px 12px;font-size:12px}
.empty{color:#56627a;font-size:13px;padding:30px 0;text-align:center}
.sec-title{margin:26px 0 10px;font-size:13px;color:#8a97ae;letter-spacing:.06em}
/* 보기 */
#viewer{position:fixed;inset:0;z-index:50;background:rgba(5,8,14,.97);display:none;flex-direction:column}
#viewer.on{display:flex}
.vtop{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #1d2638;background:#0b0f19}
.vtop .t{flex:1;min-width:0;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vtop .pg{font-size:12px;color:#78869f}
.vtop .btn{padding:9px 12px;font-size:12px}
.x{background:transparent;border:0;color:#cbd5ea;font-size:26px;line-height:1;cursor:pointer;padding:0 6px}
#vbody{flex:1;overflow:auto;padding:18px 12px 40px;-webkit-overflow-scrolling:touch;text-align:center}
#vbody canvas,#vbody img.page{display:block;margin:0 auto 14px;max-width:100%;height:auto;background:#fff;box-shadow:0 4px 24px rgba(0,0,0,.5)}
#vbody .msg{color:#9aa6bd;font-size:14px;margin-top:18vh;line-height:1.7}
.spin{width:28px;height:28px;border:3px solid #2a3550;border-top-color:#7590ff;border-radius:50%;animation:sp 0.8s linear infinite;margin:20vh auto 0}
@keyframes sp{to{transform:rotate(360deg)}}
.zoom{display:flex;gap:4px}.zoom button{width:34px;height:34px;border-radius:8px;border:1px solid #30436e;background:#1c2743;color:#b7c5ff;font:800 16px/1 inherit;cursor:pointer}


/* 화면 소품 / 서류 소품 전환 */
.pmode{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 22px}
.pmode a{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:16px;text-decoration:none;border:2px solid #263244;background:#0f1522;color:#8a97ae;transition:.15s}
.pmode a .ic{font-size:26px;line-height:1}.pmode b{display:block;font-size:18px;letter-spacing:-.01em}.pmode small{display:block;font-size:11px;margin-top:4px;opacity:.85}
.pmode a.scr:hover{border-color:#5878de;color:#dfe6f6}
.pmode a.doc.on{border-color:#c99a3c;background:#2b2210;color:#ffd27a}
@media(max-width:580px){.pmode a{padding:12px;gap:10px}.pmode a .ic{font-size:20px}.pmode b{font-size:15px}.pmode small{font-size:10px}}
/* 부 묶음 */
.partsec{margin:6px 0 30px}
.parthead{display:flex;align-items:baseline;gap:12px;margin:0 0 12px;padding-bottom:9px;border-bottom:2px solid #3a2e14}
.parthead b{font-size:24px;color:#ffd27a;letter-spacing:-.02em}
.parthead span{font-size:12px;color:#8a7a5a}
/* 씬 카드 */
.fcard{flex-direction:row;align-items:stretch;gap:14px;min-height:96px;padding:14px 16px;border-color:#2c2a22;background:linear-gradient(145deg,rgba(255,210,122,.035),rgba(255,255,255,0)),#121620}
.fcard:hover{border-color:#c99a3c;background-color:#171b26}
.scn{flex:0 0 64px;border-radius:12px;background:#2b2210;border:1px solid #5a4418;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.scn b{font-size:24px;color:#ffd27a;letter-spacing:-.03em}.scn i{font-style:normal;font-size:11px;color:#c9a35a;margin-top:4px;font-weight:700}
.scn.etc b{font-size:13px}
.fbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.fpart{font-size:11px;font-weight:800;color:#c9a35a;letter-spacing:.04em}
/* 뒤로 */
.backbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid #5a4418;background:#2b2210;color:#ffd27a;border-radius:12px;padding:11px 16px;font:800 14px/1 inherit;cursor:pointer;margin-bottom:14px}
.backbtn:hover{background:#3a2d13}
.vback{display:inline-flex;align-items:center;gap:6px;border:1px solid #5a4418;background:#2b2210;color:#ffd27a;border-radius:10px;padding:10px 14px;font:800 13px/1 inherit;cursor:pointer;white-space:nowrap}
/* 마우스 올리면 작은 미리보기 */
#peek{position:fixed;z-index:40;width:220px;padding:6px;background:#0b0f19;border:1px solid #3a4a6e;border-radius:10px;box-shadow:0 12px 34px rgba(0,0,0,.6);pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
#peek.on{opacity:1;transform:none}
#peek img{display:block;width:100%;height:auto;border-radius:5px;background:#fff}
#peek div{font-size:11px;color:#8a97ae;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:580px){.wrap{padding:30px 16px 50px}.grid{grid-template-columns:1fr}.header{align-items:flex-start;flex-direction:column}h1{font-size:32px}.ract .btn span{display:none}.vtop .pg,.zoom{display:none}}
</style>

</head>
<body>
<main class="wrap">
  <a class="back" href="../">← 피라밋</a>
  <nav class="pmode"><a class="scr" href="../"><span class="ic">🖥</span><span><b>화면 소품</b><small>씬 화면 · 촬영용 앱 · 게임</small></span></a><a class="doc on" href="./"><span class="ic">📄</span><span><b>서류 소품</b><small id="docCount2">씬별 소품 서류 보기 · 받기</small></span></a></nav>
  <div class="header">
    <div><h1>소품 서류</h1><div class="sub">PROPS · DOCUMENTS</div></div>
    <div class="count" id="count">불러오는 중...</div>
  </div>
  <div class="bar"><input id="q" type="search" placeholder="서류·폴더 이름 검색 (예: 계약서, 13씬)"></div>
  <div id="app"></div>
</main>

<div id="viewer">
  <div class="vtop">
    <button class="vback" id="vClose">← 뒤로</button>
    <div class="t" id="vTitle"></div>
    <span class="pg" id="vPg"></span>
    <div class="zoom"><button id="zOut">−</button><button id="zIn">＋</button></div>
    <a class="btn sec" id="vOpen" target="_blank" rel="noopener">새 창</a>
    <a class="btn" id="vDl">받기</a>
  </div>
  <div id="vbody"></div>
</div>
<div id="peek"><img alt=""><div></div></div>

<script>
(() => {
  const API = "/.netlify/functions/docs", FILE = "/.netlify/functions/doc-file";
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[m]));
  const size = (n) => !n ? "" : n < 1024 * 1024 ? Math.max(1, Math.round(n / 1024)) + "KB" : (n / 1048576).toFixed(1) + "MB";
  const ext = (n) => { const m = String(n).match(/\.([a-z0-9]{1,5})$/i); return m ? m[1].toLowerCase() : ""; };
  const kindOf = (f) => { const e = ext(f.name); if (/^(png|jpe?g|webp|gif)$/.test(e)) return "img"; if (/^(hwp|hwpx)$/.test(e)) return "hwp"; if (/^(pdf|docx|doc|xlsx|xls)$/.test(e)) return e; return "etc"; };
  const label = (f) => { const e = ext(f.name); return e ? e.toUpperCase().slice(0, 4) : "FILE"; };
  const num = (s) => { const m = String(s || "").match(/\d+/); return m ? +m[0] : 999; };
  const fileUrl = (f, kind, dl) => `${FILE}?id=${encodeURIComponent(f.id)}${kind === "preview" ? "&kind=preview" : ""}${dl ? "&dl=1" : ""}&v=${encodeURIComponent(kind === "preview" ? (f.preview && f.preview.size) || "" : f.size || "")}`;
  const canView = (f) => !!f.preview || kindOf(f) === "pdf" || kindOf(f) === "img";

  let data = { folders: [], files: [] }, byId = new Map(), part = "전체";
  const kids = (id) => data.folders.filter((f) => f.parent === id).sort(sortFolders);
  const filesIn = (id) => data.files.filter((f) => f.folder === id).sort((a, b) => (a.order - b.order) || a.name.localeCompare(b.name, "ko", { numeric: true }));
  function sortFolders(a, b) { return (num(a.part) - num(b.part)) || (num(a.scene) - num(b.scene)) || (a.order - b.order) || a.name.localeCompare(b.name, "ko", { numeric: true }); }
  function deepFiles(id) { let out = filesIn(id); for (const k of kids(id)) out = out.concat(deepFiles(k.id)); return out; }
  function pathOf(id) { const p = []; for (let f = byId.get(id); f; f = byId.get(f.parent)) p.unshift(f); return p; }
  const partOf = (f) => { for (const x of pathOf(f.id).reverse()) if (x.part) return x.part; return ""; };
  const shortName = (f) => { let n = f.name; if (f.part) n = n.replace(/^\s*\d{1,2}\s*부\s*/, ""); if (f.scene) n = n.replace(/^\s*\d{1,3}\s*씬\s*/, ""); return n.trim() || f.name; };

  const sceneBox = (f) => f.scene ? `<div class="scn"><b>${esc(String(num(f.scene)))}</b><i>씬</i></div>` : `<div class="scn etc"><b>${f.part ? "기타" : "📁"}</b></div>`;
  function folderCard(f, showPart) {
    const n = deepFiles(f.id).length, sub = kids(f.id).length;
    return `<div class="fcard" data-f="${esc(f.id)}">${sceneBox(f)}
      <div class="fbody">${showPart && f.part ? `<div class="fpart">${esc(f.part)}${f.scene ? " · " + esc(f.scene) : ""}</div>` : ""}
      <div class="fname">${esc(shortName(f))}</div>
      <div class="fmeta"><span>서류 ${n}개</span>${sub ? `<span>폴더 ${sub}개</span>` : ""}</div></div></div>`;
  }
  function fileRow(f, showPath) {
    const k = kindOf(f), where = showPath ? pathOf(f.folder).map((x) => x.name).join(" › ") : "";
    return `<div class="row" data-file="${esc(f.id)}">
      <div class="ico ${k}">${esc(label(f))}</div>
      <div class="rinfo" data-view><div class="rname">${esc(f.name)}</div><div class="rmeta">${[size(f.size), where].filter(Boolean).map(esc).join(" · ")}</div></div>
      <div class="ract">${canView(f) ? `<button class="btn sec" data-view>👁<span> 보기</span></button>` : ""}<a class="btn" href="${esc(fileUrl(f, "orig", true))}" download>⬇<span> 받기</span></a></div></div>`;
  }

  // 부별로 묶어서 보여 준다 (부 제목 + 씬 카드)
  function partSection(p, list) {
    const n = list.reduce((a, f) => a + deepFiles(f.id).length, 0);
    return `<section class="partsec"><div class="parthead"><b>${esc(p)}</b><span>씬 ${list.length}개 · 서류 ${n}개</span></div>
      <div class="grid">${list.map((f) => folderCard(f, false)).join("")}</div></section>`;
  }
  function renderHome() {
    const q = $("#q").value.trim().toLowerCase();
    const tops = kids("");
    const parts = [...new Set(tops.map((f) => f.part || "기타"))].sort((a, b) => num(a) - num(b));
    if (q) {
      const fs = data.folders.filter((f) => f.name.toLowerCase().includes(q)).sort(sortFolders);
      const fl = data.files.filter((f) => f.name.toLowerCase().includes(q));
      $("#app").innerHTML = (fs.length ? `<div class="sec-title">폴더 ${fs.length}</div><div class="grid">${fs.map((f) => folderCard(f, true)).join("")}</div>` : "") +
        (fl.length ? `<div class="sec-title">서류 ${fl.length}</div><div class="list">${fl.map((f) => fileRow(f, true)).join("")}</div>` : "") +
        (!fs.length && !fl.length ? `<div class="empty">찾는 서류가 없습니다.</div>` : "");
      return;
    }
    const shown = parts.filter((p) => part === "전체" || p === part);
    const loose = filesIn("");
    $("#app").innerHTML = (parts.length > 1 ? `<div class="tabs">${["전체", ...parts].map((p) => `<button data-part="${esc(p)}" class="${p === part ? "on" : ""}">${esc(p)}</button>`).join("")}</div>` : "") +
      (shown.length ? shown.map((p) => partSection(p, tops.filter((f) => (f.part || "기타") === p))).join("") : (loose.length ? "" : `<div class="empty">아직 올린 서류가 없습니다.</div>`)) +
      (loose.length && part === "전체" ? `<div class="sec-title">기타 서류</div><div class="list">${loose.map((f) => fileRow(f)).join("")}</div>` : "");
  }

  function renderFolder(id) {
    const f = byId.get(id); if (!f) { go("", true); return; }
    const path = pathOf(id), sub = kids(id), fl = filesIn(id), all = deepFiles(id);
    const up = path.length > 1 ? path[path.length - 2].name : (f.part ? f.part + " 목록" : "전체 목록");
    $("#app").innerHTML = `<button class="backbtn" data-back>← 뒤로 <span style="font-weight:600;opacity:.75">(${esc(up)})</span></button>
      <div class="crumbs"><a data-home>전체</a>${path.map((p) => ` › ${p.id === id ? `<span>${esc(p.name)}</span>` : `<a data-f="${esc(p.id)}">${esc(p.name)}</a>`}`).join("")}</div>
      <div class="ftitle"><div style="display:flex;gap:14px;align-items:center">${f.scene || f.part ? sceneBox(f) : ""}<div>${f.part ? `<div class="fpart" style="margin-bottom:6px">${esc(f.part)}${f.scene ? " · " + esc(f.scene) : ""}</div>` : ""}<h2>${esc(shortName(f))}</h2></div></div>
      ${all.length ? `<button class="btn sec" id="zipBtn">⬇ 폴더 전체 받기 (${all.length}개)</button>` : ""}</div>
      ${sub.length ? `<div class="grid" style="margin-bottom:18px">${sub.map((x) => folderCard(x, false)).join("")}</div>` : ""}
      ${fl.length ? `<div class="list">${fl.map((x) => fileRow(x)).join("")}</div>` : (sub.length ? "" : `<div class="empty">이 폴더는 비어 있습니다.</div>`)}`;
    $("#zipBtn")?.addEventListener("click", () => zipFolder(f));
  }

  /* ── 화면 이동: 앞으로 가기는 기록을 남기고, 뒤로는 바로 이전 화면으로 ── */
  const hashParams = () => new URLSearchParams(location.hash.slice(1));
  function go(hash, replace) {
    const url = location.pathname + location.search + (hash ? "#" + hash : "");
    if (replace) history.replaceState(history.state, "", url); else history.pushState({ dw: 1 }, "", url);
    render();
  }
  function parentHash() {
    const h = hashParams();
    if (h.get("v")) { h.delete("v"); return h.toString(); }
    const f = byId.get(h.get("f"));
    if (f) { if (f.parent && byId.get(f.parent)) return "f=" + f.parent; const t = pathOf(f.id)[0]; return t && t.part ? "p=" + encodeURIComponent(t.part) : ""; }
    return "";
  }
  function goBack() {
    if (history.state && history.state.dw) history.back(); else go(parentHash(), true);
  }

  function render() {
    const h = hashParams();
    if (h.get("p")) part = h.get("p");
    if (h.get("q") && !$("#q").value) $("#q").value = h.get("q");
    if (h.get("f") && !$("#q").value.trim()) renderFolder(h.get("f")); else renderHome();
    const v = h.get("v"); const vf = v && data.files.find((x) => x.id === v);
    if (vf) openView(vf); else closeView();
  }

  $("#app").addEventListener("click", (e) => {
    const t = e.target;
    if (t.closest("[data-back]")) { goBack(); return; }
    const p = t.closest("[data-part]"); if (p) { part = p.dataset.part; try { localStorage.setItem("dwDocsPart", part); } catch {} go(part === "전체" ? "" : "p=" + encodeURIComponent(part), true); return; }
    if (t.closest("[data-home]")) { go(part !== "전체" ? "p=" + encodeURIComponent(part) : ""); return; }
    const fc = t.closest("[data-f]"); if (fc) { $("#q").value = ""; go("f=" + fc.dataset.f); scrollTo(0, 0); return; }
    const vw = t.closest("[data-view]"); if (vw) {
      const f = data.files.find((x) => x.id === vw.closest("[data-file]").dataset.file);
      if (!f) return;
      hidePeek();
      if (!canView(f)) { location.href = fileUrl(f, "orig", true); return; }
      const h = hashParams(); h.set("v", f.id); go(h.toString());
    }
  });
  $("#q").addEventListener("input", () => { const h = hashParams(); if (h.has("q")) { h.delete("q"); go(h.toString(), true); } else render(); });
  addEventListener("popstate", render);
  addEventListener("hashchange", render);

  /* ── 마우스를 올리면 작은 미리보기 (PC에서만, 작은 사진이라 트래픽 거의 없음) ── */
  const peek = $("#peek"); let peekT = 0, peekId = "";
  const canHover = matchMedia("(hover: hover) and (pointer: fine)").matches;
  function hidePeek() { clearTimeout(peekT); peekId = ""; peek.classList.remove("on"); }
  function placePeek(x, y) {
    const w = 232, hgt = peek.offsetHeight || 320;
    let left = x + 18, top = y - hgt / 2;
    if (left + w > innerWidth - 8) left = x - w - 18;
    top = Math.max(8, Math.min(top, innerHeight - hgt - 8));
    peek.style.left = left + "px"; peek.style.top = top + "px";
  }
  if (canHover) {
    $("#app").addEventListener("mouseover", (e) => {
      const el = e.target.closest("[data-view]"); const row = el && el.closest("[data-file]");
      if (!row) return;
      const f = data.files.find((x) => x.id === row.dataset.file);
      if (!f || !f.thumb || peekId === f.id) return;
      clearTimeout(peekT); peekId = f.id;
      const x = e.clientX, y = e.clientY;
      peekT = setTimeout(() => {
        const img = peek.querySelector("img");
        img.onload = () => { if (peekId === f.id) { placePeek(x, y); peek.classList.add("on"); } };
        img.src = `${FILE}?id=${encodeURIComponent(f.id)}&kind=thumb&v=${encodeURIComponent(f.thumb)}`;
        peek.querySelector("div").textContent = f.name;
        if (img.complete && img.naturalWidth) img.onload();
      }, 220);
    });
    $("#app").addEventListener("mousemove", (e) => { if (peek.classList.contains("on")) placePeek(e.clientX, e.clientY); });
    $("#app").addEventListener("mouseout", (e) => {
      const el = e.target.closest("[data-view]"); if (!el) return;
      if (e.relatedTarget && el.contains(e.relatedTarget)) return;
      hidePeek();
    });
    addEventListener("scroll", hidePeek, { passive: true });
  }

  /* ── 보기 ── */
  let pdfLib, scale = 1, curDoc = null, viewing = null;
  const loadScript = (src) => new Promise((ok, no) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
  function getPdf() {
    return pdfLib || (pdfLib = loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js").then(() => {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      return window.pdfjsLib;
    }));
  }
  async function openView(f) {
    if (viewing === f.id) return; viewing = f.id;
    const src = f.preview ? fileUrl(f, "preview") : fileUrl(f, "orig");
    $("#vTitle").textContent = f.name; $("#vPg").textContent = "";
    $("#vDl").href = fileUrl(f, "orig", true); $("#vDl").setAttribute("download", f.name);
    $("#vOpen").href = src;
    $("#viewer").classList.add("on"); document.body.style.overflow = "hidden";
    const body = $("#vbody"); body.innerHTML = `<div class="spin"></div>`; scale = 1;
    const k = f.preview ? (/pdf/.test(f.preview.type) ? "pdf" : "img") : kindOf(f);
    try {
      if (k === "img") { body.innerHTML = `<img class="page" src="${esc(src)}" alt="">`; return; }
      const lib = await getPdf();
      const doc = await lib.getDocument({ url: src, cMapUrl: "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/", cMapPacked: true, standardFontDataUrl: "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/standard_fonts/" }).promise;
      if (viewing !== f.id) return;
      curDoc = doc; await drawPdf(f.id);
    } catch (err) {
      if (viewing !== f.id) return;
      body.innerHTML = `<div class="msg">미리보기를 열지 못했습니다.<br><br><a class="btn" href="${esc(fileUrl(f, "orig", true))}">⬇ 파일 받기</a></div>`;
    }
  }
  async function drawPdf(id) {
    const doc = curDoc, body = $("#vbody"); body.innerHTML = "";
    $("#vPg").textContent = doc.numPages + "쪽";
    const avail = Math.min(body.clientWidth - 24, 980);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    for (let i = 1; i <= doc.numPages; i++) {
      if (viewing !== id || doc !== curDoc) return;
      const page = await doc.getPage(i);
      const base = page.getViewport({ scale: 1 });
      const s = (avail / base.width) * scale;
      const vp = page.getViewport({ scale: s * dpr });
      const c = document.createElement("canvas"); c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
      c.style.width = Math.floor(vp.width / dpr) + "px"; c.style.maxWidth = scale > 1 ? "none" : "100%";
      body.appendChild(c);
      await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
    }
  }
  function closeView() {
    if (!viewing && !$("#viewer").classList.contains("on")) return;
    viewing = null; curDoc = null;
    $("#viewer").classList.remove("on"); document.body.style.overflow = ""; $("#vbody").innerHTML = "";
  }
  $("#vClose").addEventListener("click", goBack);
  addEventListener("keydown", (e) => { if (e.key === "Escape" && viewing) goBack(); });
  $("#zIn").addEventListener("click", () => { if (!curDoc) return; scale = Math.min(scale * 1.25, 4); drawPdf(viewing); });
  $("#zOut").addEventListener("click", () => { if (!curDoc) return; scale = Math.max(scale / 1.25, .5); drawPdf(viewing); });

  /* ── 폴더 통째로 받기 (ZIP) ── */
  let zipLib;
  async function zipFolder(f) {
    const btn = $("#zipBtn"), old = btn.textContent; btn.disabled = true;
    try {
      zipLib = zipLib || loadScript("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js");
      await zipLib;
      const zip = new window.JSZip(), base = pathOf(f.id).length - 1;
      const all = deepFiles(f.id); let n = 0;
      for (const x of all) {
        btn.textContent = `준비 중 ${++n}/${all.length}`;
        const r = await fetch(fileUrl(x, "orig")); if (!r.ok) continue;
        const dir = pathOf(x.folder).slice(base).map((p) => p.name.replace(/[\\/:*?"<>|]/g, "_")).join("/");
        zip.file((dir ? dir + "/" : "") + x.name.replace(/[\\/:*?"<>|]/g, "_"), await r.arrayBuffer());
      }
      btn.textContent = "압축 중...";
      const blob = await zip.generateAsync({ type: "blob" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = f.name.replace(/[\\/:*?"<>|]/g, "_") + ".zip";
      document.body.appendChild(a); a.click(); setTimeout(() => { a.remove(); URL.revokeObjectURL(a.href); }, 30000);
    } catch (e) { alert("받기에 실패했습니다. 다시 시도해 주세요."); }
    btn.textContent = old; btn.disabled = false;
  }

  try { part = localStorage.getItem("dwDocsPart") || "전체"; } catch {}
  fetch(API).then((r) => r.json()).then((j) => {
    data = { folders: j.folders || [], files: j.files || [] }; byId = new Map(data.folders.map((f) => [f.id, f]));
    $("#docCount2").textContent = `씬 ${data.folders.filter((f) => !f.parent).length}개 · 서류 ${data.files.length}개`;
    $("#count").textContent = `폴더 ${data.folders.filter((f) => !f.parent).length}개 · 서류 ${data.files.length}개`;
    const parts = new Set(kids("").map((f) => f.part || "기타")); if (part !== "전체" && !parts.has(part)) part = "전체";
    render();
  }).catch(() => { $("#count").textContent = ""; $("#app").innerHTML = `<div class="empty">목록을 불러오지 못했습니다. 새로고침해 주세요.</div>`; });
})();
</script>
