  try {
    if (window.top !== window.self) return;            // 미리보기·촬영 화면 안의 소품은 따로 세지 않음
    if (localStorage.getItem("dw-noga")) return;        // 주인 기기
    if (/bot|crawl|spider|headless|lighthouse/i.test(navigator.userAgent)) return;
    var vid = localStorage.getItem("dw-vid"), isNew = false;
    if (!vid) { vid = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem("dw-vid", vid); isNew = true; }
    var path = location.pathname + (location.pathname.indexOf("shoot.html") >= 0 ? location.search : "");
    // 같은 탭에서 같은 페이지를 30분 안에 다시 열면 한 번만
    var k = "dw-st:" + path, last = +sessionStorage.getItem(k) || 0;
    if (Date.now() - last < 30 * 60 * 1000) return;
    sessionStorage.setItem(k, String(Date.now()));
    var ua = navigator.userAgent, dev = /iPad|Tablet/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) ? "tablet" : /Mobi|Android|iPhone/i.test(ua) ? "phone" : "pc";
    var ref = ""; try { if (document.referrer) { var r = new URL(document.referrer); if (r.host !== location.host) ref = r.host; } } catch (e) {}
    var app = /KAKAOTALK/i.test(ua) ? "kakao" : /Instagram/i.test(ua) ? "insta" : /NAVER/i.test(ua) ? "naver" : "";
    var body = JSON.stringify({ v: vid, n: isNew ? 1 : 0, p: path.slice(0, 300), t: (document.title || "").slice(0, 120), d: dev, r: ref, a: app });
    var send = function () {
      if (navigator.sendBeacon && navigator.sendBeacon("/.netlify/functions/stat", new Blob([body], { type: "text/plain" }))) return;
      fetch("/.netlify/functions/stat", { method: "POST", body: body, keepalive: true }).catch(function () {});
    };
    if (document.readyState === "complete") setTimeout(send, 300); else addEventListener("load", function () { setTimeout(send, 300); });
  } catch (e) {}
})();

 function hub(){document.title='씬 44 · 영상 제작과 숏폼';app.innerHTML=`<main class="hub"><span class="hub-back">피라밋 6부 · 씬44</span><div class="hub-head"><div><div class="eyebrow">PYRAMID · EPISODE 06 / SCENE 44</div><h1>하나의 영상,<br>퍼져나가는 여론.</h1><p class="intro">직원들의 편집·배포 화면부터 시민들의 숏폼 피드까지.<br>영상은 그린스크린으로, 앱 화면은 바로 촬영할 수 있게.</p></div><button data-settings>촬영 설정 · 사용법</button></div><div class="hub-grid"><a class="launch" href="#studio"><div class="launch-art"><div class="mini-studio"><span></span><b></b><span></span></div></div><h2>FRAMECUT Studio</h2><p>직원용 PC 화면<br>세로 영상 편집 · 자막 · 타임라인 · 두 플랫폼 배포</p><div class="open">영상 제작 프로그램 열기　↗</div></a><a class="launch" href="#loop"><div class="launch-art"><div class="mini-phone"></div></div><h2>클립로그 숏폼</h2><p>시민용 쇼츠 대체 화면<br>추천 피드 · 좋아요 · 댓글 · 위로 넘기기</p><div class="open">세로 영상 피드 열기　↗</div></a><a class="launch" href="#moment"><div class="launch-art"><div class="mini-phone" style="border-color:#b77596"></div></div><h2>숏레빗 Reels</h2><p>시민용 릴스 대체 화면<br>풀스크린 영상 · 팔로우 · 공유 · 댓글</p><div class="open">릴스 피드 열기　↗</div></a></div><section class="hub-guide"><strong>촬영 전 확인</strong><p>영상 영역 기본값은 단색 <code>#00FF00</code>입니다. 합성용 영역 안에는 기본 자막·가이드가 없습니다. 앱 정보와 댓글은 대본을 바탕으로 구성했습니다.</p><p>PC에서 <code>F</code>를 누르면 전체화면, <code>Space</code>는 재생/정지입니다. 시민용 화면은 위·아래 스와이프 또는 <code>↑ ↓</code>로 넘깁니다. 앱 이름을 0.8초 길게 누르면 숨겨진 촬영 설정이 열립니다.</p><p>제목·문구·숫자·댓글은 수정해 저장할 수 있습니다. 저장은 현재 기기·브라우저에만 적용됩니다. ‘설정 파일 내보내기/불러오기’로 다른 휴대폰에 옮길 수 있습니다.</p><p>배포 화면은 촬영용 효과이며 실제 SNS에 게시되지 않습니다. 영상 파일 저장은 실제 기능입니다. 원본 영상의 구간 자르기와 자막을 적용해 MP4/WebM으로 저장할 수 있으며 서버로 전송하지 않습니다.</p><div class="links"><a href="#loop?setup=1">숏폼 설정하며 열기</a><a href="#moment?setup=1">릴스 설정하며 열기</a></div></section></main>`;}
 function studio(){document.title='FRAMECUT Studio · 검은 돈의 진실';const p=current();app.innerHTML=`<main class="studio"><header class="studio-top"><a href="#hub" class="brand"><span class="mark">F</span>FRAMECUT <small>STUDIO</small></a><div class="project-name">검은 돈의 진실 / ${esc(p.title)}</div><span class="save-state">모든 변경사항 저장됨</span><button class="icon-button" data-full aria-label="전체화면">${icon('full')}</button><button data-save>저장</button><button class="primary" data-render>${icon('upload',true)}　내보내기</button></header><div class="studio-main"><aside class="media-panel"><div class="panel-heading">프로젝트 미디어 <span class="muted">＋</span></div><div class="tabs"><span class="active">미디어</span><span>텍스트</span><span>오디오</span></div>${config.posts.map((post,i)=>`<button class="asset ${i===index?'selected':''}" data-select="${i}"><div class="asset-thumb"><b class="key-block"></b><span class="asset-time">${time(post.duration)}</span></div><div class="asset-name">${i===0?'국회_복도_인터뷰':i===1?'상임위_발언':'비트원_수사촉구'}.mp4<small>${esc(post.title)}</small></div></button>`).join('')}<div class="media-count">3개 클립 · 9:16 프로젝트</div><button data-settings style="width:100%">프로젝트 설정</button></aside><section class="preview-panel"><div class="preview-top"><span>플레이어 · 원본 비율</span><span>1080 × 1920　⌄</span></div><div class="preview-space"><div class="green-preview" style="background:${config.green}">${localMedia?`<video class="studio-video" playsinline muted loop src="${esc(localMedia)}"></video>`:''}${config.guides?'<div class="crop-guide"></div>':''}<div class="video-caption" ${config.captionVisible?'':'hidden'}>${esc(p.caption)}</div></div></div><div class="preview-bottom"><button class="icon-button" data-step="-1" aria-label="이전 클립">${icon('back',true)}</button><button class="preview-play" data-play aria-label="재생 또는 일시정지">${icon(playing?'pause':'play',true)}</button><button class="icon-button" data-step="1" aria-label="다음 클립">${icon('next',true)}</button><span><b data-clock>${time(elapsed)}</b> / ${time(p.duration)}</span></div></section><aside class="inspector"><div class="panel-heading">속성 <span class="muted">편집</span></div><div><label for="edit-title">영상 제목</label><input id="edit-title" data-edit="title" value="${esc(p.title)}" maxlength="200"><label for="edit-caption">자막 문구</label><textarea id="edit-caption" data-edit="caption" maxlength="500">${esc(p.caption)}</textarea><label class="check"><input type="checkbox" data-option="captionVisible" ${config.captionVisible?'checked':''}>영상 위에 자막 표시</label><label class="check"><input type="checkbox" data-option="guides" ${config.guides?'checked':''}>안전 영역 가이드</label></div><div><label for="edit-duration">클립 길이 (초)</label><input id="edit-duration" type="number" min="0.1" step="0.1" max="120" data-edit="duration" value="${p.duration}"><label for="green-color">배경 색상</label><input id="green-color" type="color" data-color value="${config.green}"><label for="video-import">영상 교체</label><input id="video-import" class="file-picker" type="file" accept="video/*" data-video><p class="loaded-media">${esc(localMediaName||'1080 × 1920 · Chroma Green')}</p><div class="ratio-row"><span>9:16</span><span>30 fps</span><span>HD</span></div></div><p class="help-inline">클립을 선택해 제목과 자막을 편집합니다. 변경한 정보는 클립로그와 숏레빗의 게시물에 함께 적용됩니다.</p><div class="button-row"><button data-settings>게시 정보</button><button data-publish class="primary">배포</button></div></aside></div><section class="timeline"><div class="timeline-tools"><div class="left"><span>⌘ Z</span><span>✂</span><span>자석 켜짐</span><span class="muted">타임라인</span></div><span>−　━━━━　＋　　9:16</span></div><div class="timeline-body"><div class="track-labels"><span>영상　◉</span><span>자막　T</span><span>오디오　♫</span></div><div class="track-area"><div class="ruler">${[0,.25,.5,.75,1].map(x=>`<span>${time(p.duration*x)}</span>`).join('')}</div><div class="track">${config.posts.map((post,i)=>`<button data-select="${i}" class="${i===index?'active':''}">${esc(post.title)}</button>`).join('')}</div><div class="track caption-track"><span>${esc(p.caption.replace(/\n/g,' · '))}</span><span>국회 발언 / 수사 촉구</span></div><div class="wave"></div><div class="playhead" data-head></div><label class="seek-label" for="seek">재생 위치<input id="seek" type="range" min="0" max="${p.duration}" step=".1" value="${elapsed}" data-seek></label></div></div></section><footer class="studio-footer"><span>프로젝트: 검은 돈의 진실　·　로컬 작업 공간</span><span>1920p　30 fps　색 공간 sRGB　　${esc(p.views)}회 조회</span></footer></main>`;updateSave();syncVideo();}
 function action(name,cmd,label,value=''){return `<button class="feed-action ${cmd==='like'&&liked?'liked':''}" data-${cmd} aria-label="${label}" ${cmd==='like'?`aria-pressed="${liked}"`:''}>${icon(name)}<span ${cmd==='like'?'data-likes':cmd==='comments'?'data-comment-count':''}>${esc(value||label)}</span></button>`;}
 function feed(){const p=current(),moment=screen==='moment';document.title=moment?'숏레빗 · 릴스':'클립로그 · 숏폼';app.innerHTML=`<main class="feed-shell"><section class="feed-device ${moment?'moment':''}" aria-label="${moment?'숏레빗 릴스':'클립로그 숏폼'}"><header class="feed-top"><button class="feed-brand" data-hidden-settings aria-label="${moment?'숏레빗':'클립로그'}">${moment?'숏레빗':'<span class="loop-mark">▶</span>클립로그'}</button><span class="space"></span><button class="icon-button" data-search aria-label="검색">${icon(moment?'camera':'search')}</button>${moment?'':`<div class="avatar">J</div>`}</header><div class="feed-tabs"><span>추천</span><span>팔로잉</span><span>뉴스</span></div><div class="feed-stage" style="background:${config.green}">${localMedia?`<video class="feed-video" playsinline muted loop src="${esc(localMedia)}"></video>`:''}<button class="play-touch" data-play aria-label="영상 재생 또는 일시정지"></button><div class="paused" ${playing?'hidden':''}><span>${icon('play')}</span></div><div class="video-caption" ${config.captionVisible?'':'hidden'}>${esc(p.caption)}</div><div class="feed-overlay"><div class="feed-account"><span class="avatar">${p.account==='대영일보'?'DY':'IF'}</span><span>${esc(moment?p.handle:'@'+p.handle)}</span><button class="follow" data-follow>${followed?'팔로잉':'팔로우'}</button></div><div class="feed-title">${esc(p.title)}</div><p class="feed-description">${esc(p.description).replace(/\n/g,'<br>')}</p><div class="feed-audio">${icon('music',true)}<span>오리지널 오디오 · ${esc(p.account)}</span></div></div><aside class="feed-actions">${action('heart','like','좋아요',format(p.likes+(liked?1:0)))}${action('comment','comments','댓글',format(p.commentCount))}${action('share','share','공유',format(p.shares))}${action('bookmark','bookmark','저장',saved?'저장됨':'저장')}${action('more','more','더 보기')}<div class="disc">${p.account==='대영일보'?'DY':'IF'}</div></aside><div class="feed-progress"><span data-feed-progress></span></div></div><nav class="feed-nav" aria-label="하단 탐색"><button data-home>${icon('home')}<span class="label">홈</span></button><button class="active" data-feed-current>${icon('play')}<span class="label">숏폼</span></button><button data-create aria-label="만들기"><span class="create">＋</span></button><button data-bookmark>${icon(moment?'heart':'bookmark')}<span class="label">보관함</span></button><button data-profile>${icon('user')}<span class="label">나</span></button></nav></section></main>`;syncVideo();}
 const projectDuration=()=>config.posts.reduce((sum,post)=>sum+post.duration,0);
 const clipOffset=i=>config.posts.slice(0,i).reduce((sum,post)=>sum+post.duration,0);
 const projectPosition=()=>clipOffset(index)+elapsed;
 function render(){const media=Video?.get(index);localMedia=media?.url||null;localMediaName=media?.name||'';if(screen==='hub')hub();else if(screen==='studio')studio();else feed();if(screen==='studio')enhanceStudio();else if(screen==='loop'||screen==='moment')enhanceFeed();if(document.fullscreenElement)app.querySelector('main')?.classList.add('film');updateTime();}
 function syncVideo(){const video=app.querySelector('.studio-video,.feed-video'),media=Video?.get(index);if(video){const target=(media?current().trimStart||0:0)+elapsed;const seek=()=>{if(Math.abs(video.currentTime-target)>.08)video.currentTime=Math.min(target,Number.isFinite(video.duration)?video.duration:target);if(playing)video.play().catch(()=>{});else video.pause();};if(video.readyState>=1)seek();else video.addEventListener('loadedmetadata',seek,{once:true});}}
 function selectPost(next){index=(next+config.posts.length)%config.posts.length;elapsed=0;liked=false;followed=false;saved=false;playing=screen!=='studio';render();}
 function play(){playing=!playing;const button=app.querySelector('.preview-play');if(button)button.innerHTML=icon(playing?'pause':'play',true);const pause=app.querySelector('.paused');if(pause)pause.hidden=playing;syncVideo();}
 function updateTime(){const pct=elapsed/current().duration*100,position=screen==='studio'?projectPosition():elapsed,total=screen==='studio'?projectDuration():current().duration;const clock=app.querySelector('[data-clock]');if(clock)clock.textContent=time(position);const durationLabel=app.querySelector('[data-total]');if(durationLabel)durationLabel.textContent=time(total);const head=app.querySelector('[data-head]');if(head)head.style.left=position/total*100+'%';const bar=app.querySelector('[data-feed-progress]');if(bar)bar.style.width=pct+'%';const seek=app.querySelector('[data-seek]');if(seek&&document.activeElement!==seek)seek.value=position;}
 function loop(timestamp){const dt=lastTime?Math.min(.2,(timestamp-lastTime)/1000):0;lastTime=timestamp;if(playing&&screen!=='hub'&&!document.hidden&&!settings.open&&!comments.open&&!publish.open&&!exportDialog.open){const video=app.querySelector('video');elapsed=video&&video.readyState>=2?Math.max(0,video.currentTime-(current().trimStart||0)):elapsed+dt;if(elapsed>=current().duration){if(screen==='studio'){if(index<config.posts.length-1){index++;elapsed=0;render();}else{elapsed=current().duration;playing=false;render();}}else if(config.autoNext)selectPost(index+1);else{elapsed=0;syncVideo();}}updateTime();}frame=requestAnimationFrame(loop);}
 function openSettings(){const p=current();settings.innerHTML=`${heading('settings-title','촬영 설정 · 사용법')}<p class="settings-intro">설정은 현재 브라우저에 저장됩니다. 화면 안의 영상은 기본적으로 단색 그린스크린이며, 실제 SNS로 전송되는 내용은 없습니다.</p><div class="settings-tabs">${config.posts.map((_,i)=>`<button type="button" data-settings-post="${i}" class="${i===index?'on':''}">영상 ${i+1}</button>`).join('')}</div><form id="settings-form"><div class="settings-columns"><div><label for="s-title">제목</label><input id="s-title" name="title" value="${esc(p.title)}" maxlength="200"><label for="s-account">계정 이름</label><input id="s-account" name="account" value="${esc(p.account)}" maxlength="80"><label for="s-handle">계정 아이디</label><input id="s-handle" name="handle" value="${esc(p.handle)}" maxlength="80"><label for="s-description">게시물 설명 · 해시태그</label><textarea id="s-description" name="description" maxlength="1000">${esc(p.description)}</textarea><label for="s-caption">영상 위 자막</label><textarea id="s-caption" name="caption" maxlength="500">${esc(p.caption)}</textarea></div><div><label for="s-likes">좋아요 수</label><input id="s-likes" type="number" name="likes" value="${p.likes}" min="0" max="99999999"><label for="s-commentCount">댓글 수</label><input id="s-commentCount" type="number" name="commentCount" value="${p.commentCount}" min="0" max="99999999"><label for="s-shares">공유 수</label><input id="s-shares" type="number" name="shares" value="${p.shares}" min="0" max="99999999"><label for="s-duration">영상 길이 (초)</label><input id="s-duration" type="number" name="duration" value="${p.duration}" min="0.1" step="0.1" max="120"><label for="s-comments">댓글 목록 (이름 | 내용 · 한 줄에 한 개)</label><textarea id="s-comments" name="comments" maxlength="6000">${esc(p.comments.map(c=>c.name+' | '+c.text).join('\n'))}</textarea></div></div><label class="check"><input type="checkbox" name="captionVisible" ${config.captionVisible?'checked':''}>그린 영역에 자막 표시</label><label class="check"><input type="checkbox" name="autoNext" ${config.autoNext?'checked':''}>재생 시간이 끝나면 다음 영상으로 자동 넘김</label><div class="dialog-bottom"><button type="button" data-export>설정 파일 내보내기</button><button type="submit" class="primary">저장하고 적용</button></div></form><label for="settings-import">다른 기기의 설정 불러오기</label><input id="settings-import" type="file" accept="application/json,.json" data-import><label for="settings-video">실제 영상 넣기 (이 브라우저에서만 사용)</label><input id="settings-video" type="file" accept="video/*" data-video><p class="loaded-media">${esc(localMediaName||'영상 없음 · 그린스크린 사용 중')}</p><div class="button-row"><button type="button" data-clear-video>그린스크린으로 돌아가기</button><button type="button" data-full>전체화면</button></div><div class="guide"><strong>숨겨진 버튼과 조작</strong><br>• 클립로그/릴스 제목을 0.8초 길게 누르기: 이 설정 열기<br>• 영상 가운데 터치: 재생 / 일시정지<br>• 위로 스와이프·↓: 다음 영상 / 아래로·↑: 이전 영상<br>• PC: F 전체화면, Space 재생/정지, E 설정<br>• 댓글: 말풍선 클릭. 댓글 추가도 이 기기에만 저장<br>• 직원 화면: 클립 선택 → 자막 편집 → 저장 → 내보내기/배포<br>• 배포: 촬영용 게시 효과. 동영상 내보내기: 선택한 클립을 MP4/WebM으로 저장, 최대 120초<br>• 영상 파일은 서버로 업로드하지 않으며, 새로고침하면 다시 선택해야 함<br>• 그린 합성 영역: 배경 그라데이션 없이 #00FF00 단색. 그림자는 앱 글자에만 적용</div>`;if(!settings.open)settings.showModal();}
 function applySettings(){const form=settings.querySelector('form'),values=new FormData(form),p=current();for(const key of ['title','account','handle','description','caption'])p[key]=String(values.get(key)||'');for(const key of ['likes','commentCount','shares','duration'])p[key]=Number(values.get(key));p.comments=String(values.get('comments')||'').split('\n').map(line=>{const parts=line.split('|');return {name:parts.length>1?parts.shift().trim():'시민',text:parts.join('|').trim(),likes:0};}).filter(c=>c.text);config.captionVisible=values.has('captionVisible');config.autoNext=values.has('autoNext');config=sanitize(config);elapsed=Math.min(elapsed,current().duration);dirty=true;render();}

 window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});window.addEventListener('pagehide',()=>{cancelAnimationFrame(frame);stopPublish();if(localMedia)URL.revokeObjectURL(localMedia);});
 window.addEventListener('hashchange',()=>{
  stopPublish();clearTimeout(holdTimer);Video.cancel();
  for(const modal of [settings,comments,publish,exportDialog])if(modal.open)modal.close();
  query=readRoute();screen=['studio','loop','moment'].includes(query.get('screen'))?query.get('screen'):'hub';
  index=Math.max(0,Math.min(2,Number(query.get('post'))||0));elapsed=0;playing=['loop','moment'].includes(screen);liked=false;followed=false;saved=false;
  render();if(query.get('setup')==='1')openSettings();
 });
 const markerMarkup='<div class="tracking-markers" aria-hidden="true"><i style="--x:8%;--y:10%"></i><i style="--x:92%;--y:10%"></i><i style="--x:50%;--y:50%"></i><i style="--x:8%;--y:90%"></i><i style="--x:92%;--y:90%"></i></div>';
 function syncTrackingMarkers(){app.querySelectorAll('.green-preview,.feed-stage').forEach(node=>{const video=node.querySelector('.studio-video,.feed-video'),markers=node.querySelector(':scope > .tracking-markers');if(video){markers?.remove();}else if(!markers){node.insertAdjacentHTML('afterbegin',markerMarkup);}});}
 const markerObserver=new MutationObserver(syncTrackingMarkers);markerObserver.observe(app,{childList:true,subtree:true});
 render();syncTrackingMarkers();frame=requestAnimationFrame(loop);if(query.get('setup')==='1')openSettings();if(storageError)toast('저장된 설정을 읽지 못해 기본값으로 시작합니다');
})();
