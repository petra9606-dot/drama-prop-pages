<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>6부 | 피라밋</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 15% 0,rgba(72,96,180,.13),transparent 30%),#0b0f19;color:#eef2ff;font-family:'Segoe UI','Malgun Gothic',sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:48px 28px 70px}
.back{display:inline-block;margin-bottom:26px;color:#8fa8ff;text-decoration:none;font-size:13px}
.header{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:28px}
h1{margin:0;font-size:38px;letter-spacing:-.03em}.sub{color:#7e8ba3;font-size:12px;margin-top:8px;letter-spacing:.08em}.count{font-size:12px;color:#71809a}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:15px}
.card{display:block;text-decoration:none;color:#fff;background:#111827;border:1px solid #263244;border-radius:16px;padding:20px;min-height:145px;transition:.16s;position:relative}
.card:hover{border-color:#5b7de7;transform:translateY(-2px);background:#151e30}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.scene{display:inline-block;font-size:11px;font-weight:900;color:#bac7ff;background:#1d2945;border:1px solid #314673;border-radius:999px;padding:5px 8px}
.source{font-size:9px;letter-spacing:.12em;color:#5e6c84}.title{font-size:21px;font-weight:850;letter-spacing:-.02em;margin-top:16px;line-height:1.28}.filename{font-size:11px;color:#71809a;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.open{position:absolute;right:18px;bottom:17px;font-size:16px;color:#809cff}
.empty{grid-column:1/-1;color:#64748b;padding:25px;border:1px dashed #334155;border-radius:14px;text-align:center}
@media(max-width:580px){.wrap{padding:30px 16px 50px}.header{align-items:flex-start;flex-direction:column}h1{font-size:32px}}

.filter{margin:0 0 20px}.filter input{width:100%;background:#0d121b;border:1px solid #28344b;border-radius:12px;color:#fff;padding:12px 13px;outline:none}
</style>
</head>
<body><main class="wrap">
<a class="back" href="../index.html">← 피라밋</a>
<div class="header"><div><h1>6부</h1><div class="sub">SCENE MATERIALS</div></div><div class="count" id="count">자료 불러오는 중...</div></div>
<div class="filter"><input id="localSearch" placeholder="이 부에서 씬 / 제목 검색"></div><div id="grid" class="grid"></div>
</main>
<script>
const staticItems=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function render(uploaded=[]){
  const all=[...staticItems.map(x=>({...x,pinned:false})),...uploaded.map(x=>({scene:x.scene,title:x.title||x.filename,filename:x.filename,url:x.url,source:"웹 업로드",pinned:!!x.pinned}))].sort((a,b)=>Number(!!b.pinned)-Number(!!a.pinned));
  document.getElementById('count').textContent=all.length?`${all.length}개 자료`:'등록된 자료 없음';
  const box=document.getElementById('grid');
  if(!all.length){box.innerHTML='<div class="empty">아직 등록된 씬 자료가 없습니다.</div>';return;}
  box.innerHTML=all.map(x=>`<a class="card" href="${x.url}" ${x.source==="웹 업로드"?'target="_blank"':''}>
    <div class="topline"><span class="scene">${esc(x.scene)}${x.pinned?" ★":""}</span><span class="source">${esc(x.source)}</span></div>
    <div class="title">${esc(x.title)}</div>
    <div class="filename">${esc(x.filename||'')}</div><div class="open">↗</div>
  </a>`).join('');
}
render([]);
fetch('/.netlify/functions/catalog?project=pyramid&part=6부').then(r=>r.json()).then(({items=[]})=>render(items)).catch(()=>render([]));
document.getElementById('localSearch').addEventListener('input',e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('#grid .card').forEach(c=>c.style.display=c.innerText.toLowerCase().includes(q)?'block':'none');});
</script></body></html>
