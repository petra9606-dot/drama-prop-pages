[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# 검색엔진에 노출되지 않게 (모든 페이지)
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

# 오프라인 지원 스크립트는 항상 최신으로
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"


# 헤븐코인 화면: 예전 haven 주소로 들어와도 새 heaven 주소로 연결
