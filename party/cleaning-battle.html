<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="theme-color" content="#0d1018">
<title>청소내기 배틀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap">
<style>
:root{
  --bg:#0d1018; --panel:#161c2a; --panel2:#1e2637; --line:#2b3850; --text:#eef3ff; --dim:#94a3bd;
  --cyan:#46e0d0; --lime:#c9f24d; --gold:#ffc93c; --danger:#ff5470; --good:#66e39a; --violet:#9d7bff;
  --display:'Black Han Sans','Malgun Gothic',sans-serif;
  --body:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Segoe UI',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);overscroll-behavior:none;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
  background-image:radial-gradient(circle at 12% -5%,rgba(70,224,208,.10),transparent 42%),radial-gradient(circle at 92% 8%,rgba(157,123,255,.12),transparent 38%)}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px calc(env(safe-area-inset-bottom,0px) + 14px)}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:-.01em;margin:0}
button{font-family:inherit;font-size:16px;color:inherit;background:none;border:0;cursor:pointer}
input{font-family:inherit;font-size:17px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;border-radius:16px;
  background:linear-gradient(180deg,#3ee6d3,#1ab5a5);color:#04201d;font-weight:800;font-size:17px;
  box-shadow:0 6px 0 #0d6a60;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #0d6a60}
.btn.sub{background:linear-gradient(180deg,#2c3650,#212939);color:var(--text);box-shadow:0 5px 0 #141a27}
.btn.sub:active{box-shadow:0 1px 0 #141a27}
.btn.gold{background:linear-gradient(180deg,#ffd662,#f0a91b);color:#2b1c00;box-shadow:0 6px 0 #97640a}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--dim);min-height:44px;font-size:14px;box-shadow:none}
.btn[disabled]{opacity:.45;pointer-events:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px}
.muted{color:var(--dim);font-size:13px;line-height:1.6}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.center{text-align:center}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--cyan);
  border:1px solid rgba(70,224,208,.4);background:rgba(70,224,208,.08);border-radius:999px;padding:5px 10px}
.field{width:100%;background:#0b1018;border:1px solid var(--line);border-radius:14px;color:var(--text);padding:14px 15px;outline:none}
.field:focus{border-color:var(--cyan)}
.hide{display:none!important}
[hidden]{display:none!important}
.avatar{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:900;color:#08101c;font-size:16px;flex:0 0 auto}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:11px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:9px 12px}
.prow.me{border-color:var(--cyan);box-shadow:0 0 0 1px rgba(70,224,208,.25)}
.prow .nm{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .sc{font-weight:900;font-size:17px;font-variant-numeric:tabular-nums}
.pill{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;background:#0e1420;color:var(--dim);border:1px solid var(--line)}
.pill.up{color:var(--good);border-color:rgba(102,227,154,.4)}
.pill.down{color:var(--danger);border-color:rgba(255,84,112,.4)}
.pill.gold{color:var(--gold);border-color:rgba(255,201,60,.45)}
header.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px;min-height:34px}
.timebar{height:8px;border-radius:999px;background:#0b1018;border:1px solid var(--line);overflow:hidden}
.timebar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--lime));transition:width .2s linear}
#stage{flex:1;display:flex;flex-direction:column;min-height:0}
.big{font-family:var(--display);font-size:clamp(34px,11vw,52px);line-height:1.05}
.huge{font-family:var(--display);font-size:clamp(50px,19vw,92px);line-height:1;font-variant-numeric:tabular-nums}
.score-now{font-variant-numeric:tabular-nums;font-weight:900}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);
  background:#0b1018e6;border:1px solid var(--line);color:var(--text);padding:11px 16px;border-radius:999px;font-size:13px;z-index:50}
@keyframes pop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes fall{to{transform:translateY(120vh) rotate(720deg)}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.pop{animation:pop .3s ease-out both}
.shake{animation:shake .3s}
.pulse{animation:pulse 1.4s infinite}
/* 미니게임 공용 */
.play-area{flex:1;display:flex;flex-direction:column;gap:12px;min-height:0}
.panel-big{flex:1;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;border:1px solid var(--line);background:var(--panel);text-align:center;padding:18px;min-height:220px}
.grid{display:grid;gap:8px}
.tile{border-radius:14px;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center;
  font-weight:900;font-size:20px;aspect-ratio:1/1;transition:transform .08s,background .12s}
.tile:active{transform:scale(.95)}
.tile.done{background:#12271f;color:#3d6b57;border-color:#1c3a2c}
.pad{border-radius:18px;aspect-ratio:1/1;border:2px solid #0006;transition:filter .1s,transform .1s}
.pad.on{filter:brightness(2.1) saturate(1.3);transform:scale(.97)}
.track{position:relative;height:66px;border-radius:16px;background:#0b1018;border:1px solid var(--line);overflow:hidden}
.track .zone{position:absolute;top:0;bottom:0;left:calc(50% - 7%);width:14%;background:rgba(201,242,77,.16);border-left:1px dashed var(--lime);border-right:1px dashed var(--lime)}
.track .mark{position:absolute;top:6px;bottom:6px;width:10px;border-radius:6px;background:var(--cyan);box-shadow:0 0 14px var(--cyan)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{min-height:62px;border-radius:16px;background:var(--panel2);border:1px solid var(--line);font-size:22px;font-weight:800}
.cardpick{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:10px}
.facedown{aspect-ratio:3/4;border-radius:16px;border:1px solid #3a4d74;
  background:repeating-linear-gradient(45deg,#1b2740 0 7px,#141d31 7px 14px);display:grid;place-items:center;
  font-family:var(--display);font-size:26px;color:#5d76a8;transition:transform .1s}
.facedown:active{transform:translateY(-4px)}
.facedown.mine{border-color:var(--gold);box-shadow:0 0 0 2px rgba(255,201,60,.35)}
.facedown.taken{opacity:.35}
.reveal{aspect-ratio:3/4;border-radius:16px;display:grid;place-items:center;font-family:var(--display);font-size:24px}
.confetti{position:fixed;top:-20px;width:9px;height:14px;z-index:40;pointer-events:none}
ol.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.rank-n{font-family:var(--display);font-size:19px;width:26px;text-align:center;color:var(--dim)}
.rank-n.top{color:var(--gold)}
.loser-card{border-radius:20px;border:2px solid var(--danger);background:linear-gradient(180deg,#2a1020,#1a0b16);
  padding:16px;display:flex;align-items:center;gap:12px}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}
</style>
</head>
<body>
<div id="app">
  <header class="bar" id="topbar" hidden>
    <span class="tag" id="topRound">ROUND</span>
    <div class="grow"><div class="timebar"><i id="timeFill" style="width:100%"></i></div></div>
    <span class="pill" id="topScore">0점</span>
  </header>
  <div id="stage"></div>
</div>
<script>
(() => {
'use strict';
const API = '/.netlify/functions/party';
const LS = 'cleaning-battle-v1';
const $ = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; };
const stage = document.getElementById('stage');
const topbar = document.getElementById('topbar');
const topRound = document.getElementById('topRound');
const topScore = document.getElementById('topScore');
const timeFill = document.getElementById('timeFill');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = n => Math.floor(Math.random() * n);
const pick = arr => arr[rnd(arr.length)];

/* ---------- 게임 메타 (서버와 동일) ---------- */
const GAMES = {
  reaction:  { name: '반응 속도',    rule: '초록으로 바뀌면 바로 탭! 4번 평균 기록',          unit: 'ms',   low: true,  fmt: v => Math.round(v) + 'ms' },
  tap:       { name: '10초 연타',    rule: '10초 동안 최대한 많이 탭하기',                    unit: '회',   low: false, fmt: v => v + '회' },
  sequence:  { name: '1→16 순서',    rule: '숫자를 1부터 16까지 순서대로 터치',               unit: '초',   low: true,  fmt: v => v.toFixed(1) + '초' },
  memory:    { name: '기억력',       rule: '불이 들어온 순서 그대로 따라 누르기',             unit: '단계', low: false, fmt: v => v + '단계' },
  precision: { name: '정밀 정지',    rule: '움직이는 막대를 한가운데 멈추기 5회',             unit: '오차', low: true,  fmt: v => v.toFixed(0) + ' 오차' },
  odd:       { name: '다른 색 찾기', rule: '색이 다른 칸 찾기, 점점 어려워집니다',            unit: '단계', low: false, fmt: v => v + '단계' },
  timer:     { name: '5초 맞추기',   rule: '숫자를 가린 채 정확히 5.00초에 멈추기 3회',       unit: 'ms',   low: true,  fmt: v => Math.round(v) + 'ms' },
  math:      { name: '암산 배틀',    rule: '제한 시간 안에 계산 문제 많이 맞히기',            unit: '문제', low: false, fmt: v => v + '문제' },
  race:      { name: '카트 레이스',  rule: '좌우 탭으로 차선 변경 · 길게 눌렀다 떼면 부스트',  unit: '초',   low: true,
               fmt: v => v >= 200 ? '미완주 · 진행 ' + Math.round(300 - v) + '%' : v.toFixed(2) + '초' },
};
const TEAMS = { A: { name: '블루팀', color: '#5fa8ff' }, B: { name: '레드팀', color: '#ff5470' } };
const EVENTS = {
  card:   { name: '행운의 카드', rule: '카드를 한 장 고르세요', icon: '카드' },
  bomb:   { name: '폭탄 상자',   rule: '상자 하나를 고르세요. 폭탄은 딱 하나!', icon: '상자' },
  mercy:  { name: '자비의 여신', rule: '하위 두 명에게 동정 점수', icon: '자비' },
  swap:   { name: '운명 교환',   rule: '무작위 두 사람의 점수 교환', icon: '교환' },
  shield: { name: '면제권 추첨', rule: '한 명이 청소 면제권 획득', icon: '면제' },
};
const COLORS = ['#46e0d0', '#ffc93c', '#ff8fa3', '#9d7bff', '#c9f24d', '#5fa8ff', '#ff9f5a', '#6ee7b7', '#f472b6', '#facc15', '#38bdf8', '#fb7185', '#a3e635', '#e879f9'];
const colorOf = id => COLORS[[...String(id)].reduce((a, c) => a + c.charCodeAt(0), 0) % COLORS.length];
const isTeam = () => !!room && room.settings.mode === 'team';
function teamStats() {
  const out = { A: { ids: [], total: 0, avg: 0 }, B: { ids: [], total: 0, avg: 0 } };
  players().forEach(p => { if (p.team && out[p.team]) { out[p.team].ids.push(p.id); out[p.team].total += p.score || 0; } });
  ['A', 'B'].forEach(t => { out[t].avg = out[t].ids.length ? out[t].total / out[t].ids.length : 0; });
  return out;
}
function teamBoard() {
  const ts = teamStats();
  const box = $('div', 'card');
  box.style.padding = '12px';
  const row = $('div', 'row');
  ['A', 'B'].forEach((t, i) => {
    const side = $('div', 'grow center');
    const nm = $('div', ''); nm.style.cssText = `font-family:var(--display);font-size:20px;color:${TEAMS[t].color}`;
    nm.textContent = TEAMS[t].name + ` (${ts[t].ids.length}명)`;
    const av = $('div', ''); av.style.cssText = 'font-family:var(--display);font-size:30px;font-variant-numeric:tabular-nums';
    av.textContent = (Math.round(ts[t].avg * 10) / 10).toFixed(1);
    const sub = $('div', 'muted', `평균 · 합계 ${ts[t].total}점`);
    side.append(nm, av, sub);
    row.appendChild(side);
    if (i === 0) { const vs = $('div', 'muted', 'VS'); vs.style.padding = '0 6px'; row.appendChild(vs); }
  });
  box.appendChild(row);
  const lead = ts.A.avg === ts.B.avg ? '동점!' : `${TEAMS[ts.A.avg > ts.B.avg ? 'A' : 'B'].name} 리드`;
  const l = $('div', 'muted center', lead); l.style.marginTop = '6px';
  box.appendChild(l);
  return box;
}

/* ---------- 사운드 ---------- */
let AC = null, master = null;
function audio() {
  if (!AC) {
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return null;
    AC = new C(); master = AC.createGain(); master.gain.value = .35; master.connect(AC.destination);
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function beep(f1, f2, dur, type, vol) {
  if (!audio()) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(f1, t);
  if (f2 && f2 !== f1) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol || .3, t + .01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .02);
}
const SFX = {
  tick: () => beep(880, 880, .05, 'square', .18),
  go: () => beep(520, 1040, .18, 'square', .3),
  ok: () => beep(740, 1180, .1, 'square', .25),
  bad: () => beep(220, 90, .22, 'sawtooth', .3),
  tapb: () => beep(300 + rnd(120), 200, .04, 'square', .16),
  win: () => { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, f, .16, 'square', .26), i * 90)); },
  lose: () => { [392, 330, 262].forEach((f, i) => setTimeout(() => beep(f, f * .8, .3, 'triangle', .3), i * 180)); },
  roll: () => beep(160, 900, .5, 'sawtooth', .2),
};

/* ---------- 상태 ---------- */
let me = { code: null, pid: null, token: null, name: '' };
let room = null, skew = 0, poller = null, netFail = 0;
let mounted = { key: null, teardown: null };
let lastPhaseKey = '', wakeLock = null;

try { const s = JSON.parse(localStorage.getItem(LS) || '{}'); if (s && s.code) me = Object.assign(me, s); } catch (e) {}
const save = () => { try { localStorage.setItem(LS, JSON.stringify(me)); } catch (e) {} };
const serverNow = () => Date.now() + skew;
const remaining = () => room ? Math.max(0, room.until - serverNow()) : 0;
const players = () => (room ? room.order.map(id => room.players[id]).filter(Boolean) : []);
const myPlayer = () => (room && room.players[me.pid]) || null;
const isHost = () => !!me.token && !!myPlayer() && myPlayer().host;
const stepDef = () => (room && room.step >= 0 && room.plan[room.step]) || null;

function toast(msg, ms) {
  const t = $('div', 'toast', msg); document.body.appendChild(t);
  setTimeout(() => t.remove(), ms || 1800);
}
async function api(action, body, method) {
  const opt = { method: method || (body ? 'POST' : 'GET'), headers: { 'content-type': 'application/json' } };
  if (body) opt.body = JSON.stringify(body);
  const qs = action === 'state' ? `&code=${encodeURIComponent(me.code)}&pid=${encodeURIComponent(me.pid || '')}` : '';
  const res = await fetch(`${API}?a=${action}${qs}`, opt);
  const data = await res.json().catch(() => ({ error: 'bad_json' }));
  if (!res.ok) throw Object.assign(new Error(data.error || 'error'), { code: data.error });
  return data;
}
function applyRoom(data) {
  if (!data || !data.room) return;
  room = data.room;
  skew = room.now - Date.now();
  netFail = 0;
  render();
}
async function poll() {
  if (!me.code || !me.pid) return;
  try { applyRoom(await api('state')); }
  catch (e) {
    if (e.code === 'no_room') { leaveLocal('방이 사라졌어요. 다시 만들어 주세요.'); return; }
    netFail++;
    if (netFail === 4) toast('연결이 불안정합니다…');
  }
}
function startPolling() {
  clearInterval(poller);
  poller = setInterval(poll, 1100);
  poll();
}
function leaveLocal(msg) {
  clearInterval(poller); poller = null;
  me = { code: null, pid: null, token: null, name: me.name };
  room = null; save();
  lastPhaseKey = ''; teardown();
  renderHome(msg);
}
async function keepAwake() {
  try { if ('wakeLock' in navigator && !wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) { keepAwake(); poll(); } });

/* ---------- 화면: 홈 ---------- */
function renderHome(msg) {
  topbar.hidden = true;
  stage.replaceChildren();
  const wrap = $('div');
  wrap.style.cssText = 'display:flex;flex-direction:column;gap:14px;padding-top:6px';
  const hero = $('div', 'center');
  hero.style.padding = '18px 0 6px';
  const t = $('h1', 'big'); t.innerHTML = '청소내기<br><span style="color:var(--cyan)">배틀</span>';
  hero.appendChild(t);
  hero.appendChild($('p', 'muted', '미니게임 + 운빨 이벤트로 30분. 꼴찌 두 명이 청소합니다.'));
  wrap.appendChild(hero);

  if (msg) { const m = $('div', 'card', msg); m.style.borderColor = 'var(--danger)'; wrap.appendChild(m); }

  const card = $('div', 'card');
  card.style.cssText = 'display:flex;flex-direction:column;gap:12px';
  const nameIn = $('input', 'field'); nameIn.placeholder = '이름 (최대 10자)'; nameIn.maxLength = 10; nameIn.value = me.name || '';
  nameIn.id = 'nameInput';
  card.appendChild(nameIn);
  const mk = $('button', 'btn', '방 만들기 (호스트)');
  const joinRow = $('div', 'row');
  const codeIn = $('input', 'field'); codeIn.placeholder = '방 코드 4자리'; codeIn.maxLength = 4; codeIn.id = 'codeInput';
  codeIn.style.textTransform = 'uppercase'; codeIn.autocapitalize = 'characters';
  const jn = $('button', 'btn sub', '참가'); jn.style.minWidth = '96px';
  joinRow.append(codeIn, jn);
  card.append(mk, joinRow);
  wrap.appendChild(card);

  const how = $('div', 'card');
  how.append($('h3', '', '어떻게 하나요'), (() => {
    const ul = $('div', 'muted');
    ul.style.marginTop = '8px';
    ul.innerHTML = [
      '① 한 명이 <b>방 만들기</b> → 나오는 <b>4자리 코드</b>를 단톡방에 공유',
      '② 나머지는 같은 주소에서 코드로 <b>참가</b> (7명까지 넉넉)',
      '③ 미니게임 순위로 점수를 쌓고, 중간중간 카드·폭탄 이벤트로 뒤집기',
      '④ 개인전은 <b>최하위 2명</b>, 팀전은 <b>진 팀 전원</b>이 청소 당첨',
      '⑤ 카트 레이스는 첫 판·중반·마지막(점수 2배)에 들어갑니다',
    ].join('<br>');
    return ul;
  })());
  wrap.appendChild(how);
  stage.appendChild(wrap);

  const go = async (kind) => {
    audio();
    const name = nameIn.value.trim();
    if (!name) { nameIn.focus(); toast('이름을 입력해 주세요'); return; }
    me.name = name; save();
    mk.disabled = jn.disabled = true;
    try {
      if (kind === 'create') {
        const d = await api('create', { name });
        me.code = d.code; me.pid = d.playerId; me.token = d.token; save();
        applyRoom(d); startPolling(); keepAwake();
      } else {
        const code = codeIn.value.trim().toUpperCase();
        if (!/^[A-Z0-9]{4}$/.test(code)) { toast('코드 4자리를 확인해 주세요'); mk.disabled = jn.disabled = false; return; }
        const d = await api('join', { code, name });

}

function mountPlay() {
  const step = stepDef(); if (!step) return;
  if (step.k === 'event') return mountEvent(step);
  const wrap = $('div', 'play-area');
  stage.appendChild(wrap);
  const state = { value: null, done: false, sent: null, sentAt: 0, p: 0 };
  const submit = (value, done, prog) => {
    state.value = value;
    if (Number.isFinite(prog)) state.p = prog;
    if (done) state.done = true;
    const now = Date.now();
    const gap = step.id === 'race' ? 1200 : 2200;
    if (!done && (now - state.sentAt < gap || (state.sent === value && !Number.isFinite(prog)))) return;
    state.sent = value; state.sentAt = now;
    api('submit', { code: me.code, playerId: me.pid, step: room.step, value, done: !!done, p: state.p }).then(applyRoom).catch(() => {});
  };
  const ctx = { submit, remaining, el: wrap, step: room.step };
  const game = GAME_IMPL[step.id](ctx);
  mounted.teardown = () => {
    if (!state.done && state.value !== null) {
      api('submit', { code: me.code, playerId: me.pid, step: ctx.step, value: state.value, done: true, p: state.p }).then(applyRoom).catch(() => {});
    }
    if (game && game.stop) try { game.stop(); } catch (e) {}
  };
}

/* 미니게임 구현 */
const GAME_IMPL = {
  reaction(ctx) {
    const TRIALS = 4;
    let times = [], armed = false, goAt = 0, timer = null, trial = 0, dead = false;
    const panel = $('div', 'panel-big');
    const head = $('div', 'tag', '준비');
    const label = $('div', 'big', '초록을 기다리세요');
    const sub = $('div', 'muted', `${TRIALS}번 중 1번째`);
    panel.append(head, label, sub);
    ctx.el.append(panel, $('div', 'muted center', '빨간 화면에서 누르면 벌점 +250ms'));
    const setBg = c => { panel.style.background = c; };
    const next = () => {
      if (dead || trial >= TRIALS) return;
      armed = false; setBg('#3a1420'); label.textContent = '기다려…'; head.textContent = '준비';
      timer = setTimeout(() => { armed = true; goAt = performance.now(); setBg('#10432c'); label.textContent = '지금!'; head.textContent = '탭!'; SFX.go(); }, 900 + Math.random() * 2600);
    };
    panel.onpointerdown = () => {
      if (dead) return;
      if (!armed) {
        clearTimeout(timer); times.push(650); SFX.bad(); label.textContent = '너무 빨라요 (+벌점)';
        trial++; sub.textContent = `${TRIALS}번 중 ${Math.min(trial + 1, TRIALS)}번째`;
        setTimeout(finishOrNext, 700); return;
      }
      const dt = performance.now() - goAt; times.push(dt); SFX.ok();
      trial++; label.textContent = Math.round(dt) + 'ms';
      sub.textContent = `${TRIALS}번 중 ${Math.min(trial + 1, TRIALS)}번째`;
      setBg('#15263c');
      setTimeout(finishOrNext, 650);
    };
    function avg() { return times.reduce((a, b) => a + b, 0) / times.length; }
    function finishOrNext() {
      if (dead) return;
      if (trial >= TRIALS) {
        dead = true; setBg('#15263c'); head.textContent = '완료';
        label.textContent = Math.round(avg()) + 'ms';
        sub.textContent = '다른 사람을 기다리는 중…';
        ctx.submit(Math.round(avg()), true);
      } else { ctx.submit(Math.round(avg()), false); next(); }
    }
    next();
    return { stop: () => { dead = true; clearTimeout(timer); } };
  },

  tap(ctx) {
    let count = 0, started = false, raf = null;
    const panel = $('div', 'panel-big');
    const head = $('div', 'tag', '준비');
    const num = $('div', 'huge', '3');
    const sub = $('div', 'muted', '카운트다운 후 시작');
    panel.append(head, num, sub);
    ctx.el.appendChild(panel);
    const startAt = Date.now() + 3000;
    panel.onpointerdown = () => {
      if (!started) return;
      count++; num.textContent = count; SFX.tapb();
      panel.style.background = count % 2 ? '#1b2f4a' : '#16202f';
      ctx.submit(count, false);
    };
    const loop = () => {
      const left = startAt - Date.now();
      if (left > 0) { const s = Math.ceil(left / 1000); if (num.textContent !== String(s)) { num.textContent = s; SFX.tick(); } }
      else if (!started) { started = true; count = 0; num.textContent = '0'; head.textContent = '연타!'; sub.textContent = '화면 아무 데나 빠르게'; panel.style.borderColor = 'var(--lime)'; SFX.go(); }
      else { sub.textContent = Math.max(0, Math.ceil(ctx.remaining() / 1000)) + '초 남음'; }
      raf = requestAnimationFrame(loop);
    };
    loop();
    return { stop: () => { cancelAnimationFrame(raf); ctx.submit(count, true); } };
  },

  sequence(ctx) {
    const N = 16;
    let next = 1, penalty = 0, start = Date.now(), done = false;
    const panel = $('div');
    panel.style.cssText = 'display:flex;flex-direction:column;gap:12px;flex:1';
    const info = $('div', 'row');
    const target = $('div', 'tag', '다음: 1');
    const el = $('div', 'muted grow center', '순서대로 터치');
    info.append(target, el);
    const grid = $('div', 'grid'); grid.style.gridTemplateColumns = 'repeat(4,1fr)'; grid.style.flex = '1';
    const nums = []; for (let i = 1; i <= N; i++) nums.push(i);
    for (let i = nums.length - 1; i > 0; i--) { const j = rnd(i + 1); const t = nums[i]; nums[i] = nums[j]; nums[j] = t; }
    nums.forEach(n => {
      const b = $('button', 'tile', String(n));
      b.onclick = () => {
        if (done) return;
        if (n === next) {
          b.classList.add('done'); b.disabled = true; next++; SFX.ok();
          target.textContent = '다음: ' + Math.min(next, N);
          if (next > N) {
            done = true;
            const v = (Date.now() - start + penalty) / 1000;
            target.textContent = '완료'; el.textContent = v.toFixed(1) + '초 · 대기 중';
            ctx.submit(Number(v.toFixed(2)), true);
          } else ctx.submit(estimate(), false);
        } else {
          penalty += 1500; SFX.bad(); b.classList.add('shake');
          setTimeout(() => b.classList.remove('shake'), 300);
          el.textContent = '틀림! +1.5초';
        }
      };
      grid.appendChild(b);
    });
    function estimate() { return Number(((Date.now() - start + penalty) / 1000 + (N - next + 1) * 1.2).toFixed(2)); }
    panel.append(info, grid);
    ctx.el.appendChild(panel);
    return { stop: () => { if (!done) ctx.submit(Number((60 + (N - next + 1) * 2).toFixed(2)), true); } };
  },

  memory(ctx) {
    const PADS = ['#ff5470', '#46e0d0', '#ffc93c', '#9d7bff'];
    let level = 1, seq = [], input = 0, showing = false, dead = false, timers = [];
    const head = $('div', 'tag', '단계 1');
    const msg = $('div', 'muted center', '순서를 잘 보세요');
    const grid = $('div', 'grid'); grid.style.cssText = 'grid-template-columns:1fr 1fr;flex:1';
    const pads = PADS.map((c, i) => {
      const p = $('button', 'pad'); p.style.background = c;
      p.onclick = () => tapPad(i, p);
      grid.appendChild(p); return p;
    });
    const wrap = $('div'); wrap.style.cssText = 'display:flex;flex-direction:column;gap:12px;flex:1';
    wrap.append(head, grid, msg);
    ctx.el.appendChild(wrap);
    const flash = (i, ms) => { pads[i].classList.add('on'); beep(320 + i * 120, 320 + i * 120, .12, 'square', .22); timers.push(setTimeout(() => pads[i].classList.remove('on'), ms)); };
    function show() {
      showing = true; input = 0; msg.textContent = '순서를 잘 보세요';
      seq.push(rnd(4));
      seq.forEach((v, i) => timers.push(setTimeout(() => flash(v, 320), 500 + i * 560)));
      timers.push(setTimeout(() => { showing = false; msg.textContent = '이제 따라 하세요'; }, 500 + seq.length * 560));
    }
    function tapPad(i, p) {
      if (showing || dead) return;
      flash(i, 140);
      if (seq[input] === i) {
        input++;
        if (input === seq.length) {
          level++; head.textContent = '단계 ' + level; SFX.ok();
          ctx.submit(level - 1, false);
          timers.push(setTimeout(show, 700));
        }
      } else {
        dead = true; SFX.bad(); msg.textContent = `끝! ${level - 1}단계 · 대기 중`;
        head.textContent = '기록 ' + (level - 1) + '단계';
        ctx.submit(level - 1, true);
      }
    }
    show();
    return { stop: () => { dead = true; timers.forEach(clearTimeout); if (!dead) ctx.submit(level - 1, true); } };
  },

  precision(ctx) {
    const ROUNDS = 5;
    let round = 0, err = 0, pos = 0, dir = 1, speed = 0.9, raf = null, done = false;
    const head = $('div', 'tag', '1 / ' + ROUNDS);
    const msg = $('div', 'muted center', '한가운데에서 탭!');
    const track = $('div', 'track');
    const zone = $('div', 'zone'), mark = $('div', 'mark');
    track.append(zone, mark);
    const btn = $('button', 'btn', '멈추기');
    const errEl = $('div', 'center'); errEl.style.cssText = 'font-family:var(--display);font-size:38px;color:var(--lime)';
    errEl.textContent = '0';
    const wrap = $('div'); wrap.style.cssText = 'display:flex;flex-direction:column;gap:14px;flex:1;justify-content:center';
    wrap.append(head, errEl, track, btn, msg);
    ctx.el.appendChild(wrap);
    const loop = () => {
      pos += dir * speed;
      if (pos > 100) { pos = 100; dir = -1; } if (pos < 0) { pos = 0; dir = 1; }
      mark.style.left = `calc(${pos}% - 5px)`;
      raf = requestAnimationFrame(loop);
    };
    loop();
    btn.onclick = () => {
      if (done) return;
      const e = Math.abs(pos - 50);
      err += e; round++;
      if (e < 3) SFX.ok(); else SFX.tapb();
      errEl.textContent = Math.round(err);
      head.textContent = Math.min(round + 1, ROUNDS) + ' / ' + ROUNDS;
      msg.textContent = e < 3 ? '완벽!' : e < 10 ? '아쉽다' : '많이 벗어났어요';
      speed += 0.45;
      if (round >= ROUNDS) {
        done = true; cancelAnimationFrame(raf); btn.disabled = true;
        msg.textContent = '기록 ' + Math.round(err) + ' · 대기 중';
        ctx.submit(Math.round(err), true);
      } else ctx.submit(Math.round(err + (ROUNDS - round) * 12), false);
    };
    return { stop: () => { cancelAnimationFrame(raf); if (!done) ctx.submit(Math.round(err + (ROUNDS - round) * 40), true); } };
  },

  odd(ctx) {
    let level = 1, lock = false;
    const head = $('div', 'tag', '단계 1');
    const msg = $('div', 'muted center', '색이 다른 칸을 찾으세요');
    const grid = $('div', 'grid'); grid.style.flex = '1';
    const wrap = $('div'); wrap.style.cssText = 'display:flex;flex-direction:column;gap:12px;flex:1';
    wrap.append(head, grid, msg);
    ctx.el.appendChild(wrap);
    function build() {
      const n = Math.min(6, 2 + Math.floor(level / 2));
      const hue = rnd(360), sat = 55 + rnd(20), light = 45 + rnd(12);
      const diff = Math.max(3.5, 20 - level * 1.1);
      grid.style.gridTemplateColumns = `repeat(${n},1fr)`;
      grid.replaceChildren();
      const target = rnd(n * n);
      for (let i = 0; i < n * n; i++) {
        const b = $('button', 'tile');
        b.style.background = `hsl(${hue} ${sat}% ${light + (i === target ? diff : 0)}%)`;
        b.style.border = 'none';
        b.onclick = () => {
          if (lock) return;
          if (i === target) { level++; head.textContent = '단계 ' + level; SFX.ok(); ctx.submit(level - 1, false); build(); }
          else {
            lock = true; SFX.bad(); msg.textContent = '틀렸어요! 1초 대기';
            grid.classList.add('shake');
            setTimeout(() => { lock = false; grid.classList.remove('shake'); msg.textContent = '색이 다른 칸을 찾으세요'; }, 1000);
          }
        };
        grid.appendChild(b);
      }
    }
    build();
    return { stop: () => ctx.submit(level - 1, true) };
  },

  timer(ctx) {
    const TRIES = 3;
    let tries = 0, err = 0, running = false, t0 = 0, done = false;
    const head = $('div', 'tag', '1 / ' + TRIES);
    const big = $('div', 'huge', '5.00');
    const msg = $('div', 'muted center', '시작을 누르고 5.00초에 멈추기');
    const btn = $('button', 'btn gold', '시작');
    const wrap = $('div'); wrap.style.cssText = 'display:flex;flex-direction:column;gap:14px;flex:1;justify-content:center';
    wrap.append(head, big, btn, msg);
    ctx.el.appendChild(wrap);
    btn.onclick = () => {
      if (done) return;
      if (!running) {
        running = true; t0 = performance.now(); big.textContent = '· · ·'; big.style.color = 'var(--dim)';
        btn.textContent = '멈추기'; btn.className = 'btn'; msg.textContent = '마음속으로 5초…'; SFX.tick();
      } else {
        running = false;
        const el = performance.now() - t0, e = Math.abs(el - 5000);
        err += e; tries++;
        big.textContent = (el / 1000).toFixed(2); big.style.color = e < 150 ? 'var(--good)' : e < 500 ? 'var(--gold)' : 'var(--danger)';
        msg.textContent = `오차 ${Math.round(e)}ms · 누적 ${Math.round(err)}ms`;
        if (e < 150) SFX.ok(); else SFX.tapb();
        head.textContent = Math.min(tries + 1, TRIES) + ' / ' + TRIES;
        if (tries >= TRIES) {
          done = true; btn.disabled = true; msg.textContent = `기록 ${Math.round(err)}ms · 대기 중`;
          ctx.submit(Math.round(err), true);
        } else { btn.textContent = '시작'; btn.className = 'btn gold'; ctx.submit(Math.round(err + (TRIES - tries) * 800), false); }
      }
    };
    return { stop: () => { if (!done) ctx.submit(Math.round(err + (TRIES - tries) * 2500), true); } };
  },

  math(ctx) {
    let correct = 0, lock = false, cur = null;
    const head = $('div', 'tag', '0문제');
    const q = $('div', 'huge', '');
    const msg = $('div', 'muted center', '정답을 고르세요');
    const box = $('div', 'choices');
    const wrap = $('div'); wrap.style.cssText = 'display:flex;flex-direction:column;gap:14px;flex:1;justify-content:center';
    wrap.append(head, q, box, msg);
    ctx.el.appendChild(wrap);
    function make() {
      const lvl = Math.min(4, 1 + Math.floor(correct / 4));
      let a, b, op, ans;
      if (lvl === 1) { a = 2 + rnd(18); b = 2 + rnd(18); op = '+'; ans = a + b; }
      else if (lvl === 2) { a = 12 + rnd(60); b = 3 + rnd(30); op = Math.random() < .5 ? '+' : '−'; ans = op === '+' ? a + b : a - b; }
      else if (lvl === 3) { a = 3 + rnd(9); b = 3 + rnd(9); op = '×'; ans = a * b; }
      else { a = 11 + rnd(30); b = 3 + rnd(7); op = '×'; ans = a * b; }
      cur = ans;
      q.textContent = `${a} ${op} ${b}`;
      const opts = new Set([ans]);
      while (opts.size < 4) {
        const d = ans + (rnd(2) ? 1 : -1) * (1 + rnd(Math.max(3, Math.round(Math.abs(ans) * .18))));
        if (d !== ans) opts.add(d);
      }
      const arr = [...opts]; for (let i = arr.length - 1; i > 0; i--) { const j = rnd(i + 1); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; }
      box.replaceChildren();
      arr.forEach(v => {
        const b2 = $('button', 'choice', String(v));
        b2.onclick = () => {
          if (lock) return;
          if (v === cur) { correct++; head.textContent = correct + '문제'; SFX.ok(); ctx.submit(correct, false); make(); }
          else {
            lock = true; SFX.bad(); b2.style.background = '#3a1220'; msg.textContent = '땡! 1.2초 대기';
            setTimeout(() => { lock = false; msg.textContent = '정답을 고르세요'; make(); }, 1200);
          }
        };
        box.appendChild(b2);
      });
    }
    make();
    return { stop: () => ctx.submit(correct, true) };
  },

  race(ctx) {
    const LEN = 1500;                       // 트랙 길이(m)
    const LANES = 3;
    const wrap = $('div'); wrap.style.cssText = 'display:flex;flex-direction:column;gap:8px;flex:1;min-height:0';
    const info = $('div', 'row');
    const posEl = $('div', 'tag', '준비');
    const distEl = $('div', 'muted grow center', '0 m');
    const spdEl = $('div', 'pill', '0 km/h');
    info.append(posEl, distEl, spdEl);
    const holder = $('div'); holder.style.cssText = 'position:relative;flex:1;min-height:260px;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:#0a0f18;touch-action:none';
    const cv = document.createElement('canvas');
    cv.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;display:block';
    holder.appendChild(cv);
    const hint = $('div', 'muted center', '좌우 탭 = 차선 이동 · 꾹 눌렀다 떼기 = 드리프트 부스트');
    wrap.append(info, holder, hint);
    ctx.el.appendChild(wrap);
    const g = cv.getContext('2d');

    // 모두 같은 코스: 방 코드 + 라운드로 시드 고정
    const seedStr = (me.code || 'RACE') + ':' + ctx.step;
    let h = 2166136261;
    for (const ch of seedStr) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
    let seed = h >>> 0;
    const rand = () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    const items = [];
    for (let d = 140; d < LEN - 60; d += 42 + rand() * 46) {
      const kind = rand() < 0.68 ? 'rock' : 'boost';
      const lane = Math.floor(rand() * LANES);
      items.push({ d, lane, kind, hit: false });
      if (kind === 'rock' && rand() < 0.35) {
        const l2 = (lane + 1 + Math.floor(rand() * (LANES - 1))) % LANES;
        items.push({ d: d + 6, lane: l2, kind: 'rock', hit: false });
      }
    }

    const car = { d: 0, lane: 1, x: 1, v: 16, boost: 0, slow: 0, spin: 0 };
    let started = false, finished = false, finishT = 0, startT = 0, raf = null, last = 0;
    let holdSide = 0, holdAt = 0, charge = 0, overheat = 0;
    const startAt = Date.now() + 2600;

    const down = e => {
      e.preventDefault();
      const r = holder.getBoundingClientRect();
      holdSide = (e.clientX - r.left) < r.width / 2 ? -1 : 1;
      holdAt = performance.now();
    };
    const up = e => {
      e.preventDefault();
      if (!holdAt) return;
      const dt = performance.now() - holdAt;
      holdAt = 0;
      if (!started || finished) return;
      if (dt < 230) {
        car.lane = clamp(car.lane + holdSide, 0, LANES - 1);
        SFX.tapb();
      } else if (charge >= 0.55) {
        if (charge > 2.4) { overheat = 1.4; car.v = Math.min(car.v, 11); SFX.bad(); }
        else { car.boost = Math.min(2.1, 0.75 + charge * 0.75); SFX.go(); }
      }
      charge = 0;
    };
    holder.addEventListener('pointerdown', down);
    holder.addEventListener('pointerup', up);
    holder.addEventListener('pointercancel', () => { holdAt = 0; charge = 0; });

    const rivals = () => {
      const subs = (room.subs && room.subs[ctx.step]) || {};
      return players().map(p => ({
        id: p.id, name: p.name, me: p.id === me.pid, team: p.team,
        p: p.id === me.pid ? car.d / LEN : clamp((subs[p.id] && subs[p.id].p) || 0, 0, 1),
      })).sort((a, b) => b.p - a.p);
    };

    function step(now) {
      const dt = Math.min(0.05, (now - last) / 1000 || 0); last = now;
      const w = holder.clientWidth, hgt = holder.clientHeight;
      if (cv.width !== w * 2 || cv.height !== hgt * 2) { cv.width = w * 2; cv.height = hgt * 2; }
      g.setTransform(2, 0, 0, 2, 0, 0);
      const pre = startAt - Date.now();
      if (!started && pre <= 0) { started = true; startT = performance.now(); SFX.go(); }
      if (started && !finished) {
        if (holdAt) charge += dt;
        if (overheat > 0) overheat -= dt;
        const target = overheat > 0 ? 9 : (holdAt && charge > 0.2 ? 15 : 24);
        car.v += (target - car.v) * Math.min(1, dt * 1.8);
        if (car.boost > 0) { car.boost -= dt; car.v = Math.max(car.v, 38); }
        if (car.slow > 0) { car.slow -= dt; car.v = Math.min(car.v, 8); }
        car.d += car.v * dt;
        car.x += (car.lane - car.x) * Math.min(1, dt * 9);
        for (const it of items) {
          if (it.hit || Math.abs(it.d - car.d) > 2.2) continue;
          if (Math.abs(it.lane - car.x) < 0.45) {
            it.hit = true;
            if (it.kind === 'rock') { car.slow = 0.85; car.spin = 0.5; SFX.bad(); }
            else { car.boost = Math.max(car.boost, 1.1); SFX.ok(); }
          }
        }
        if (car.spin > 0) car.spin -= dt;
        if (car.d >= LEN) {
          finished = true; finishT = (performance.now() - startT) / 1000;
          ctx.submit(Number(finishT.toFixed(2)), true, 1);
          SFX.win();
        } else {
          ctx.submit(Number((200 + (1 - car.d / LEN) * 100).toFixed(2)), false, car.d / LEN);
        }
      }
      // 그리기
      g.fillStyle = '#080d15'; g.fillRect(0, 0, w, hgt);
      const roadW = Math.min(w * 0.72, 300), x0 = (w - roadW) / 2, laneW = roadW / LANES;
      g.fillStyle = '#131c2b'; g.fillRect(x0, 0, roadW, hgt);
      g.fillStyle = '#1d2a3f';
      g.fillRect(x0 - 8, 0, 8, hgt); g.fillRect(x0 + roadW, 0, 8, hgt);
      const scroll = (car.d * 12) % 60;
      g.strokeStyle = '#2c3d59'; g.lineWidth = 3; g.setLineDash([26, 26]);
      for (let l = 1; l < LANES; l++) {
        g.beginPath(); g.moveTo(x0 + laneW * l, -60 + scroll); g.lineTo(x0 + laneW * l, hgt); g.stroke();
      }
      g.setLineDash([]);
      const carY = hgt - 86, mPerPx = 0.11;
      // 결승선
      const flY = carY - (LEN - car.d) / mPerPx;
      if (flY > -30) {
        for (let i = 0; i < LANES * 3; i++) {
          g.fillStyle = i % 2 ? '#fff' : '#111';
          g.fillRect(x0 + i * (roadW / (LANES * 3)), flY, roadW / (LANES * 3), 14);
        }
      }
      for (const it of items) {
        const y = carY - (it.d - car.d) / mPerPx;
        if (y < -40 || y > hgt + 40) continue;
        const cx = x0 + laneW * (it.lane + 0.5);
        if (it.kind === 'rock') {
          g.fillStyle = it.hit ? '#3b2a33' : '#ff5470';
          g.beginPath(); g.ellipse(cx, y, 20, 11, 0, 0, 7); g.fill();
          g.fillStyle = it.hit ? '#241b21' : '#7a1b2c'; g.fillRect(cx - 12, y - 3, 24, 6);
        } else {
          g.fillStyle = it.hit ? '#243a33' : '#c9f24d';
          g.beginPath(); g.moveTo(cx - 16, y + 9); g.lineTo(cx, y - 10); g.lineTo(cx + 16, y + 9); g.closePath(); g.fill();
        }
      }
      // 내 카트
      const cx = x0 + laneW * (car.x + 0.5);
      g.save(); g.translate(cx, carY); g.rotate((car.lane - car.x) * 0.35 + (car.spin > 0 ? Math.sin(now / 40) * 0.5 : 0));
      if (car.boost > 0) {
        g.fillStyle = 'rgba(255,201,60,.85)';
        g.beginPath(); g.moveTo(-9, 16); g.lineTo(0, 30 + Math.random() * 16); g.lineTo(9, 16); g.closePath(); g.fill();
      }
      g.fillStyle = colorOf(me.pid);
      g.fillRect(-15, -20, 30, 38);
      g.fillStyle = '#0b1018'; g.fillRect(-11, -12, 22, 13);
      g.fillStyle = '#05070c'; g.fillRect(-19, -16, 6, 12); g.fillRect(13, -16, 6, 12);
      g.fillRect(-19, 6, 6, 12); g.fillRect(13, 6, 6, 12);
      g.restore();
      // 드리프트 게이지
      if (holdAt && charge > 0.18) {
        const cwv = clamp(charge / 2.4, 0, 1);
        g.fillStyle = 'rgba(0,0,0,.45)'; g.fillRect(x0, hgt - 22, roadW, 10);
        g.fillStyle = charge > 2.4 ? '#ff5470' : charge > 0.55 ? '#c9f24d' : '#46e0d0';
        g.fillRect(x0, hgt - 22, roadW * cwv, 10);
      }
      // 옆줄: 실시간 순위
      const rs = rivals();
      const barX = w - 16;
      g.fillStyle = '#16202f'; g.fillRect(barX - 4, 14, 8, hgt - 60);
      rs.forEach(r => {
        const y = (hgt - 60) - r.p * (hgt - 74) + 14;
        g.fillStyle = r.team ? TEAMS[r.team].color : colorOf(r.id);
        g.beginPath(); g.arc(barX, y, r.me ? 8 : 5.5, 0, 7); g.fill();
        if (r.me) { g.strokeStyle = '#fff'; g.lineWidth = 2; g.stroke(); }
      });
      // 카운트다운 / 완주
      if (!started) {
        g.fillStyle = 'rgba(5,8,14,.72)'; g.fillRect(0, 0, w, hgt);
        g.fillStyle = '#c9f24d'; g.textAlign = 'center';
        g.font = '900 72px var(--display), sans-serif';
        const n = Math.ceil(pre / 1000);
        g.fillText(n > 0 ? String(n) : 'GO!', w / 2, hgt / 2 + 20);
      } else if (finished) {
        g.fillStyle = 'rgba(5,8,14,.7)'; g.fillRect(0, 0, w, hgt);
        g.fillStyle = '#46e0d0'; g.textAlign = 'center'; g.font = '900 44px var(--display), sans-serif';
        g.fillText(finishT.toFixed(2) + '초', w / 2, hgt / 2);
        g.fillStyle = '#94a3bd'; g.font = '600 15px sans-serif';
        g.fillText('완주! 다른 사람을 기다리는 중', w / 2, hgt / 2 + 30);
      }
      const myPos = rs.findIndex(r => r.me) + 1;
      posEl.textContent = finished ? '완주' : started ? myPos + '위' : '준비';
      distEl.textContent = Math.min(LEN, Math.round(car.d)) + ' / ' + LEN + ' m';
      spdEl.textContent = Math.round(car.v * 3.6 * 1.6) + ' km/h';
      raf = requestAnimationFrame(step);
    }
    raf = requestAnimationFrame(step);
    return {
      stop: () => {
        cancelAnimationFrame(raf);
        holder.removeEventListener('pointerdown', down);
        holder.removeEventListener('pointerup', up);
        if (!finished) ctx.submit(Number((200 + (1 - car.d / LEN) * 100).toFixed(2)), true, car.d / LEN);
      },
    };
  },
};

/* ---------- 이벤트 ---------- */
function mountEvent(step) {
  const ev = EVENTS[step.id];
  const wrap = $('div', 'play-area');
  const head = $('div', 'panel-big');
  head.style.minHeight = '150px';
  const h = $('h2', 'big', ev.name); h.style.color = 'var(--gold)';
  head.append($('div', 'tag', '운명의 이벤트'), h, $('div', 'muted', ev.rule));
  wrap.appendChild(head);
  stage.appendChild(wrap);

  if (step.id === 'card' || step.id === 'bomb') {
    const n = Math.max(3, players().length);
    const grid = $('div', 'cardpick');
    const status = $('div', 'muted center', '하나를 고르세요');
    wrap.append(grid, status);
    const draw = () => {
      const taken = (room.picks && room.picks[room.step]) || {};
      const mySlot = taken[me.pid];
      grid.replaceChildren();
      for (let i = 0; i < n; i++) {
        const c = $('div', 'facedown', step.id === 'bomb' ? '?' : '카드');
        const owner = Object.keys(taken).find(k => taken[k] === i);
        if (owner) { c.classList.add('taken'); if (owner === me.pid) { c.classList.add('mine'); c.classList.remove('taken'); c.textContent = '내 것'; } }
        if (!owner && mySlot === undefined) {
          c.onclick = async () => {
            SFX.tapb();
            try { applyRoom(await api('pick', { code: me.code, playerId: me.pid, step: room.step, slot: i })); }
            catch (e) { toast(e.code === 'taken' ? '이미 누가 가져갔어요' : '조금 늦었어요'); poll(); }
          };
        }
        grid.appendChild(c);
      }
      const picked = Object.keys(taken).length;
      status.textContent = mySlot === undefined
        ? `하나를 고르세요 · ${picked}/${players().length}명 선택`
        : `선택 완료! 결과를 기다리는 중 (${picked}/${players().length})`;
    };
    draw();
    mounted.update = draw;
  } else {
    const spin = $('div', 'panel-big');
    const big = $('div', 'huge', '?');
    big.style.color = 'var(--violet)';
    spin.append(big, $('div', 'muted', '잠시 후 결과가 공개됩니다'));
    wrap.appendChild(spin);
    let i = 0;
    const t = setInterval(() => {
      const ps = players();
      if (!ps.length) return;
      big.textContent = ps[i++ % ps.length].name;
      SFX.tick();
    }, 220);
    SFX.roll();
    mounted.teardown = () => clearInterval(t);
  }
}

/* ---------- 라운드 결과 ---------- */
function mountResult() {
  const step = stepDef(); if (!step) return;
  const rows = room.results[room.step] || [];
  const wrap = $('div', 'play-area');
  const head = $('div', 'card center');
  const meta = step.k === 'game' ? GAMES[step.id] : EVENTS[step.id];
  head.append($('div', 'tag', step.k === 'game' ? '라운드 결과' : '이벤트 결과'));
  const h = $('h2', 'big', meta.name); h.style.marginTop = '4px';
  head.appendChild(h);
  const mine = rows.find(r => r.id === me.pid);
  if (mine) {
    const my = $('div', ''); my.style.cssText = 'margin-top:6px;font-weight:800;font-size:18px';
    if (step.k === 'game') {
      my.innerHTML = mine.missed ? '<span style="color:var(--danger)">기록 없음</span>'
        : `내 기록 <span style="color:var(--cyan)">${GAMES[step.id].fmt(mine.v)}</span> · ${mine.rank}등 <span style="color:var(--lime)">+${mine.pts}점</span>`;
      if (mine.rank === 1) SFX.win(); else if (mine.missed) SFX.bad();
    } else {
      const d = mine.pts;
      my.innerHTML = `${mine.label} · <span style="color:${d > 0 ? 'var(--good)' : d < 0 ? 'var(--danger)' : 'var(--dim)'}">${d > 0 ? '+' : ''}${d}점</span>`;
      if (d > 0) SFX.win(); else if (d < 0) SFX.lose();
    }
    head.appendChild(my);
  }
  wrap.appendChild(head);

  if (isTeam()) wrap.appendChild(teamBoard());
  const list = $('div', 'card scroll');
  const ol = $('div', 'plist');
  const byScore = players().slice().sort((a, b) => b.score - a.score);
  byScore.forEach((p, i) => {
    const r = rows.find(x => x.id === p.id);
    const row = $('div', 'prow' + (p.id === me.pid ? ' me' : ''));
    const n = $('div', 'rank-n' + (i === 0 ? ' top' : ''), String(i + 1));
    const av = $('div', 'avatar', p.name.slice(0, 1));
    av.style.background = p.team ? TEAMS[p.team].color : colorOf(p.id);
    av.style.width = av.style.height = '30px'; av.style.fontSize = '14px';
    const mid = $('div', 'grow');
    mid.appendChild($('div', 'nm', p.name));
    const sub = $('div', 'muted');
    sub.style.fontSize = '12px';
    sub.textContent = r ? (step.k === 'game'
      ? (r.missed ? '기록 없음' : `${GAMES[step.id].fmt(r.v)} · ${r.rank}등`)
      : (r.label || '')) : '불참';
    mid.appendChild(sub);
    const delta = r ? (step.k === 'game' ? r.pts : r.pts) : 0;
    const pill = $('span', 'pill ' + (delta > 0 ? 'up' : delta < 0 ? 'down' : ''), (delta > 0 ? '+' : '') + delta);
    const sc = $('div', 'sc', p.score + '점');
    row.append(n, av, mid, pill, sc);
    ol.appendChild(row);
  });
  list.appendChild(ol);
  wrap.appendChild(list);
  const nextIn = $('div', 'muted center', '');
  wrap.appendChild(nextIn);
  if (isHost()) {
    const skip = $('button', 'btn ghost', '바로 다음으로');
    skip.onclick = () => api('host', { code: room.code, token: me.token, cmd: 'skip' }).then(applyRoom).catch(() => {});
    wrap.appendChild(skip);
  }
  stage.appendChild(wrap);
  const t = setInterval(() => {
    const s = Math.ceil(remaining() / 1000);
    const left = room.plan.length - room.step - 1;
    nextIn.textContent = left > 0 ? `${s}초 후 다음 (${left}개 남음)` : `${s}초 후 최종 결과`;
  }, 150);
  mounted.teardown = () => clearInterval(t);
}

/* ---------- 최종 결과 ---------- */
function mountFinal() {
  const wrap = $('div', 'play-area');
  const drum = $('div', 'panel-big');
  const t1 = $('h2', 'big', '최종 결과');
  const t2 = $('div', 'huge', '3');
  t2.style.color = 'var(--danger)';
  drum.append($('div', 'tag', '청소 당첨자 발표'), t1, t2, $('div', 'muted', '두구두구두구…'));
  wrap.appendChild(drum);
  stage.appendChild(wrap);
  SFX.roll();
  let n = 3;
  const t = setInterval(() => {
    n--; t2.textContent = n > 0 ? n : '!';
    SFX.tick();
    if (n <= 0) { clearInterval(t); showFinal(wrap); }
  }, 800);
  mounted.teardown = () => clearInterval(t);
}
function showFinal(wrap) {
  wrap.replaceChildren();
  const losers = room.losers || [];
  const amLoser = losers.includes(me.pid);
  const head = $('div', 'card center pop');
  head.style.borderColor = amLoser ? 'var(--danger)' : 'var(--good)';
  head.append($('div', 'tag', '청소 당첨'));
  const big = $('h2', 'big', amLoser ? '당첨… 청소는 제 몫' : '살았다!');
  big.style.color = amLoser ? 'var(--danger)' : 'var(--good)';
  head.appendChild(big);
  const tr = room.teamResult;
  if (tr) {
    const win = tr.lose === 'A' ? 'B' : 'A';
    const line = $('div', '');
    line.style.cssText = 'margin-top:8px;font-weight:800;font-size:16px';
    line.innerHTML = `<span style="color:${TEAMS[win].color}">${TEAMS[win].name} 승</span> ` +
      `<span class="muted">평균 ${tr[win].avg} vs ${tr[tr.lose].avg}</span><br>` +
      `<span style="color:${TEAMS[tr.lose].color}">${TEAMS[tr.lose].name} 전원 청소</span>`;
    head.appendChild(line);
  }
  wrap.appendChild(head);

  const box = $('div'); box.style.cssText = 'display:flex;flex-direction:column;gap:10px';
  losers.forEach(id => {
    const p = room.players[id]; if (!p) return;
    const c = $('div', 'loser-card pop');
    const av = $('div', 'avatar', p.name.slice(0, 1));
    av.style.background = p.team ? TEAMS[p.team].color : colorOf(id);
    av.style.width = av.style.height = '46px'; av.style.fontSize = '20px';
    const mid = $('div', 'grow');
    const nm = $('div', ''); nm.style.cssText = 'font-family:var(--display);font-size:26px'; nm.textContent = p.name;
    mid.append(nm, $('div', 'muted', p.score + '점 · 최하위'));
    c.append(av, mid, $('div', 'pill down', '청소'));
    box.appendChild(c);
  });
  wrap.appendChild(box);

  const list = $('div', 'card scroll');
  list.append($('h3', '', '최종 순위'));
  const ol = $('div', 'plist'); ol.style.marginTop = '10px';
  (room.finalRank || []).forEach(r => {
    const p = room.players[r.id]; if (!p) return;
    const row = $('div', 'prow' + (r.id === me.pid ? ' me' : ''));
    const n = $('div', 'rank-n' + (r.rank === 1 ? ' top' : ''), String(r.rank));
    const av = $('div', 'avatar', p.name.slice(0, 1));
    av.style.background = r.team ? TEAMS[r.team].color : colorOf(r.id);
    av.style.width = av.style.height = '30px'; av.style.fontSize = '14px';
    const mid = $('div', 'grow');
    mid.append($('div', 'nm', p.name), (() => {
      const s = $('div', 'muted'); s.style.fontSize = '12px';
      s.textContent = (r.team ? TEAMS[r.team].name + ' · ' : '') + `1등 ${r.wins}회`;
      return s;
    })());
    row.append(n, av, mid);
    if (r.exempt) row.appendChild($('span', 'pill gold', '면제'));
    if ((room.losers || []).includes(r.id)) row.appendChild($('span', 'pill down', '청소'));
    row.appendChild($('div', 'sc', r.score + '점'));
    ol.appendChild(row);
  });
  list.appendChild(ol);
  wrap.appendChild(list);

  if (isHost()) {
    const again = $('button', 'btn gold', '한 판 더 (로비로)');
    again.onclick = () => api('host', { code: room.code, token: me.token, cmd: 'restart' }).then(applyRoom).catch(() => {});
    wrap.appendChild(again);
  }
  const out = $('button', 'btn ghost', '나가기');
  out.onclick = () => leaveLocal();
  wrap.appendChild(out);

  if (amLoser) SFX.lose(); else { SFX.win(); confetti(); }
}
function confetti() {
  for (let i = 0; i < 60; i++) {
    const c = $('div', 'confetti');
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = COLORS[i % COLORS.length];
    c.style.animation = `fall ${1.6 + Math.random() * 1.6}s linear ${Math.random() * .6}s forwards`;
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4200);
  }
}

/* ---------- 시작 ---------- */
(async function boot() {
  const hash = (location.hash || '').replace('#', '').toUpperCase();
  if (me.code && me.pid) {
    try { applyRoom(await api('state')); startPolling(); keepAwake(); return; }
    catch (e) { me.code = me.pid = me.token = null; save(); }
  }
  renderHome();
  if (/^[A-Z0-9]{4}$/.test(hash)) {
    const el = document.getElementById('codeInput');
    if (el) el.value = hash;
  }
})();
})();
</script>
</body>
</html>
