const KR = '"Noto Serif KR","Nanum Myeongjo","Batang","AppleMyungjo",serif';

/* ================= 그리기 도우미 ================= */
function rr(g, x, y, w, h, r) {

    g.beginPath(); g.moveTo(-22, -48); g.lineTo(-22, -24); g.quadraticCurveTo(-22, -12, 0, -12); g.quadraticCurveTo(22, -12, 22, -24); g.lineTo(22, -48); g.stroke();

const CHAR_IMG = [];

async function startWave(i) {

async function popCells(cells, counts, chain) {
  const keys = new Set(cells.map(([r, c]) => r * COLS + c));
  for (const [r, c] of cells) for (const [dy, dx] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
    const ny = r + dy, nx = c + dx; if (ny < 0 || nx < 0 || ny >= ROWS || nx >= COLS) continue;
    const o = grid[ny][nx]; if (o && (o.t === HEART || o.t === GARB)) keys.add(ny * COLS + nx);
  }

    ctx.fillStyle = goldGrad(ctx, 0, 4); ctx.fillRect(0, 0, W, 1.5); ctx.fillRect(0, 198, W, 1.5);
    ctx.globalAlpha = sl * .18; ctx.fillStyle = "#fff"; for (let i = 0; i < 10; i++) ctx.fillRect(((time * 1400 + i * 97) % (W + 300)) - 300, 14 + i * 18, 220, 1.5);
    ctx.globalAlpha = sl;
    ctx.save(); ctx.translate(-120 + sl * 270, 98); ctx.shadowColor = c.light; ctx.shadowBlur = 30; paintEmblem(ctx, cutin.i, 1.65); ctx.restore();
    otext(pd.cls, W - 40 - (1 - sl) * 160, 52, 16, GOLD, { en: true, lw: 0, align: "right", spacing: 6 });
    otext(cutin.name, W - 40 - (1 - sl) * 160, 102, 50, "#fff", { lw: 0, align: "right", glow: c.light, w: 900 });
    otext(pd.desc, W - 40 - (1 - sl) * 160, 150, 18, "#d8cfbd", { lw: 0, align: "right" });
    ctx.restore();
  }
}
function drawAmbient() {
  ctx.save(); ctx.globalCompositeOperation = "lighter";
  for (const e of embers) {
    const y = e.y, x = e.x + Math.sin(time + e.ph) * 10;
    ctx.globalAlpha = .35 + Math.sin(time * 3 + e.ph) * .25; ctx.fillStyle = "#ffb070"; ell(ctx, x, y, e.s, e.s); ctx.fill();
  }
  ctx.restore();
}
function drawTitle() {
  ctx.drawImage(BG, 0, 0); drawAmbient();
  ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(W / 2, 960);
  for (let i = 0; i < 6; i++) {
    const a = time * .25 + i * Math.PI / 3, x = Math.cos(a) * 230, y = Math.sin(a) * 70, s = .75 + (Math.sin(a) + 1) * .2;
    ctx.globalAlpha = .55 + (Math.sin(a) + 1) * .22;
    ctx.drawImage(TK[i < 5 ? i : HEART], x - 50 * s, y - 50 * s, 100 * s, 100 * s);
  }
  ctx.globalAlpha = 1; ctx.restore();
  ctx.save(); ctx.translate(W / 2, 600);
  ctx.globalAlpha = .9; ctx.fillStyle = goldGrad(ctx, -4, 4); ctx.fillRect(-250, -122, 500, 1); ctx.fillRect(-250, 72, 500, 1);
  ctx.fillStyle = GOLD; diamond(ctx, 0, -122, 7); ctx.fill(); diamond(ctx, 0, 72, 7); ctx.fill();
  ctx.globalAlpha = 1;
  otext("RUNE", 0, -70, 84, goldGrad(ctx, -110, -30), { en: true, lw: 0, glow: "rgba(255,200,120,.45)", spacing: 18, w: 800 });
  otext("CHAIN", 0, 10, 84, goldGrad(ctx, -30, 50), { en: true, lw: 0, glow: "rgba(255,200,120,.45)", spacing: 18, w: 800 });

  ctx.restore();
  ctx.globalAlpha = .45 + Math.sin(time * 2.4) * .35;

}
function drawEnd(win) {
  ctx.fillStyle = "rgba(0,0,0,.72)"; ctx.fillRect(0, 0, W, H);
  frame9(80, 300, W - 160, 480, 6);

  otext(win ? "잿빛 성채를 탈환했다" : "기사단이 쓰러졌다", W / 2, 448, 22, "#d8cfbd", { lw: 0 });
  ctx.fillStyle = "rgba(216,180,106,.35)"; ctx.fillRect(160, 490, W - 320, 1);

  btn = { x: W / 2 - 150, y: 670, w: 300, h: 70 };

  ctx.strokeStyle = GOLD; ctx.lineWidth = 1.5; ctx.strokeRect(btn.x, btn.y, btn.w, btn.h);

function draw() {
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  ctx.drawImage(BG, 0, 0); drawAmbient();
  drawEnemies(); drawTop(); drawParty();
  otext(`LINK  ${path.length} / ${maxTrace}`, BX, BY - 26, 15, maxTrace > 5 ? GOLD_L : "#bfc2d6", { en: true, lw: 0, align: "left", spacing: 2 });
  otext(target ? "타겟 고정됨" : "적을 터치해 타겟 지정", W - BX, BY - 26, 14, "rgba(216,180,106,.85)", { lw: 0, align: "right" });
  drawBoard(); drawEffects();
  ctx.restore();

}

/* ================= 시작 ================= */
let lastT = performance.now();
function frame(now) { const dt = Math.min(.05, (now - lastT) / 1000); lastT = now; update(dt); draw(); requestAnimationFrame(frame); }
function boot() { buildTokens(); buildChars(); buildBg(); requestAnimationFrame(frame); }
const fontsReady = document.fonts && document.fonts.load
