<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>코드 러시</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
[hidden] { display: none !important; }
html, body { margin: 0; padding: 0; }
/* Layout: one-screen game. HUD strip on top, a 4-lane canvas fills the rest, start and result sheets float over the canvas. */
:root {
  --bg: #0d0f1f;
  --panel: #161a36;
  --lane-a: #12152e;
  --lane-b: #171b3a;
  --edge: #2b3166;
  --fg: #eeecff;
  --muted: #9296c7;
  --scrim: rgba(13, 15, 31, 0.88);
  --c0: #ff5c8a;
  --c1: #ffb84d;
  --c2: #43e0b5;
  --c3: #5aa9ff;
  --perfect: #ffd84d;
  --great: #5af0c0;
  --good: #7fb6ff;
  --miss: #ff5c7a;
  --display: "Do Hyeon", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
  box-sizing: border-box;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.5;
  -webkit-user-select: none;
  user-select: none;
  overflow: hidden;
}
.app {
  max-width: 480px;
  height: 100%;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.hud { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 12px; min-width: 0; }
.stat { display: flex; flex-direction: column; min-width: 0; }
.stat.right { align-items: flex-end; }
.lbl { font-size: 11px; letter-spacing: 0.12em; color: var(--muted); }
.num { font-family: var(--display); font-size: 30px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.time { font-family: var(--display); font-size: 18px; color: var(--muted); font-variant-numeric: tabular-nums; padding-bottom: 3px; }
#mult { font-size: 22px; color: var(--perfect); }
.prog { height: 4px; border-radius: 2px; background: var(--edge); overflow: hidden; }
.prog i { display: block; height: 100%; width: 0; background: var(--fg); }
.stage { position: relative; flex: 1; min-height: 0; border-radius: 14px; overflow: hidden; background: var(--bg); border: 1px solid var(--edge); }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
.sheet {
  position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center;
  gap: 16px; padding: 24px 20px; text-align: center; background: var(--scrim); overflow: auto;
}
.title { font-family: var(--display); font-weight: 400; font-size: clamp(44px, 14vw, 64px); line-height: 1; margin: 0; letter-spacing: 0.02em; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); max-width: 30ch; text-wrap: balance; }
.keys { display: flex; gap: 10px; }
.key {
  width: 46px; height: 46px; border-radius: 10px; display: grid; place-items: center;
  font-family: var(--display); font-size: 22px; color: var(--bg);
}
.k0 { background: var(--c0); } .k1 { background: var(--c1); } .k2 { background: var(--c2); } .k3 { background: var(--c3); }
.how { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; max-width: 34ch; color: var(--fg); font-size: 14px; }
.how li { text-wrap: pretty; }
.how b { font-weight: 700; }
.j-p { color: var(--perfect); } .j-g { color: var(--great); } .j-o { color: var(--good); } .j-m { color: var(--miss); }
.btn {
  font-family: var(--display); font-size: 24px; letter-spacing: 0.04em; color: var(--bg); background: var(--perfect);
  border: 0; border-radius: 12px; padding: 12px 36px; cursor: pointer; min-width: 180px;
}
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(1px); }
.btn:focus-visible, .quit:focus-visible { outline: 3px solid var(--c3); outline-offset: 3px; }
.rec { margin: 0; font-size: 12px; color: var(--muted); }
.kicker { margin: 0; font-size: 12px; letter-spacing: 0.2em; color: var(--muted); }
.rank { font-family: var(--display); font-size: clamp(88px, 28vw, 132px); line-height: 0.95; }
.r-S { color: var(--perfect); } .r-A { color: var(--great); } .r-B { color: var(--good); } .r-C { color: var(--c1); } .r-D { color: var(--miss); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 28px; margin: 0; width: 100%; max-width: 320px; }
.stats div { display: flex; flex-direction: column; align-items: center; min-width: 0; }
.stats dt { font-size: 11px; letter-spacing: 0.12em; color: var(--muted); }
.stats dd { margin: 0; font-family: var(--display); font-size: 28px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.counts { margin: 0; font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 14px; justify-content: center; font-variant-numeric: tabular-nums; }
.pts { margin: 0; font-size: 13px; color: var(--muted); max-width: 34ch; text-wrap: balance; }
.quit {
  font-family: var(--body); font-size: 12px; color: var(--muted); background: transparent; border: 1px solid var(--edge);
  border-radius: 8px; padding: 2px 10px; cursor: pointer; margin-top: 4px;
}
@media (max-height: 560px) { .sheet { justify-content: flex-start; } }
@media (prefers-reduced-motion: reduce) { .btn:active { transform: none; } }
</style>
</head>
<body>
<main class="app">
  <header class="hud">
    <div class="stat"><span class="lbl">점수</span><span class="num" id="score">0</span></div>
    <div class="time" id="time">0:00</div>
    <div class="stat right"><span class="lbl">배율</span><span class="num" id="mult">×1.0</span></div>
  </header>
  <div class="prog" aria-hidden="true"><i id="bar"></i></div>
  <div class="stage" id="stage">
    <canvas id="cv" aria-label="리듬게임 화면"></canvas>

    <section id="start" class="sheet">
      <h1 class="title" aria-label="코드 러시"><span style="color:var(--c0)">코</span><span style="color:var(--c1)">드</span> <span style="color:var(--c2)">러</span><span style="color:var(--c3)">시</span></h1>
      <p class="lede">1분짜리 곡을 내 손으로 연주하는 4레인 리듬게임</p>
      <div class="keys" aria-hidden="true">
        <span class="key k0">D</span><span class="key k1">F</span><span class="key k2">J</span><span class="key k3">K</span>
      </div>
      <ul class="how">
        <li>키보드 <b>D · F · J · K</b> 또는 화면 터치로 레인을 쳐요.</li>
        <li>노트가 아래 선에 닿을 때 누르면 그 구간의 코드음이 연주돼요.</li>
        <li><span class="j-p">Perfect</span> · <span class="j-g">Great</span> · <span class="j-o">Good</span>은 콤보 +1, <span class="j-m">Miss</span>는 콤보가 0으로 돌아가요.</li>
      </ul>
      <button id="go" class="btn" type="button">게임 시작</button>
      <p id="rec" class="rec" hidden></p>
    </section>

    <section id="result" class="sheet" hidden>
      <p class="kicker">결과</p>
      <div class="rank" id="rk">S</div>
      <dl class="stats">
        <div><dt>점수</dt><dd id="rScore">0</dd></div>
        <div><dt>정확도</dt><dd id="rAcc">0%</dd></div>
        <div><dt>최대 콤보</dt><dd id="rCombo">0</dd></div>
        <div><dt>획득 포인트</dt><dd id="rGain">0</dd></div>
      </dl>
      <p class="counts" id="cnt"></p>
      <p class="pts" id="ptsline"></p>
      <button id="again" class="btn" type="button">다시 하기</button>
    </section>
  </div>
  <button id="quit" class="quit" type="button" hidden>그만두기</button>
</main>

<script>
(() => {
'use strict';

// ---- Song and chart constants -------------------------------------------
const BPM = 128, BEAT = 60 / BPM, S16 = BEAT / 4, BAR = BEAT * 4, BARS = 32, SONG = BAR * BARS; // 60.0 seconds
const LEAD = 1.8;          // seconds between pressing start and the first beat of the song
const FALL = 1.5;          // seconds a note takes to fall to the hit line
const PERF = 0.06, GREAT = 0.11, GOOD = 0.16;   // timing windows in seconds
const BASE = { p: 1000, gr: 700, go: 400 };
const WEIGHT = { p: 1, gr: 0.7, go: 0.4 };
const END_AT = SONG + 0.6;
const KEYS = { KeyD: 0, KeyF: 1, KeyJ: 2, KeyK: 3 };
const KEYLABEL = ['D', 'F', 'J', 'K'];

// Chord per bar repeats Am - F - C - G. Each lane plays one chord tone of the current chord.
const CHORDS = [
  { tones: [69, 72, 76, 81], pad: [57, 60, 64], bass: 45 },
  { tones: [65, 69, 72, 77], pad: [53, 57, 60], bass: 41 },
  { tones: [72, 76, 79, 84], pad: [60, 64, 67], bass: 48 },
  { tones: [67, 71, 74, 79], pad: [55, 59, 62], bass: 43 }
];

// One string per bar, 16 sixteenth-note slots. A digit is the lane (0-3) of a note, a dot is a rest.
const PATTERNS = [
  "0...1...2...1...", "0...2...3...2...", "0...1...2...1...", "0...2...3...2...",
  "0.1.2.3.2...1...", "0...1.2.3...2.1.", "0.1.2.1.0.1.2...", "3...2.1.0...1.2.",
  "0.1.2.3.2.1.2...", "0..1..2..3..2.1.", "0.1.2.3.3.2.1.0.", "3...2...1...0...",
  "0.1.2.3.0.1.2.3.", "1.2.3.2.1.2.3.2.", "0.1.0.1.2.3.2.3.", "0.1.2.3.0123....",
  "0.1.2.3.2.3.2.1.", "3.2.1.2.3.2.1.0.", "0.12.3.0.12.3.2.", "3.2.12.3.2.1.0.3",
  "0.1.2.3.1.2.3.2.", "2.3.2.1.2.3.2.1.", "0.0.1.1.2.2.3.3.", "3.2.1.0.0123....",
  "0123.2.1.0123.2.", "3210.1.2.3210.1.", "01.23.01.23.01.2", "3.2.1.0.1.2.3.2.",
  "0123.2.1.0123.2.", "3210.1.2.3210.1.", "0...1...2...3...", "3..............."
];

const notes = [];
PATTERNS.forEach((p, b) => {
  for (let i = 0; i < 16; i++) {
    const ch = p[i];
    if (ch === '.') continue;
    const lane = +ch;
    notes.push({ t: (b * 16 + i) * S16, lane, midi: CHORDS[b % 4].tones[lane], state: 0 });
  }
});
notes.sort((a, b) => a.t - b.t);

// ---- DOM and canvas ------------------------------------------------------
const $ = s => document.querySelector(s);
const cv = $('#cv'), g = cv.getContext('2d'), stage = $('#stage');
const scoreEl = $('#score'), multEl = $('#mult'), timeEl = $('#time'), barEl = $('#bar');
const startSheet = $('#start'), resultSheet = $('#result'), quitBtn = $('#quit');
const css = getComputedStyle(document.documentElement);
const tok = n => css.getPropertyValue(n).trim();
const C = {
  bg: tok('--bg'), laneA: tok('--lane-a'), laneB: tok('--lane-b'), fg: tok('--fg'), muted: tok('--muted'), edge: tok('--edge'),
  lane: [tok('--c0'), tok('--c1'), tok('--c2'), tok('--c3')],
  p: tok('--perfect'), gr: tok('--great'), go: tok('--good'), m: tok('--miss')
};
const FONT = tok('--display');
let W = 300, H = 500, dpr = 1;
const PAD = 10;

function resize() {
  const r = stage.getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(1, r.width); H = Math.max(1, r.height);
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
}
new ResizeObserver(resize).observe(stage);
resize();

// ---- Saved record --------------------------------------------------------
const KEY = 'chordrush.v1';
function loadRec() {
  try {
    const r = JSON.parse(localStorage.getItem(KEY) || '{}');
    return { best: +r.best || 0, points: +r.points || 0, plays: +r.plays || 0 };
  } catch (e) { return { best: 0, points: 0, plays: 0 }; }
}
function saveRec(r) { try { localStorage.setItem(KEY, JSON.stringify(r)); } catch (e) { /* storage unavailable */ } }
function showRec() {
  const r = loadRec(), el = $('#rec');
  if (r.plays > 0) {
    el.hidden = false;
    el.textContent = '최고 점수 ' + r.best.toLocaleString('ko-KR') + ' · 누적 포인트 ' + r.points.toLocaleString('ko-KR') + ' P';
  } else { el.hidden = true; }
}
showRec();

// ---- Game state ----------------------------------------------------------
let ctx = null, bus = null, leadBus = null, noiseBuf = null, songStart = 0;
let playing = false;
let score = 0, combo = 0, maxCombo = 0, counts = { p: 0, gr: 0, go: 0, m: 0 };
let flashUntil = [0, 0, 0, 0];
let judge = null, comboPopAt = 0;
let fx = [];
let lastHud = { score: '', mult: '', time: '' };

function resetState() {
  notes.forEach(n => { n.state = 0; });
  score = 0; combo = 0; maxCombo = 0; counts = { p: 0, gr: 0, go: 0, m: 0 };
  flashUntil = [0, 0, 0, 0]; judge = null; fx = [];
  lastHud = { score: '', mult: '', time: '' };
  updateHud(-LEAD);
}

// ---- Audio ---------------------------------------------------------------
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

function makeAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  ctx = new AC();
  const master = ctx.createGain(); master.gain.value = 0.9;
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -16; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.2;
  master.connect(comp); comp.connect(ctx.destination);
  bus = ctx.createGain(); bus.gain.value = 0.62; bus.connect(master);
  leadBus = ctx.createGain(); leadBus.gain.value = 0.72; leadBus.connect(master);
  noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}

function kick(t, v) {
  const o = ctx.createOscillator(), a = ctx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(165, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.13);
  a.gain.setValueAtTime(0.0001, t); a.gain.exponentialRampToValueAtTime(0.95 * v, t + 0.004); a.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
  o.connect(a); a.connect(bus); o.start(t); o.stop(t + 0.32);
}
function noiseHit(t, type, freq, q, peak, dur) {
  const s = ctx.createBufferSource(); s.buffer = noiseBuf;
  const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const a = ctx.createGain(); a.gain.setValueAtTime(peak, t); a.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(a); a.connect(bus); s.start(t); s.stop(t + dur + 0.02);
}
function snare(t, v) {
  noiseHit(t, 'bandpass', 1900, 0.7, 0.5 * v, 0.16);
  const o = ctx.createOscillator(), a = ctx.createGain();
  o.type = 'triangle'; o.frequency.setValueAtTime(190, t); o.frequency.exponentialRampToValueAtTime(120, t + 0.09);
  a.gain.setValueAtTime(0.35 * v, t); a.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
  o.connect(a); a.connect(bus); o.start(t); o.stop(t + 0.14);
}
function hat(t, v, open) { noiseHit(t, 'highpass', 8000, 0.7, 0.16 * v, open ? 0.2 : 0.045); }
function crash(t) { noiseHit(t, 'highpass', 4500, 0.7, 0.3, 1.5); }
function bass(t, m, dur, v) {
  const o = ctx.createOscillator(), f = ctx.createBiquadFilter(), a = ctx.createGain();
  o.type = 'sawtooth'; o.frequency.value = mtof(m);
  f.type = 'lowpass'; f.frequency.setValueAtTime(700, t); f.frequency.exponentialRampToValueAtTime(260, t + dur); f.Q.value = 3;
  a.gain.setValueAtTime(0.0001, t); a.gain.exponentialRampToValueAtTime(0.5 * v, t + 0.01); a.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(f); f.connect(a); a.connect(bus); o.start(t); o.stop(t + dur + 0.02);
}
function pad(t, tones, dur) {
  tones.forEach(m => {
    const o = ctx.createOscillator(), f = ctx.createBiquadFilter(), a = ctx.createGain();
    o.type = 'triangle'; o.frequency.value = mtof(m);
    f.type = 'lowpass'; f.frequency.value = 1400;
    a.gain.setValueAtTime(0.0001, t);
    a.gain.linearRampToValueAtTime(0.05, t + 0.3);
    a.gain.setValueAtTime(0.05, t + dur - 0.35);
    a.gain.linearRampToValueAtTime(0.0001, t + dur);
    o.connect(f); f.connect(a); a.connect(bus); o.start(t); o.stop(t + dur + 0.02);
  });
}

function scheduleBacking(t0) {
  for (let b = 0; b < BARS; b++) {
    const bt = t0 + b * BAR, ch = CHORDS[b % 4];
    pad(bt, ch.pad, b === BARS - 1 ? BAR + 0.6 : BAR + 0.12);
    if (b === 4 || b === 16 || b === 24 || b === 31) crash(bt);
    for (let beat = 0; beat < 4; beat++) {
      const t = bt + beat * BEAT;
      if (b < 4) { if (beat % 2 === 0) kick(t, 0.8); }
      else if (b < 30) kick(t, 1);
      else if (b === 30) kick(t, 0.8);
      else if (beat === 0) kick(t, 1);
      if (b >= 4 && b < 30 && (beat === 1 || beat === 3)) snare(t, 1);
    }
    for (let i = 0; i < 16; i++) {
      const t = bt + i * S16;
      if (b >= 2 && b < 4 && i % 4 === 2) hat(t, 0.6, false);
      else if (b >= 4 && b < 16 && i % 4 === 2) hat(t, 1, false);
      else if (b >= 16 && b < 24 && i % 2 === 0) hat(t, i % 4 === 2 ? 1 : 0.6, i % 4 === 2);
      else if (b >= 24 && b < 30) hat(t, i % 4 === 2 ? 1 : 0.5, false);
      if (b === 15 && (i === 8 || i === 10 || i === 12 || i === 13 || i === 14 || i === 15)) snare(t, 0.6);
    }
    let bi;
    if (b < 4) bi = [0, 8];
    else if (b < 30) bi = [0, 3, 6, 8, 11, 14];
    else if (b === 30) bi = [0, 8];
    else bi = [0];
    bi.forEach(i => bass(bt + i * S16, ch.bass, S16 * 2.6, b < 4 ? 0.6 : 1));
  }
}

function playLead(m, vel) {
  const t = ctx.currentTime, f = mtof(m);
  const lp = ctx.createBiquadFilter(), a = ctx.createGain();
  lp.type = 'lowpass'; lp.frequency.setValueAtTime(5200, t); lp.frequency.exponentialRampToValueAtTime(1400, t + 0.3);
  a.gain.setValueAtTime(0.0001, t); a.gain.exponentialRampToValueAtTime(0.5 * vel, t + 0.006); a.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
  [['sawtooth', 1], ['square', 1.005]].forEach(([type, mul]) => {
    const o = ctx.createOscillator(), og = ctx.createGain();
    o.type = type; o.frequency.value = f * mul; og.gain.value = 0.5;
    o.connect(og); og.connect(lp); o.start(t); o.stop(t + 0.6);
  });
  lp.connect(a); a.connect(leadBus);
}

// ---- Judging and scoring -------------------------------------------------
function multiplier() { return 1 + Math.min(Math.floor(combo / 10), 10) * 0.1; }

function setJudge(kind) {
  judge = { kind, at: performance.now() };
}

function press(lane) {
  if (!playing) return;
  const now = ctx.currentTime - songStart;
  flashUntil[lane] = now + 0.12;
  let target = null, dt = 0;
  for (const n of notes) {
    if (n.lane !== lane || n.state !== 0) continue;
    const d = n.t - now;
    if (d < -GOOD) continue;
    if (d > GOOD) break;
    target = n; dt = d; break;
  }
  if (!target) return;
  const err = Math.abs(dt);
  const k = err <= PERF ? 'p' : err <= GREAT ? 'gr' : 'go';
  target.state = 1;
  counts[k]++;
  score += Math.round(BASE[k] * multiplier());
  combo++;
  if (combo > maxCombo) maxCombo = combo;
  comboPopAt = performance.now();
  playLead(target.midi, k === 'p' ? 1 : k === 'gr' ? 0.85 : 0.65);
  setJudge(k);
  burst(lane, C.lane[lane]);
}

function checkMisses(now) {
  for (const n of notes) {
    if (n.state !== 0) continue;
    if (n.t >= now - GOOD) break;
    n.state = 2;
    counts.m++;
    combo = 0;
    setJudge('m');
  }
}

// ---- Effects -------------------------------------------------------------
function layout() {
  const laneW = (W - PAD * 2) / 4, hitY = Math.round(H * 0.78);
  return { laneW, hitY };
}
function burst(lane, color) {
  const { laneW, hitY } = layout();
  const x = PAD + lane * laneW + laneW / 2;
  fx.push({ type: 'ring', x, y: hitY, age: 0, life: 0.35, color, laneW });
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) return;
  for (let i = 0; i < 7; i++) {
    const a = -Math.PI * (0.15 + 0.7 * Math.random());
    const sp = 120 + Math.random() * 220;
    fx.push({ type: 'spark', x, y: hitY, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, age: 0, life: 0.45, color });
  }
}

// ---- Drawing -------------------------------------------------------------
function rr(x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

function draw(now, dt) {
  const { laneW, hitY } = layout();
  const yOf = t => hitY - ((t - now) / FALL) * (hitY + 30);
  g.globalAlpha = 1;
  g.fillStyle = C.bg; g.fillRect(0, 0, W, H);

  for (let i = 0; i < 4; i++) {
    g.fillStyle = i % 2 ? C.laneB : C.laneA;
    g.fillRect(PAD + i * laneW, 0, laneW, hitY);
  }

  if (playing) {
    for (let k = Math.floor((now - 0.25) / BEAT); ; k++) {
      const t = k * BEAT, y = yOf(t);
      if (y < -4) break;
      if (t < 0 || t > SONG) continue;
      g.globalAlpha = k % 4 === 0 ? 0.2 : 0.07;
      g.fillStyle = C.fg; g.fillRect(PAD, y - 0.5, laneW * 4, 1);
    }
    g.globalAlpha = 1;
  }

  for (let i = 0; i < 4; i++) {
    if (flashUntil[i] > now) {
      const al = (flashUntil[i] - now) / 0.12;
      g.fillStyle = C.lane[i];
      for (let s = 0; s < 8; s++) {
        const hh = hitY * 0.42 * (1 - s / 8);
        g.globalAlpha = al * 0.05;
        g.fillRect(PAD + i * laneW, hitY - hh, laneW, hh);
      }
    }
  }
  g.globalAlpha = 1;

  g.fillStyle = C.edge;
  for (let i = 0; i <= 4; i++) g.fillRect(PAD + i * laneW - 0.5, 0, 1, hitY);

  // combo number sits behind the notes
  if (playing && combo >= 2) {
    const pop = 1 + 0.22 * Math.max(0, 1 - (performance.now() - comboPopAt) / 130);
    const sz = Math.min(W * 0.2, 88) * pop;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.globalAlpha = 0.9; g.fillStyle = C.fg;
    g.font = sz + 'px ' + FONT;
    g.fillText(String(combo), W / 2, H * 0.33);
    g.globalAlpha = 0.6; g.fillStyle = C.muted;
    g.font = '13px ' + FONT;
    g.fillText('COMBO', W / 2, H * 0.33 - Math.min(W * 0.2, 88) * 0.72);
    g.globalAlpha = 1;
  }

  // notes
  const nh = Math.max(16, laneW * 0.24), nw = laneW * 0.8;
  for (const n of notes) {
    if (n.state === 1) continue;
    const y = yOf(n.t);
    if (y < -30 || y > H + 30) continue;
    const x = PAD + n.lane * laneW + laneW * 0.1;
    if (n.state === 2) {
      if (y > hitY + 90) continue;
      g.globalAlpha = 0.28; g.fillStyle = C.muted;
      rr(x, y - nh / 2, nw, nh, 6); g.fill();
      g.globalAlpha = 1;
      continue;
    }
    g.fillStyle = C.lane[n.lane];
    rr(x, y - nh / 2, nw, nh, 6); g.fill();
    g.globalAlpha = 0.3; g.fillStyle = C.fg;
    rr(x + 4, y - nh / 2 + 2, nw - 8, nh * 0.28, 3); g.fill();
    g.globalAlpha = 1;
  }

  // hit line and key caps
  const phase = playing && now >= 0 ? (now / BEAT) % 1 : 1;
  for (let i = 0; i < 4; i++) {
    const x = PAD + i * laneW;
    g.save();
    g.shadowColor = C.lane[i]; g.shadowBlur = 10 + 8 * (1 - phase);
    g.fillStyle = C.lane[i];
    g.fillRect(x + 2, hitY - 2, laneW - 4, 4);
    g.restore();
    const capH = Math.max(30, H - hitY - 22);
    const pressed = flashUntil[i] > now;
    g.globalAlpha = pressed ? 0.55 : 0.16;
    g.fillStyle = C.lane[i];
    rr(x + 5, hitY + 12, laneW - 10, capH, 10); g.fill();
    g.globalAlpha = 1;
    g.strokeStyle = C.lane[i]; g.lineWidth = 2;
    rr(x + 5, hitY + 12, laneW - 10, capH, 10); g.stroke();
    g.fillStyle = C.fg; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = Math.min(capH * 0.45, 30) + 'px ' + FONT;
    g.fillText(KEYLABEL[i], x + laneW / 2, hitY + 12 + capH / 2 + 1);
  }

  // effects
  for (let i = fx.length - 1; i >= 0; i--) {
    const e = fx[i];
    e.age += dt;
    if (e.age >= e.life) { fx.splice(i, 1); continue; }
    const k = e.age / e.life;
    if (e.type === 'ring') {
      g.globalAlpha = 1 - k; g.strokeStyle = e.color; g.lineWidth = 3;
      g.beginPath(); g.arc(e.x, e.y, e.laneW * 0.25 + k * e.laneW * 0.5, 0, Math.PI * 2); g.stroke();
    } else {
      e.x += e.vx * dt; e.y += e.vy * dt; e.vy += 700 * dt;
      g.globalAlpha = 1 - k; g.fillStyle = e.color;
      g.beginPath(); g.arc(e.x, e.y, 3, 0, Math.PI * 2); g.fill();
    }
  }
  g.globalAlpha = 1;

  // judgement text
  if (judge) {
    const age = (performance.now() - judge.at) / 1000;
    if (age < 0.7) {
      const al = age < 0.45 ? 1 : 1 - (age - 0.45) / 0.25;
      const sc = 1 + 0.3 * Math.max(0, 1 - age / 0.1);
      const txt = { p: 'PERFECT', gr: 'GREAT', go: 'GOOD', m: 'MISS' }[judge.kind];
      g.globalAlpha = al; g.fillStyle = C[judge.kind];
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.font = (judge.kind === 'm' ? 38 : 32) * sc + 'px ' + FONT;
      g.fillText(txt, W / 2, H * 0.5);
      g.globalAlpha = 1;
    }
  }
}

// ---- HUD -----------------------------------------------------------------
function fmtTime(s) {
  s = Math.max(0, Math.min(Math.floor(s), 60));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}
function updateHud(now) {
  const s = score.toLocaleString('ko-KR');
  if (s !== lastHud.score) { scoreEl.textContent = s; lastHud.score = s; }
  const m = '×' + multiplier().toFixed(1);
  if (m !== lastHud.mult) { multEl.textContent = m; lastHud.mult = m; }
  const t = fmtTime(now) + ' / 1:00';
  if (t !== lastHud.time) { timeEl.textContent = t; lastHud.time = t; }
  barEl.style.width = Math.max(0, Math.min(1, now / SONG)) * 100 + '%';
}

// ---- Flow ----------------------------------------------------------------
function start() {
  resetState();
  if (ctx) { try { ctx.close(); } catch (e) { /* already closed */ } }
  makeAudio();
  if (ctx.resume) ctx.resume();
  songStart = ctx.currentTime + LEAD + 0.05;
  scheduleBacking(songStart);
  startSheet.hidden = true; resultSheet.hidden = true; quitBtn.hidden = false;
  playing = true;
}

function closeAudioLater() {
  const old = ctx; ctx = null;
  if (old) setTimeout(() => { try { old.close(); } catch (e) { /* already closed */ } }, 2600);
}

function finish() {
  playing = false; quitBtn.hidden = true;
  const total = notes.length;
  const acc = (counts.p * WEIGHT.p + counts.gr * WEIGHT.gr + counts.go * WEIGHT.go) / total;
  const rank = acc >= 0.95 ? 'S' : acc >= 0.85 ? 'A' : acc >= 0.7 ? 'B' : acc >= 0.5 ? 'C' : 'D';
  const rankBonus = { S: 500, A: 300, B: 150, C: 50, D: 0 }[rank];
  const fcBonus = counts.m === 0 ? 300 : 0;
  const base = Math.round(score / 100);
  const gain = base + rankBonus + fcBonus;
  const rec = loadRec();
  rec.points += gain; rec.best = Math.max(rec.best, score); rec.plays += 1;
  saveRec(rec);
  const rk = $('#rk'); rk.textContent = rank; rk.className = 'rank r-' + rank;
  $('#rScore').textContent = score.toLocaleString('ko-KR');
  $('#rAcc').textContent = (acc * 100).toFixed(1) + '%';
  $('#rCombo').textContent = maxCombo + ' / ' + total;
  $('#rGain').textContent = '+' + gain.toLocaleString('ko-KR');
  $('#cnt').innerHTML =
    '<span class="j-p">Perfect ' + counts.p + '</span><span class="j-g">Great ' + counts.gr + '</span>' +
    '<span class="j-o">Good ' + counts.go + '</span><span class="j-m">Miss ' + counts.m + '</span>';
  $('#ptsline').textContent =
    '점수 ÷ 100 = ' + base + 'P, 랭크 보너스 +' + rankBonus + 'P' + (fcBonus ? ', 풀콤보 보너스 +' + fcBonus + 'P' : '') +
    ' · 누적 포인트 ' + rec.points.toLocaleString('ko-KR') + 'P' + (score >= rec.best && rec.plays > 1 ? ' · 최고 점수 갱신' : '');
  resultSheet.hidden = false;
  closeAudioLater();
  setTimeout(() => $('#again').focus(), 50);
}

function quit() {
  playing = false; quitBtn.hidden = true;
  closeAudioLater();
  resetState();
  showRec();
  startSheet.hidden = false;
  $('#go').focus();
}

// ---- Input ---------------------------------------------------------------
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  const lane = KEYS[e.code];
  if (lane === undefined || !playing) return;
  e.preventDefault();
  press(lane);
});
cv.addEventListener('pointerdown', e => {
  if (!playing) return;
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  const laneW = (W - PAD * 2) / 4;
  const lane = Math.max(0, Math.min(3, Math.floor((e.clientX - r.left - PAD) / laneW)));
  press(lane);
});
$('#go').addEventListener('click', start);
$('#again').addEventListener('click', start);
quitBtn.addEventListener('click', quit);
document.addEventListener('visibilitychange', () => {
  if (!ctx || !playing) return;
  if (document.hidden) ctx.suspend(); else ctx.resume();
});

// ---- Main loop -----------------------------------------------------------
let lastTs = performance.now();
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0, (ts - lastTs) / 1000));
  lastTs = ts;
  let now = -LEAD;
  if (playing) {
    now = ctx.currentTime - songStart;
    checkMisses(now);
    updateHud(now);
    if (now >= END_AT) finish();
  }
  draw(now, dt);
}
requestAnimationFrame(frame);
$('#go').focus();
})();
</script>
</body>
